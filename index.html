    }

    function setTextViewerZoom(nextZoom) {
      textViewerZoom = Math.max(0.5, nextZoom);
      syncTextViewerWrapUi();
    }

    function attachTextViewerZoom(stage) {
      let pinchDistance = 0;
      let pinchStartZoom = textViewerZoom;
      const wheelHandler = (event) => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        const factor = Math.exp(-event.deltaY * 0.0015);
        setTextViewerZoom(textViewerZoom * factor);
      };
      const touchStartHandler = (event) => {
        if (event.touches.length !== 2) return;
        const [a, b] = event.touches;
        pinchDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        pinchStartZoom = textViewerZoom;
      };
      const touchMoveHandler = (event) => {
        if (event.touches.length !== 2 || !pinchDistance) return;
        event.preventDefault();
        const [a, b] = event.touches;
        const nextDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (!nextDistance) return;
        setTextViewerZoom(pinchStartZoom * (nextDistance / pinchDistance));
      };
      const touchEndHandler = () => {
        pinchDistance = 0;
      };

      stage.addEventListener('wheel', wheelHandler, { passive: false });
      stage.addEventListener('touchstart', touchStartHandler, { passive: false });
      stage.addEventListener('touchmove', touchMoveHandler, { passive: false });
      stage.addEventListener('touchend', touchEndHandler, { passive: true });

      return () => {
        stage.removeEventListener('wheel', wheelHandler);
        stage.removeEventListener('touchstart', touchStartHandler);
        stage.removeEventListener('touchmove', touchMoveHandler);
        stage.removeEventListener('touchend', touchEndHandler);
      };
    }

    function attachAudioVisualizer(audio, canvas, meta) {
      cleanupActiveAudioVisualizer();
      if (!canvas || !window.AudioContext) return;

      const ctx = canvas.getContext('2d');
      const audioContext = new window.AudioContext();
      const source = audioContext.createMediaElementSource(audio);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 128;
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      const samples = new Uint8Array(analyser.frequencyBinCount);
      let smoothedBars = new Float32Array(0);
      let rafId = 0;
      let stopped = false;

      const resizeCanvas = () => {
        const host = canvas.parentElement;
        if (!host) return;
        const ratio = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.floor(host.clientWidth * ratio));
        const height = Math.max(1, Math.floor(host.clientHeight * ratio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          canvas.style.width = `${host.clientWidth}px`;
          canvas.style.height = `${host.clientHeight}px`;
        }
      };

      const fillRoundedRect = (x, y, w, h, radius, fillStyle) => {
        const r = Math.min(radius, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
      };

      const draw = () => {
        if (stopped) return;
        resizeCanvas();
        analyser.getByteFrequencyData(samples);
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        const canvasGradient = ctx.createLinearGradient(0, 0, width, height);
        canvasGradient.addColorStop(0, 'rgba(255,255,255,0.98)');
        canvasGradient.addColorStop(0.44, 'rgba(249, 238, 255, 0.98)');
        canvasGradient.addColorStop(1, 'rgba(235, 245, 255, 0.98)');
        ctx.fillStyle = canvasGradient;
        ctx.fillRect(0, 0, width, height);
        const progress = audio.duration ? Math.min(1, audio.currentTime / audio.duration) : 0;
        const playedWidth = width * progress;
        const playedGlow = ctx.createLinearGradient(0, 0, playedWidth || 1, 0);
        playedGlow.addColorStop(0, 'rgba(255,255,255,0.03)');
        playedGlow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = playedGlow;
        ctx.fillRect(0, 0, playedWidth, height);
        ctx.fillStyle = 'rgba(255,255,255,0)';
        ctx.fillRect(playedWidth, 0, width - playedWidth, height);

        const bars = Math.max(14, Math.min(24, Math.round(width / 84)));
        if (smoothedBars.length !== bars) {
          smoothedBars = new Float32Array(bars);
        }
        const spanWidth = width * 0.9;
        const gap = width * 0.0045;
        const barWidth = (spanWidth - gap * (bars - 1)) / bars;
        const clusterStart = (width - spanWidth) / 2;
        const gradient = ctx.createLinearGradient(clusterStart, 0, clusterStart + spanWidth, 0);
        gradient.addColorStop(0, 'rgba(255, 184, 92, 0.92)');
        gradient.addColorStop(0.22, 'rgba(255, 232, 94, 0.96)');
        gradient.addColorStop(0.5, 'rgba(141, 255, 101, 0.94)');
        gradient.addColorStop(0.76, 'rgba(93, 214, 255, 0.92)');
        gradient.addColorStop(1, 'rgba(159, 141, 255, 0.9)');
        const glowGradient = ctx.createLinearGradient(clusterStart, 0, clusterStart + spanWidth, 0);
        glowGradient.addColorStop(0, 'rgba(255, 176, 66, 0.16)');
        glowGradient.addColorStop(0.5, 'rgba(108, 224, 255, 0.09)');
        glowGradient.addColorStop(1, 'rgba(159, 141, 255, 0.05)');
        fillRoundedRect(
          clusterStart - width * 0.015,
          height * 0.08,
          spanWidth + width * 0.03,
          height * 0.8,
          width * 0.022,
          glowGradient,
        );

        ctx.fillStyle = gradient;
        const floorY = height * 0.84;
        const maxBarHeight = height * 0.8;
        const minBarHeight = height * 0.22;
        const rawLevels = new Float32Array(bars);
        const usableBins = Math.max(bars, Math.floor(samples.length * 0.62));

        for (let i = 0; i < bars; i += 1) {
          const startIndex = Math.floor(((i / bars) ** 1.35) * usableBins);
          const endIndex = Math.max(startIndex + 1, Math.floor((((i + 1) / bars) ** 1.35) * usableBins));
          let sum = 0;
          let count = 0;
          for (let j = startIndex; j < endIndex; j += 1) {
            sum += samples[j] / 255;
            count += 1;
          }
          rawLevels[i] = count ? sum / count : 0;
        }

        for (let i = 0; i < bars; i += 1) {
          const leftLevel = rawLevels[Math.max(0, i - 1)];
          const centerLevel = rawLevels[i];
          const rightLevel = rawLevels[Math.min(bars - 1, i + 1)];
          const sample = leftLevel * 0.22 + centerLevel * 0.56 + rightLevel * 0.22;
          const edgeFade = 0.92 + (1 - Math.abs((i / Math.max(bars - 1, 1)) * 2 - 1)) * 0.08;
          const targetHeight = Math.max(minBarHeight, (sample ** 0.88) * maxBarHeight * edgeFade);
          const previousHeight = smoothedBars[i] || minBarHeight;
          const easing = targetHeight > previousHeight ? 0.16 : 0.1;
          const barHeight = previousHeight + (targetHeight - previousHeight) * easing;
          smoothedBars[i] = barHeight;
          const x = clusterStart + i * (barWidth + gap);
          const y = floorY - barHeight;
          const w = barWidth;
          const radius = Math.min(10, w / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, floorY, radius);
          ctx.arcTo(x + w, floorY, x, floorY, radius);
          ctx.arcTo(x, floorY, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
          ctx.fill();
        }
        rafId = requestAnimationFrame(draw);
      };

      audio.addEventListener('play', () => {
        audioContext.resume().catch(() => {});
      });
      draw();

      activeAudioVisualizerCleanup = () => {
        stopped = true;
        if (rafId) cancelAnimationFrame(rafId);
        source.disconnect();
        analyser.disconnect();
        audioContext.close().catch(() => {});
      };
    }

    function attachImageCompatibility(img, item, compact = false) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'image' && cached.supported === false) {
        if (compact) replaceThumbWithPlaceholder(img, item, 'image');
        else showUnsupportedMedia(item, 'image');
        return;
      }

      img.addEventListener('load', () => {
        setMediaCompatibility(item, { kind: 'image', supported: true });
      }, { once: true });

      img.addEventListener('error', () => {
        setMediaCompatibility(item, { kind: 'image', supported: false });
        if (compact) replaceThumbWithPlaceholder(img, item, 'image');
        else showUnsupportedMedia(item, 'image');
      }, { once: true });
    }

    function attachVideoCompatibility(video, item, compact = false) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'video' && cached.supported === false) {
        if (compact) replaceThumbWithPlaceholder(video, item, 'video');
        else showUnsupportedMedia(item, 'video');
        return;
      }

      let resolved = false;
      const markSupported = () => {
        if (resolved) return true;
        if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return false;
        resolved = true;
        setMediaCompatibility(item, { kind: 'video', supported: true });
        return true;
      };

      const markUnsupported = () => {
        if (resolved) return;
        resolved = true;
        setMediaCompatibility(item, { kind: 'video', supported: false });
        video.pause();
        if (compact) replaceThumbWithPlaceholder(video, item, 'video');
        else showUnsupportedMedia(item, 'video');
      };

      video.addEventListener('loadedmetadata', () => {
        if (markSupported()) {
          if (compact) {
            const previewTime = Math.min(0.08, Math.max(0.001, (video.duration || 0) / 4));
            if (previewTime > 0) {
              try {
                video.currentTime = previewTime;
              } catch (_) {}
            }
          }
          return;
        }
        markUnsupported();
      }, { once: true });

      if (compact) {
        video.addEventListener('seeked', () => {
          video.pause();
        });
      } else {
        video.addEventListener('timeupdate', () => {
          if ((video.currentTime || 0) > 0.35 && !markSupported()) {
            markUnsupported();
          }
        });
      }

      video.addEventListener('error', () => {
        markUnsupported();
      }, { once: true });
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2;
    }

    function animateChatScroll(target, duration = SMOOTH_SCROLL_DURATION) {
      if (scrollAnimationFrame) cancelAnimationFrame(scrollAnimationFrame);
      const start = chat.scrollTop;
      const maxTarget = Math.max(0, chat.scrollHeight - chat.clientHeight);
      const finalTarget = Math.max(0, Math.min(target, maxTarget));
      const delta = finalTarget - start;
      if (Math.abs(delta) < 1) {
        chat.scrollTop = finalTarget;
        updateScrollButtonState();
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        const startedAt = performance.now();
        const step = (now) => {
          const progress = Math.min(1, (now - startedAt) / duration);
          chat.scrollTop = start + delta * easeInOutCubic(progress);
          updateScrollButtonState();
          if (progress < 1) {
            scrollAnimationFrame = requestAnimationFrame(step);
          } else {
            scrollAnimationFrame = 0;
            resolve();
          }
        };
        scrollAnimationFrame = requestAnimationFrame(step);
      });
    }

    function getVisibleMessages() {
      if (currentFilter === 'file') return allMessages.filter((m) => m.kind === 'file');
      if (currentFilter === 'text') return allMessages.filter((m) => m.kind === 'text');
      return allMessages;
    }

    async function api(path, options = {}) {
      const cfg = { ...options };
      cfg.headers = { ...(options.headers || {}) };
      if (token) cfg.headers.Authorization = `Bearer ${token}`;

      const res = await fetch(path, cfg);
      if (res.status === 401) {
        token = '';
        loginMask.classList.remove('hidden');
        throw new Error('未授权');
      }
      if (!res.ok) {
        let msg = `请求失败: ${res.status}`;
        try {
          const j = await res.json();
          if (j.error) msg = j.error;
        } catch (_) {}
        throw new Error(msg);
      }
      return res.json();
    }

    function renderMessage(msg) {
      const row = document.createElement('div');
      row.className = 'item';
      if (isSelfMessage(msg.id)) {
        row.classList.add('self');
      }
      row.dataset.messageId = String(msg.id);
      if (msg.id === getCurrentMediaMessageId()) {
        row.classList.add('is-media-active');
      }

      if (manageMode) {
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = selectedIds.has(msg.id);
        check.onchange = () => {
          if (check.checked) selectedIds.add(msg.id);
          else selectedIds.delete(msg.id);
        };
        row.appendChild(check);
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${getBubbleVariant(msg)}`;

      if (msg.kind === 'text') {
        const textValue = msg.text || '';
        const textPreview = getTextPreview(textValue);
        const head = document.createElement('div');
        head.className = 'bubble-head';

        const spacer = document.createElement('div');
        spacer.className = 'bubble-title';
        spacer.textContent = '文本';
        spacer.style.visibility = 'hidden';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'bubble-copy-btn';
        copyBtn.textContent = '复制';
        copyBtn.onclick = async () => {
          try {
            await copyRawText(textValue);
            copyBtn.textContent = '已复制';
            setTimeout(() => {
              copyBtn.textContent = '复制';
            }, 1200);
          } catch (err) {
            alert(err.message || '复制失败');
          }
        };

        head.appendChild(spacer);
        head.appendChild(copyBtn);
        bubble.appendChild(head);

        const textBody = document.createElement('div');
        textBody.className = 'bubble-text-body';
        textBody.textContent = textPreview.truncated ? `${textPreview.preview}...` : textValue;
        bubble.appendChild(textBody);

        if (textPreview.truncated) {
          const viewerBtn = document.createElement('button');
          viewerBtn.className = 'bubble-open-viewer-btn';
          viewerBtn.textContent = '查看更多';
          viewerBtn.onclick = () => openMediaByMessageId(msg.id).catch(() => {});
          bubble.appendChild(viewerBtn);
        }
      } else {
        const head = document.createElement('div');
        head.className = 'bubble-head';
        const title = document.createElement('div');
        title.className = 'bubble-title';
        title.textContent = msg.file_name || '未命名文件';
        head.appendChild(title);
        bubble.appendChild(head);

        const links = document.createElement('div');
        links.className = 'meta';
        const direct = document.createElement('a');
        direct.href = msg.download_url;
        direct.target = '_blank';
        direct.rel = 'noopener noreferrer';
        direct.textContent = '直链下载';
        links.appendChild(direct);
        const size = document.createElement('span');
        size.textContent = ` · ${formatBytes(msg.file_size || 0)}`;
        links.appendChild(size);
        bubble.appendChild(links);

        if ((msg.mime_type || '').startsWith('image/')) {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = msg.file_url;
          img.alt = msg.file_name || 'image';
          img.style.cursor = 'pointer';
          img.title = '点击预览（支持上一条/下一条）';
          attachImageCompatibility(img, msg, true);
          img.onclick = () => openMediaByMessageId(msg.id).catch(() => {});
          bubble.appendChild(img);
        } else if ((msg.mime_type || '').startsWith('video/')) {
          const video = document.createElement('video');
          video.className = 'thumb';
          video.preload = 'auto';
          video.muted = true;
          video.playsInline = true;
          video.poster = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
          video.src = `${msg.file_url}#t=0.08`;
          video.style.cursor = 'pointer';
          video.title = '点击放大播放（支持上一条/下一条）';
          attachVideoCompatibility(video, msg, true);
          video.onclick = (e) => {
            e.preventDefault();
            video.pause();
            openMediaByMessageId(msg.id).catch(() => {});
          };
          bubble.appendChild(video);
        } else if ((msg.mime_type || '').startsWith('audio/')) {
          const card = createAudioCard(msg, { compact: true });
          enhanceAudioCard(card, msg);
          card.title = '点击进入音频播放页';
          card.onclick = () => openMediaByMessageId(msg.id).catch(() => {});
          bubble.appendChild(card);
        }
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = new Date(msg.created_at).toLocaleString();
      bubble.appendChild(meta);

      row.appendChild(bubble);
      return row;
    }

    function copyRawText(value) {
      if (navigator.clipboard?.writeText) {
        return navigator.clipboard.writeText(value);
      }

      const temp = document.createElement('textarea');
      temp.value = value;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(temp);
      if (!ok) {
        throw new Error('复制失败');
      }
      return Promise.resolve();
    }

    function renderMessages({ followBottom = false, preserveScroll = true } = {}) {
      const visible = getVisibleMessages();
      const previousScrollTop = chat.scrollTop;
      const existingRows = new Map(
        Array.from(chat.querySelectorAll('.item[data-message-id]')).map((row) => [Number(row.dataset.messageId), row])
      );

      for (const msg of visible) {
        const freshRow = renderMessage(msg);
        const currentRow = existingRows.get(msg.id);
        if (!currentRow) {
          chat.appendChild(freshRow);
          continue;
        }

        if (currentRow.outerHTML !== freshRow.outerHTML) {
          currentRow.replaceWith(freshRow);
        }
      }

      const visibleIds = visible.map((m) => m.id);
      for (const [id, row] of existingRows.entries()) {
        if (!visibleIds.includes(id)) {
          row.remove();
        }
      }

      const orderedRows = visible.map((m) => chat.querySelector(`.item[data-message-id="${m.id}"]`)).filter(Boolean);
      orderedRows.forEach((row) => {
        chat.appendChild(row);
      });

      if (manageMode) {
        orderedRows.forEach((row) => {
          const checkbox = row.querySelector('input[type="checkbox"]');
          if (checkbox) {
            checkbox.checked = selectedIds.has(Number(row.dataset.messageId));
          }
        });
      }

      syncMediaHistoryContext(false);

      if (followBottom) {
        chat.scrollTop = chat.scrollHeight;
      } else if (preserveScroll) {
        chat.scrollTop = Math.min(previousScrollTop, Math.max(0, chat.scrollHeight - chat.clientHeight));
      }

      updateScrollButtonState();
    }

    function buildMediaList() {
      mediaList = allMessages.filter((m) => {
        if (m.kind === 'text') return isLongTextMessage(m);
        if (m.kind !== 'file') return false;
        const mt = m.mime_type || '';
        return mt.startsWith('image/') || mt.startsWith('video/') || mt.startsWith('audio/');
      });
    }

    function getCurrentMediaMessageId() {
      if (mediaIndex < 0 || mediaIndex >= mediaList.length) return null;
      return mediaList[mediaIndex]?.id ?? null;
    }

    function syncMediaHistoryContext(shouldScroll = false) {
      const currentMessageId = getCurrentMediaMessageId();
      const rows = chat.querySelectorAll('.item[data-message-id]');
      rows.forEach((row) => {
        row.classList.toggle('is-media-active', Number(row.dataset.messageId) === currentMessageId);
      });

      if (!shouldScroll || currentMessageId == null) return;
      const activeRow = chat.querySelector(`.item[data-message-id="${currentMessageId}"]`);
      if (activeRow) {
        activeRow.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    async function showMediaAt(index) {
      if (!mediaList.length) return;
      if (index < 0 || index >= mediaList.length) return;

      await persistActiveVideoProgress();
      cleanupActiveAudioVisualizer();
      cleanupActiveAudioShell();
      resetMediaDialogLayout();

      mediaIndex = index;
      const item = mediaList[mediaIndex];
      const mt = item.mime_type || '';
      mediaStage.innerHTML = '';
      mediaCopyBtn.classList.toggle('hidden', item.kind !== 'text');
      renderMediaViewerHint(item);

      if (item.kind === 'text') {
        mediaDialog.classList.add('text-mode');
        fitMediaDialogForText();
        const textStage = document.createElement('div');
        textStage.className = 'text-viewer-stage';
        mediaStage.appendChild(textStage);
        mountTextViewerState(textStage, item);
      } else if (mt.startsWith('image/')) {
        mediaDialog.classList.add('image-mode');
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'image' && cached.supported === false) {
          showUnsupportedMedia(item, 'image');
        } else {
          const img = document.createElement('img');
          img.src = item.file_url;
          img.alt = item.file_name || 'image';
          img.addEventListener('load', () => {
            fitMediaDialogToAspect(img.naturalWidth || img.width, img.naturalHeight || img.height);
          }, { once: true });
          attachImageCompatibility(img, item, false);
          mediaStage.appendChild(img);
        }
      } else if (mt.startsWith('video/')) {
        mediaDialog.classList.add('video-mode');
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'video' && cached.supported === false) {
          showUnsupportedMedia(item, 'video');
        } else {
          const video = document.createElement('video');
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.addEventListener('play', () => pauseOtherVideos(video));
          video.addEventListener('loadedmetadata', () => {
            fitMediaDialogToAspect(video.videoWidth || 0, video.videoHeight || 0);
          }, { once: true });
          if (item.file_id) {
            const savedPosition = await fetchMediaProgress(item.file_id);
            video.addEventListener('loadedmetadata', () => {
              if ((video.videoWidth || 0) > 0 && (video.videoHeight || 0) > 0 && savedPosition > 0 && savedPosition < video.duration) {
                video.currentTime = savedPosition;
                playMediaElement(video);
              }
            }, { once: true });
            video.addEventListener('timeupdate', () => {
              if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return;
              if (videoProgressSaveTimer) clearTimeout(videoProgressSaveTimer);
              videoProgressSaveTimer = setTimeout(() => {
                  saveMediaProgress(item.file_id, video.currentTime).catch(() => {});
              }, 500);
            });
            video.addEventListener('pause', () => {
              if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return;
              saveMediaProgress(item.file_id, video.currentTime).catch(() => {});
            });
          }
          attachVideoCompatibility(video, item, false);
          video.src = item.file_url;
          mediaStage.appendChild(video);
          playMediaElement(video);
        }
      } else if (mt.startsWith('audio/')) {
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'audio' && cached.supported === false) {
          showUnsupportedMedia(item, 'audio');
        } else {
          mediaDialog.classList.add('audio-mode');
          const audio = document.createElement('audio');
          audio.autoplay = true;
          audio.preload = 'metadata';
          audio.muted = true;
          fitMediaDialogForAudio();
          attachAudioCompatibility(audio, item, () => showUnsupportedMedia(item, 'audio'));
          audio.src = item.file_url;
          if (item.file_id) {
            const savedPosition = await fetchMediaProgress(item.file_id);
            audio.addEventListener('loadedmetadata', () => {
              if (savedPosition > 0 && savedPosition < audio.duration) {
                audio.currentTime = savedPosition;
                playMediaElement(audio, { unmuteAfterStart: true });
              }
            }, { once: true });
            audio.addEventListener('timeupdate', () => {
              if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
              if (videoProgressSaveTimer) clearTimeout(videoProgressSaveTimer);
              videoProgressSaveTimer = setTimeout(() => {
                saveMediaProgress(item.file_id, audio.currentTime).catch(() => {});
              }, 500);
            });
            audio.addEventListener('pause', () => {
              if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
              saveMediaProgress(item.file_id, audio.currentTime).catch(() => {});
            });
          }

          const { shell, canvas, meta } = createAudioShell(item, audio);
          mediaStage.appendChild(shell);
          attachAudioVisualizer(audio, canvas, meta);
          playMediaElement(audio, { unmuteAfterStart: true });
        }
      }

      renderMediaViewerTitle(item, mediaIndex, mediaList.length);
      mediaPrevBtn.disabled = mediaIndex <= 0;
      mediaNextBtn.disabled = mediaIndex >= mediaList.length - 1;
      mediaViewer.classList.remove('hidden');
      syncMediaHistoryContext(true);
      requestAnimationFrame(() => mediaDialog.focus());
    }

    async function openMediaByMessageId(messageId) {
      buildMediaList();
      const index = mediaList.findIndex((m) => m.id === messageId);
      if (index < 0) return;
      await showMediaAt(index);
    }

    async function closeMediaViewer() {
      await persistActiveVideoProgress();
      cleanupActiveAudioVisualizer();
      cleanupActiveAudioShell();
      resetMediaDialogLayout();
      mediaViewer.classList.add('hidden');
      mediaStage.innerHTML = '';
      mediaIndex = -1;
      syncMediaHistoryContext(false);
    }

    async function switchMedia(delta) {
      if (mediaIndex < 0) return;
      const next = mediaIndex + delta;
      if (next < 0 || next >= mediaList.length) return;
      await showMediaAt(next);
    }

    function updateManageUi() {
      normalActions.classList.toggle('hidden', manageMode);
      manageActions.classList.toggle('hidden', !manageMode);
      if (!manageMode) {
        selectedIds.clear();
        resetDeleteButton();
        resetRestartButton();
        resetLogoutButton();
      }
      renderMessages({ preserveScroll: true });
    }

    function applyMessages(messages, { followBottom = false, preserveScroll = true } = {}) {
      allMessages = messages;
      buildMediaList();
      lastAppliedSnapshot = snapshotMessages(messages);
      pendingMessages = null;
      pendingSnapshot = '';
      updateRefreshButtonState();
      renderMessages({ followBottom, preserveScroll });
    }

    function flushPendingMessages({ followBottom = false } = {}) {
      if (!pendingMessages) return false;
      const queued = pendingMessages;
      applyMessages(queued, { followBottom, preserveScroll: !followBottom });
      return true;
    }

    async function loadMessages({ source = 'poll', followBottom = false, preserveScroll = true } = {}) {
      const incoming = await api('/api/messages');
      const incomingSnapshot = snapshotMessages(incoming);
      if (incomingSnapshot === pendingSnapshot || incomingSnapshot === lastAppliedSnapshot) {
        return;
      }

      if (source === 'poll' && shouldDeferMessageRender()) {
        pendingMessages = incoming;
        pendingSnapshot = incomingSnapshot;
        updateRefreshButtonState();
        return;
      }

      applyMessages(incoming, { followBottom, preserveScroll });
    }

    async function login() {
      loginError.textContent = '';
      try {
        const data = await api('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });
        token = data.token;
        try {
          if (rememberPassword.checked) {
            localStorage.setItem(REMEMBER_PASSWORD_KEY, passwordInput.value);
          } else {
            localStorage.removeItem(REMEMBER_PASSWORD_KEY);
          }
        } catch (_) {}
        passwordInput.value = '';
        loadSelfMessageIds();
        loginMask.classList.add('hidden');
        const uiState = await fetchUiState();
        applyUiState(uiState);
        await loadMessages({ source: 'login', followBottom: true, preserveScroll: false });
        updateScrollButtonState();
      } catch (err) {
        loginError.textContent = err.message;
      }
    }

    function resetLogoutButton() {
      logoutArmed = false;
      logoutBtn.textContent = '退出登录';
      if (logoutArmTimer) {
        clearTimeout(logoutArmTimer);
        logoutArmTimer = null;
      }
    }

    async function handleLogoutClick() {
      if (!logoutArmed) {
        logoutArmed = true;
        logoutBtn.textContent = '二次确认退出（5秒）';
        logoutArmTimer = setTimeout(resetLogoutButton, 5000);
        return;
      }
      await logout();
    }

    async function logout() {
      try {
        await api('/api/logout', { method: 'POST' });
      } catch (_) {}
      token = '';
      selectedIds.clear();
      manageMode = false;
      selfMessageIds.clear();
      saveSelfMessageIds();
      mediaProgressCache.clear();
      mediaCompatibilityCache.clear();
      audioVisualCache.clear();
      pendingMessages = null;
      pendingSnapshot = '';
      lastAppliedSnapshot = '';
      resetLogoutButton();
      resetRestartButton();
      updateRefreshButtonState();
      updateManageUi();
      loginMask.classList.remove('hidden');
      updateScrollButtonState();
      try {
        localStorage.removeItem(REMEMBER_PASSWORD_KEY);
        passwordInput.value = '';
        rememberPassword.checked = false;
      } catch (_) {
        passwordInput.value = '';
      }
      applyUiState({ chat_height_px: null, input_height_px: null });
    }

    async function sendText() {
      const text = textInput.value;
      if (!text) return;
      const created = await api('/api/messages/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      markMessageAsSelf(created.id);
      textInput.value = '';
      await loadMessages({ source: 'send-text', followBottom: false, preserveScroll: true });
      await animateChatScroll(chat.scrollHeight - chat.clientHeight);
    }

    function inferMimeTypeFromName(fileName) {
      const ext = getFileExtension(fileName);
      const map = {
        mp3: 'audio/mpeg',
        wav: 'audio/wav',
        flac: 'audio/flac',
        aac: 'audio/aac',
        m4a: 'audio/mp4',
        opus: 'audio/ogg',
        ogg: 'audio/ogg',
      };
      return map[ext] || null;
    }

    function openUploadTasksPanel() {
      uploadTaskOverlay.classList.remove('hidden');
      renderUploadTasks();
    }

    function hideUploadTasksPanel() {
      uploadTaskOverlay.classList.add('hidden');
    }

    function makeFileKey(file) {
      return `${file.name}::${file.size}::${file.lastModified}::${file.type}`;
    }

    function normalizeUploadFile(file) {
      if (file.name?.trim()) return file;
      const ext = (file.type || '').split('/')[1] || 'bin';
      return new File([file], `upload-${Date.now()}.${ext}`, {
        type: file.type || 'application/octet-stream'
      });
    }

    function createTask(file) {
      const id = uploadTaskSeq++;
      const now = Date.now();
      return {
        id,
        file,
        fileKey: makeFileKey(file),
        name: file.name,
        totalBytes: file.size,
        uploadedBytes: 0,
        uploadId: '',
        status: 'queued',
        startedAt: now,
        completedAt: null,
        lastSampleAt: now,
        lastSampleBytes: 0,
        speedBps: 0,
        etaSec: null,
        error: '',
        retries: 0,
        controllers: new Set(),
        chunks: [],
      };
    }

    function elapsedSec(task) {
      const end = task.completedAt || Date.now();
      return Math.max(0, (end - task.startedAt) / 1000);
    }

    function updateTaskSpeed(task, uploadedDelta = 0) {
      const now = Date.now();
      task.samples = (task.samples || []).filter((sample) => now - sample.at <= 4000);
      if (uploadedDelta > 0) {
        task.samples.push({ at: now, bytes: uploadedDelta });
      }
      const windowMs = task.samples.length ? Math.max(400, now - task.samples[0].at) : Math.max(400, now - task.startedAt);
      const windowBytes = task.samples.reduce((sum, sample) => sum + sample.bytes, 0);
      task.speedBps = windowBytes > 0 ? windowBytes / (windowMs / 1000) : 0;
      const remain = task.totalBytes - task.uploadedBytes;
      task.etaSec = task.speedBps > 1 ? remain / task.speedBps : null;
      task.lastSampleAt = now;
      task.lastSampleBytes = task.uploadedBytes;
    }

    async function sha256Hex(blob) {
      const buffer = await blob.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function pauseOtherVideos(currentVideo) {
      document.querySelectorAll('video').forEach((video) => {
        if (video !== currentVideo) {
          video.pause();
        }
      });
    }

    async function persistActiveVideoProgress() {
      const item = mediaList[mediaIndex];
      const activeVideo = mediaStage.querySelector('video');
      if (!item || !activeVideo || !(item.mime_type || '').startsWith('video/')) return;
      await saveMediaProgress(item.file_id, activeVideo.currentTime || 0);
    }

    function buildChunkPlan(task, chunkSize, completedParts) {
      const doneMap = new Map();
      for (const part of completedParts || []) {
        doneMap.set(Number(part.start_byte), {
          start: Number(part.start_byte),
          end: Number(part.end_byte),
          checksum: part.checksum,
          done: true,
        });
      }

      const plan = [];
      for (let start = 0; start < task.totalBytes; start += chunkSize) {
        const end = Math.min(task.totalBytes, start + chunkSize);
        const existing = doneMap.get(start);
        plan.push({
          start,
          end,
          checksum: existing?.checksum || '',
          done: Boolean(existing && existing.end === end),
          inflight: false,
        });
      }
      return plan;
    }

    function renderUploadTasks() {
      if (!uploadTasks.size) {
        uploadTaskList.innerHTML = '<div class="footer-note">暂无上传任务</div>';
        return;
      }

      const list = Array.from(uploadTasks.values()).sort((a, b) => b.id - a.id);
      uploadTaskList.innerHTML = '';
      for (const t of list) {
        const card = document.createElement('div');
        card.className = 'task-card';
        const progress = t.totalBytes > 0 ? Math.min(100, (t.uploadedBytes / t.totalBytes) * 100) : 0;
        const elapsed = elapsedSec(t);
        const remain = t.etaSec;
        const totalEstimate = Number.isFinite(remain) ? elapsed + remain : null;

        card.innerHTML = `
          <div class="task-title">
            <div class="task-name" title="${t.name}">${t.name}</div>
            <div class="task-status">${taskStatusText(t.status)}</div>
          </div>
          <div class="progress"><div class="bar" style="width:${progress.toFixed(2)}%"></div></div>
          <div class="task-grid">
            <div>进度：${progress.toFixed(1)}%</div>
            <div>已上传：${formatBytes(t.uploadedBytes)}</div>
            <div>总大小：${formatBytes(t.totalBytes)}</div>
            <div>目前耗时：${formatDuration(elapsed)}</div>
            <div>预计剩余：${remain == null ? '--' : formatDuration(remain)}</div>
            <div>预计总耗时：${totalEstimate == null ? '--' : formatDuration(totalEstimate)}</div>
            <div>当前速度：${formatSpeed(t.speedBps)}</div>
          </div>
        `;

        if (t.error) {
          const err = document.createElement('div');
          err.className = 'footer-note';
          err.style.color = '#c43434';
          err.textContent = `错误：${t.error}`;
          card.appendChild(err);
        }

        if (t.status === 'uploading' || t.status === 'retrying' || t.status === 'queued') {
          const cancel = document.createElement('button');
          cancel.className = 'danger';
          cancel.textContent = '取消上传';
          cancel.onclick = () => cancelTask(t.id);
          cancel.style.marginTop = '8px';
          card.appendChild(cancel);
        }

        uploadTaskList.appendChild(card);
      }
    }

    async function cancelTask(taskId) {
      const task = uploadTasks.get(taskId);
      if (!task) return;
      task.status = 'cancelled';
      task.controllers.forEach((controller) => {
        controller.abort();
      });
      task.controllers.clear();
      if (task.uploadId) {
        try {
          await api('/api/uploads/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ upload_id: task.uploadId })
          });
        } catch (_) {}
      }
      renderUploadTasks();
    }

    async function processUploadTask(task) {
      const CHUNK_FALLBACK = 4 * 1024 * 1024;
      let chunkSize = CHUNK_FALLBACK;
      let parallelLimit = 4;

      try {
        const init = await api('/api/uploads/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_key: task.fileKey,
            file_name: task.file.name,
            file_size: task.file.size,
            mime_type: task.file.type || inferMimeTypeFromName(task.file.name),
          })
        });

        task.uploadId = init.upload_id;
        chunkSize = Number(init.chunk_size || CHUNK_FALLBACK);
        parallelLimit = Number(init.parallel_limit || 4);
        task.chunks = buildChunkPlan(task, chunkSize, init.completed_parts || []);
        task.uploadedBytes = task.chunks
          .filter((chunk) => chunk.done)
          .reduce((sum, chunk) => sum + (chunk.end - chunk.start), 0);
        task.status = 'uploading';
        updateTaskSpeed(task, 0);
        renderUploadTasks();

        const uploadChunk = async (chunk) => {
          while (!chunk.done) {
            if (task.status === 'cancelled') return;
            const blob = task.file.slice(chunk.start, chunk.end);
            const controller = new AbortController();
            task.controllers.add(controller);

            try {
              chunk.checksum = chunk.checksum || await sha256Hex(blob);
              const chunkResp = await api('/api/uploads/chunk', {
                method: 'POST',
                headers: {
                  'X-Upload-Id': task.uploadId,
                  'X-Start-Byte': String(chunk.start),
                  'X-Chunk-Sha256': chunk.checksum,
                },
                body: blob,
                signal: controller.signal,
              });

              chunk.done = true;
              chunk.inflight = false;
              task.controllers.delete(controller);
              task.uploadedBytes = Number(chunkResp.received_bytes || task.uploadedBytes);
              task.retries = 0;
              task.status = 'uploading';
              task.error = '';
              updateTaskSpeed(task, chunk.end - chunk.start);
              renderUploadTasks();
            } catch (err) {
              task.controllers.delete(controller);
              chunk.inflight = false;
              if (task.status === 'cancelled') return;
              task.retries += 1;
              if (task.retries > 5) throw err;

              task.status = 'retrying';
              task.error = `网络波动，重试第 ${task.retries} 次`;
              renderUploadTasks();
              await new Promise((r) => setTimeout(r, Math.min(1600, 250 * task.retries)));

              const resumed = await api('/api/uploads/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  file_key: task.fileKey,
                  file_name: task.file.name,
                  file_size: task.file.size,
                  mime_type: task.file.type || inferMimeTypeFromName(task.file.name),
                })
              });
              task.uploadId = resumed.upload_id;
              task.chunks = buildChunkPlan(task, chunkSize, resumed.completed_parts || []).map((nextChunk) => {
                const current = task.chunks.find((item) => item.start === nextChunk.start);
                return current?.done ? { ...current, done: true } : nextChunk;
              });
              task.uploadedBytes = Number(resumed.received_bytes || task.uploadedBytes);
            }
          }
        };

        const workers = Array.from({ length: Math.max(1, parallelLimit) }, async () => {
          while (true) {
            if (task.status === 'cancelled') return;
            const nextChunk = task.chunks.find((chunk) => !chunk.done && !chunk.inflight);
            if (!nextChunk) return;
            nextChunk.inflight = true;
            await uploadChunk(nextChunk);
          }
        });

        await Promise.all(workers);
        if (task.status === 'cancelled') return;

        const completed = await api('/api/uploads/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ upload_id: task.uploadId })
        });
        markMessageAsSelf(completed.id);

        task.status = 'done';
        task.completedAt = Date.now();
        task.error = '';
        task.controllers.clear();
        updateTaskSpeed(task, 0);
        renderUploadTasks();
        await loadMessages({ source: 'upload-complete', followBottom: false, preserveScroll: true });
        await animateChatScroll(chat.scrollHeight - chat.clientHeight);
      } catch (err) {
        if (task.status !== 'cancelled') {
          task.status = 'error';
          task.error = err?.message || String(err);
          task.completedAt = Date.now();
          renderUploadTasks();
        }
      }
    }

    async function enqueueFiles(rawFiles) {
      const files = Array.from(rawFiles || []).map(normalizeUploadFile);
      if (!files.length) return;

      openUploadTasksPanel();
      for (const file of files) {
        const task = createTask(file);
        uploadTasks.set(task.id, task);
        renderUploadTasks();
        processUploadTask(task);
      }
    }

    async function sendFiles() {
      const files = Array.from(fileInput.files || []);
      await enqueueFiles(files);
      fileInput.value = '';
    }

    function resetRestartButton() {
      restartArmed = false;
      restartBtn.textContent = '重启服务';
      if (restartArmTimer) {
        clearTimeout(restartArmTimer);
        restartArmTimer = null;
      }
    }

    async function handleRestartClick() {
      if (!restartArmed) {
        restartArmed = true;
        restartBtn.textContent = '二次确认重启（5秒）';
        restartArmTimer = setTimeout(resetRestartButton, 5000);
        return;
      }
      const result = await api('/api/admin/restart', { method: 'POST' });
      restartBtn.disabled = true;
      restartBtn.textContent = '正在重启...';
      alert(result.message || '重启请求已发送');
    }

    function resetDeleteButton() {
      deleteArmed = false;
      deleteBtn.textContent = '删除已勾选';
      if (deleteArmTimer) {
        clearTimeout(deleteArmTimer);
        deleteArmTimer = null;
      }
    }

    async function deleteSelected() {
      if (!selectedIds.size) {
        alert('请先勾选要删除的记录');
        return;
      }
      const deletingIds = new Set(selectedIds);
      allMessages
        .filter((msg) => deletingIds.has(msg.id) && msg.file_id)
        .forEach((msg) => {
          mediaProgressCache.delete(msg.file_id);
          mediaCompatibilityCache.delete(msg.file_id);
          audioVisualCache.delete(msg.file_id);
        });
      await api('/api/messages', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: Array.from(selectedIds) })
      });
      selectedIds.clear();
      resetDeleteButton();
      await loadMessages({ source: 'delete', followBottom: false, preserveScroll: true });
    }

    async function handleDeleteClick() {
      if (!deleteArmed) {
        deleteArmed = true;
        deleteBtn.textContent = '二次确认删除（5秒）';
        deleteArmTimer = setTimeout(resetDeleteButton, 5000);
        return;
      }
      await deleteSelected();
    }

    function selectAllVisible() {
      for (const m of getVisibleMessages()) selectedIds.add(m.id);
      renderMessages({ preserveScroll: true });
    }

    function invertVisible() {
      for (const m of getVisibleMessages()) {
        if (selectedIds.has(m.id)) selectedIds.delete(m.id);
        else selectedIds.add(m.id);
      }
      renderMessages({ preserveScroll: true });
    }

    loginBtn.onclick = login;
    logoutBtn.onclick = () => handleLogoutClick().catch((e) => {
      resetLogoutButton();
      alert(e.message);
    });
    refreshBtn.onclick = () => {
      if (flushPendingMessages({ followBottom: isChatNearBottom() })) return;
      loadMessages({ source: 'manual-refresh', followBottom: isChatNearBottom(), preserveScroll: !isChatNearBottom() }).catch((e) => alert(e.message));
    };
    sendTextBtn.onclick = () => sendText().catch((e) => alert(e.message));
    sendFileBtn.onclick = () => sendFiles().catch((e) => alert(e.message));

    plusMenuBtn.onclick = () => {
      plusMenu.classList.toggle('hidden');
    };
    pickImageBtn.onclick = () => imageUploadInput.click();
    pickVideoBtn.onclick = () => videoUploadInput.click();
    pickAudioBtn.onclick = () => audioUploadInput.click();
    imageUploadInput.onchange = () => {
      enqueueFiles(imageUploadInput.files).catch((e) => alert(e.message));
      imageUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };
    videoUploadInput.onchange = () => {
      enqueueFiles(videoUploadInput.files).catch((e) => alert(e.message));
      videoUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };
    audioUploadInput.onchange = () => {
      enqueueFiles(audioUploadInput.files).catch((e) => alert(e.message));
      audioUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };

    restartBtn.onclick = () => handleRestartClick().catch((e) => {
      resetRestartButton();
      alert(e.message);
    });

    manageBtn.onclick = () => {
      manageMode = !manageMode;
      updateManageUi();
    };
    exitManageBtn.onclick = () => {
      manageMode = false;
      updateManageUi();
    };

    deleteBtn.onclick = () => handleDeleteClick().catch((e) => alert(e.message));
    resetSizeBtn.onclick = () => restoreDefaultUiState().catch((e) => alert(e.message));
    selectAllBtn.onclick = selectAllVisible;
    invertSelectBtn.onclick = invertVisible;
    filterSelect.onchange = () => {
      currentFilter = filterSelect.value;
      renderMessages({ preserveScroll: true });
    };

    uploadTasksBtn.onclick = openUploadTasksPanel;
    hideTaskPanelBtn.onclick = hideUploadTasksPanel;
    clearFinishedBtn.onclick = () => {
      for (const [id, t] of uploadTasks.entries()) {
        if (t.status === 'done' || t.status === 'cancelled' || t.status === 'error') {
          uploadTasks.delete(id);
        }
      }
      renderUploadTasks();
    };

    textInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const start = textInput.selectionStart ?? textInput.value.length;
        const end = textInput.selectionEnd ?? textInput.value.length;
        textInput.value = `${textInput.value.slice(0, start)}\n${textInput.value.slice(end)}`;
        textInput.selectionStart = textInput.selectionEnd = start + 1;
        return;
      }
      if (!e.shiftKey) {
        e.preventDefault();
        sendText().catch((err) => alert(err.message));
      }
    });

    textInput.addEventListener('paste', (e) => {
      const items = Array.from(e.clipboardData?.items || []);
      const images = [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) images.push(file);
        }
      }
      if (images.length) {
        e.preventDefault();
        enqueueFiles(images).catch((err) => alert(err.message));
      }
    });

    chat.addEventListener('scroll', () => {
      updateScrollButtonState();
      if (pendingMessages && isChatNearBottom()) {
        flushPendingMessages({ followBottom: true });
      }
    });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    try {
      const cached = localStorage.getItem(REMEMBER_PASSWORD_KEY);
      if (cached) {
        passwordInput.value = cached;
        rememberPassword.checked = true;
        setTimeout(() => {
          login().catch(() => {});
        }, 0);
      }
    } catch (_) {}

    const resizeObserver = new ResizeObserver(() => {
      scheduleUiStateSave();
      updateScrollButtonState();
    });
    resizeObserver.observe(chat);
    resizeObserver.observe(textInput);

    mediaPrevBtn.onclick = () => switchMedia(-1).catch(() => {});
    mediaNextBtn.onclick = () => switchMedia(1).catch(() => {});
    mediaCopyBtn.onclick = async () => {
      const item = mediaList[mediaIndex];
      if (!item || item.kind !== 'text') return;
      try {
        await copyRawText(item.text || '');
        mediaCopyBtn.textContent = '已复制';
        setTimeout(() => {
          mediaCopyBtn.textContent = '复制';
        }, 1200);
      } catch (err) {
        alert(err.message || '复制失败');
      }
    };
    mediaCloseBtn.onclick = () => closeMediaViewer().catch(() => {});

    document.addEventListener('click', (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusMenuBtn) {
        plusMenu.classList.add('hidden');
      }
      if (e.target === mediaViewer) {
        closeMediaViewer().catch(() => {});
      }
    });

    document.addEventListener('keydown', (e) => {
      if (mediaViewer.classList.contains('hidden')) return;
      if (e.target === textInput || e.target === passwordInput) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        switchMedia(-1).catch(() => {});
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        switchMedia(1).catch(() => {});
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeMediaViewer().catch(() => {});
      }
    });

    mediaDialog.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        e.stopPropagation();
        switchMedia(-1).catch(() => {});
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        e.stopPropagation();
        switchMedia(1).catch(() => {});
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeMediaViewer().catch(() => {});
      }
    });

    scrollTopBtn.onclick = () => {
      animateChatScroll(0).catch(() => {});
    };
    scrollBottomBtn.onclick = () => {
      animateChatScroll(chat.scrollHeight - chat.clientHeight).catch(() => {});
    };

    setInterval(() => {
      if (token && !pollingInFlight) {
        pollingInFlight = true;
        loadMessages({ source: 'poll', followBottom: false, preserveScroll: true }).catch(() => {}).finally(() => {
          pollingInFlight = false;
        });
      }
      if (uploadTasks.size) renderUploadTasks();
    }, 1200);

    updateRefreshButtonState();
    updateScrollButtonState();
  </script>
</body>
</html>
