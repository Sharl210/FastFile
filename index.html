<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>FastFile 云端传输助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-border: #dbe3ef;
      --text: #243043;
      --muted: #6a7a92;
      --accent: #1d72ff;
      --danger: #d04545;
    }
    * { box-sizing: border-box; }
    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    html.drag-scroll-lock,
    body.drag-scroll-lock {
      overflow: hidden;
      touch-action: none;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      height: 100dvh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    .page.drag-scroll-lock {
      overflow: hidden;
      touch-action: none;
    }
    .page.modal-scroll-lock {
      overflow: hidden;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
    }
    .chat-panel {
      position: relative;
      overflow: visible;
    }
    .page.manage-mode #chat {
      height: var(--manage-chat-height, 66vh) !important;
      max-height: var(--manage-chat-height, 66vh) !important;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topbar-title {
      font-weight: 700;
      letter-spacing: .02em;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .topbar-actions {
      margin-left: auto;
    }
    .manage-actions {
      width: 100%;
      justify-content: flex-end;
    }
    .topbar-select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .manage-menu-wrap {
      position: relative;
    }
    .manage-filter-btn.active-text {
      background: #ebfaef;
      border-color: #b8e3c2;
      color: #237a3b;
    }
    .manage-filter-btn.active-file,
    .manage-filter-btn.active-search,
    .manage-filter-btn.active-reset {
      background: #fff6df;
      border-color: #efd391;
      color: #9a6b00;
    }
    .manage-filter-btn.active-image {
      background: #f6edff;
      border-color: #dcc6ff;
      color: #6b43bd;
    }
    .manage-filter-btn.active-video {
      background: #eaf5ff;
      border-color: #c4dfff;
      color: #2663c9;
    }
    .manage-filter-btn.active-audio {
      background: #fff0f8;
      border-color: #f3c9e2;
      color: #b0488b;
    }
    .manage-popup-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 180px;
      z-index: 90;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .manage-popup-menu button {
      width: 100%;
      text-align: left;
    }
    button, input[type="password"], input[type="file"], select {
      border-radius: 8px;
      border: 1px solid #c8d3e3;
      background: #fff;
      color: #243043;
      padding: 8px 11px;
      font-size: 14px;
      transition: transform .05s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 1px 0 rgba(25, 31, 43, .04);
    }
    :root {
      --composer-action-size: 38px;
    }
    button {
      cursor: pointer;
      user-select: none;
    }
    button:hover { box-shadow: 0 2px 8px rgba(40, 74, 140, .12); }
    button:active {
      transform: translateY(1px) scale(.99);
      filter: brightness(.95);
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
    }
    #plusMenuBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--composer-action-size);
      width: var(--composer-action-size);
      height: var(--composer-action-size);
      min-height: var(--composer-action-size);
      padding: 0;
      font-size: 20px;
      line-height: 1;
      text-align: center;
      box-sizing: border-box;
    }
    #sendTextBtn {
      min-height: var(--composer-action-size);
      padding-top: 0;
      padding-bottom: 0;
    }
    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .danger {
      background: #fff3f3;
      color: var(--danger);
      border-color: #f4bdbd;
    }
    .soft-accent {
      background: #f4f8ff;
      border-color: #cfe0ff;
      color: #315ea8;
    }
    .success {
      background: #ebfaef;
      border-color: #b8e3c2;
      color: #237a3b;
    }
    .warning {
      background: #fff6df;
      border-color: #efd391;
      color: #9a6b00;
    }
    #chat {
      height: 44vh;
      min-height: 280px;
      max-height: 82vh;
      overflow: auto;
      overflow-anchor: none;
      overscroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: none;
      padding: 10px;
      background: #f9fbff;
      border: 1px solid #e4ebf5;
      border-radius: 10px;
      resize: vertical;
    }
    .chat-spacer {
      height: 0;
      pointer-events: none;
    }
    .chat-virtual-host {
      min-height: 0;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chat-virtual-host > .item:last-child {
      margin-bottom: 0;
    }
    .item.self {
      justify-content: flex-end;
    }
    .bubble {
      max-width: min(92%, 820px);
      border-radius: 10px;
      border: 1px solid #dce6f3;
      background: #fff;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-text {
      background: #ffffff;
      border-color: #dce6f3;
    }
    .bubble-self-text {
      background: #e9f8ea;
      border-color: #b7dfbb;
    }
    .bubble-file {
      background: #fff6e8;
      border-color: #f0d3a2;
    }
    .bubble-file-image {
      background: #f6edff;
      border-color: #dcc6ff;
    }
    .bubble-file-video {
      background: #eaf5ff;
      border-color: #c4dfff;
    }
    .bubble-file-audio {
      background: #fff0f8;
      border-color: #f3c9e2;
    }
    .bubble-file-textlike {
      background: #fff6e8;
      border: 2px dashed #e6b54b;
    }
    .item.is-media-active .bubble {
      border-color: #7ba7ff;
      box-shadow: 0 0 0 3px rgba(29, 114, 255, .14);
    }
    .bubble-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 4px;
    }
    .bubble-head-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .bubble-title {
      font-size: 13px;
      font-weight: 600;
      color: #44556f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bubble-action-btn {
      padding: 4px 8px;
      font-size: 12px;
      min-height: auto;
      box-shadow: none;
    }
    .bubble-text-body {
      line-height: 1.5;
    }
    .bubble-open-viewer-btn {
      margin-top: 8px;
      padding: 5px 10px;
      font-size: 12px;
      min-height: auto;
      box-shadow: none;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
    .thumb {
      width: 260px;
      max-width: 100%;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #d8e2f0;
      background: #eef4fd;
    }
    .media-placeholder {
      width: min(100%, 520px);
      padding: 18px;
      border-radius: 10px;
      border: 1px dashed #c6d5ea;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fd 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      justify-content: center;
    }
    .media-placeholder.compact {
      width: 260px;
      max-width: 100%;
      min-height: 152px;
      margin-top: 8px;
      padding: 14px;
      cursor: pointer;
    }
    .media-placeholder strong {
      font-size: 14px;
      line-height: 1.4;
    }
    .media-placeholder small {
      color: var(--muted);
      line-height: 1.5;
    }
    .media-placeholder a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }
    .media-placeholder a:hover {
      text-decoration: underline;
    }
    .scroll-fab-group {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .scroll-fab {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      border-color: #cfd9eb;
      pointer-events: auto;
    }
    .chat-scroll-indicator {
      position: absolute;
      top: 12px;
      bottom: 28px;
      right: 0;
      width: 18px;
      border-radius: 999px;
      background: transparent;
      backdrop-filter: none;
      pointer-events: auto;
      touch-action: none;
      opacity: 0;
      transition: opacity .24s ease;
      z-index: 88;
      overflow: visible;
    }
    .chat-scroll-indicator::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      margin-left: -2px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.10);
      backdrop-filter: blur(8px);
    }
    .chat-panel.chat-scroll-visible .chat-scroll-indicator {
      opacity: 1;
    }
    .chat-scroll-indicator.hidden {
      display: none;
    }
    .chat-scroll-thumb {
      position: absolute;
      left: 50%;
      width: 4px;
      margin-left: -2px;
      background: rgba(37, 99, 235, 0.72);
      border-radius: inherit;
      min-height: 24px;
      transform: translateY(0);
    }
    .chat-scroll-thumb.dragging {
      background: rgba(29, 78, 216, 0.92);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.18);
    }
    .input-scroll-indicator {
      position: absolute;
      top: 12px;
      bottom: 16px;
      right: 0;
      width: 18px;
      border-radius: 999px;
      background: transparent;
      pointer-events: auto;
      touch-action: none;
      opacity: 0;
      transition: opacity .24s ease;
      z-index: 3;
      overflow: visible;
    }
    .input-scroll-indicator::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      margin-left: -2px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.10);
      backdrop-filter: blur(8px);
    }
    .input-scroll-indicator.hidden {
      display: none;
    }
    .input-stage.input-scroll-visible .input-scroll-indicator {
      opacity: 1;
    }
    .input-scroll-thumb {
      position: absolute;
      left: 50%;
      width: 4px;
      margin-left: -2px;
      background: rgba(37, 99, 235, 0.72);
      border-radius: inherit;
      min-height: 24px;
      transform: translateY(0);
    }
    .input-scroll-thumb.dragging {
      background: rgba(29, 78, 216, 0.92);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.18);
    }
    .panel-resize-grip {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.10);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(36, 48, 67, 0.82);
      cursor: ns-resize;
      touch-action: none;
      z-index: 6;
      user-select: none;
      padding: 0;
    }
    .panel-resize-grip svg {
      width: 14px;
      height: 14px;
      display: block;
      flex: 0 0 auto;
    }
    .panel-resize-grip.dragging {
      background: rgba(29, 114, 255, 0.98);
      color: #fff;
      border-color: rgba(29, 114, 255, 0.98);
      box-shadow: 0 10px 22px rgba(29, 114, 255, 0.28);
    }
    #chatResizeGrip {
      right: 2px;
      bottom: 2px;
    }
    #inputResizeGrip {
      right: -8px;
      bottom: -4px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      overflow: auto;
      overscroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
      touch-action: pan-y;
      border-radius: 10px;
      border: 1px solid #ccd7e7;
      padding: 10px;
      outline: none;
      color: var(--text);
      background: #fff;
      font-size: 14px;
      line-height: 1.5;
      font-family: inherit;
    }
    textarea:focus {
      border-color: #8fb0ea;
      box-shadow: 0 0 0 3px rgba(29, 114, 255, .1);
    }
    .input-stage {
      position: relative;
      border-radius: 10px;
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: visible;
    }
    .input-stage.drag-upload-active {
      transform: translateY(-1px);
      box-shadow: 0 0 0 4px rgba(29, 114, 255, .08);
    }
    .input-stage.drag-upload-active::after {
      content: '松手即可上传文件';
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #1d72ff;
      border-radius: 10px;
      background: rgba(29, 114, 255, .08);
      color: #0f4bcf;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
      pointer-events: none;
    }
    .input-stage textarea {
      position: relative;
      z-index: 2;
      background: transparent;
      color: transparent;
      caret-color: var(--text);
    }
    #textInput {
      scrollbar-width: none;
      -ms-overflow-style: none;
      scrollbar-gutter: auto;
    }
    #textInput::-webkit-scrollbar {
      display: none;
    }
    .input-stage.drag-upload-active textarea {
      border-color: #1d72ff;
      background: rgba(29, 114, 255, .03);
    }
    .input-stage textarea::selection {
      background: rgba(29, 114, 255, .18);
    }
    .input-stage.mirror-disabled textarea {
      background: #fff;
      color: var(--text);
      caret-color: auto;
    }
    .input-stage.mirror-disabled .input-virtual-layer {
      display: none;
    }
    .input-virtual-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      border: 1px solid #ccd7e7;
      border-radius: 10px;
      background: #fff;
      pointer-events: none;
    }
    .input-stage.drag-upload-active .input-virtual-layer {
      border-color: #1d72ff;
      background: rgba(29, 114, 255, .03);
    }
    .input-virtual-scroll {
      position: relative;
      width: 100%;
      min-height: 100%;
    }
    .input-virtual-content {
      position: absolute;
      left: 0;
      right: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      padding: 10px;
      font-size: 14px;
      line-height: 1.5;
      font-family: inherit;
    }
    .editor-launch-btn {
      margin-left: auto;
      min-width: var(--composer-action-size);
      width: var(--composer-action-size);
      height: var(--composer-action-size);
      min-height: var(--composer-action-size);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    .editor-launch-btn svg {
      width: 16px;
      height: 16px;
      display: block;
      flex: none;
    }
    .composer-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: stretch;
    }
    .draft-editor-stage {
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: flex;
      padding: 8px;
      box-sizing: border-box;
    }
    .draft-editor-textarea {
      width: 100%;
      height: 100%;
      min-height: 100%;
      resize: none;
      box-sizing: border-box;
      border: 1px solid #ccd7e7;
      border-radius: 18px;
      background: #fff;
      color: var(--text);
      padding: 14px 16px;
      box-shadow: inset 0 1px 4px rgba(34, 53, 88, .05);
    }
    .media-dialog.editor-mode #mediaViewerHint {
      display: none;
    }
    .hidden { display: none !important; }
    .footer-note { color: var(--muted); font-size: 12px; }
    #mediaViewerHint {
      text-align: center;
      line-height: 1.45;
    }

    .login-mask {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 38, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
    }
    .login-box {
      width: min(92vw, 360px);
      background: #fff;
      border: 1px solid #d9e4f2;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 27, 41, .25);
      z-index: 110;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 16px;
    }
    .task-dialog {
      width: min(960px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid #d8e2f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .task-head {
      padding: 12px;
      border-bottom: 1px solid #e1e9f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .task-list {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      border: 1px solid #dbe5f3;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    .search-dialog {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid #d8e2f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      margin: auto;
      max-height: min(92vh, 420px);
    }
    .confirm-dialog {
      width: min(420px, 100%);
      gap: 14px;
    }
    .paste-progress-dialog {
      width: min(420px, 100%);
      gap: 14px;
      padding: 22px 20px 18px;
      box-sizing: border-box;
    }
    #largePasteOverlay {
      z-index: 160;
    }
    .paste-progress-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .paste-progress-copy {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
    }
    .paste-progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .paste-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
      transition: width .12s linear;
    }
    .paste-progress-meta {
      font-size: 13px;
      color: #334155;
      text-align: center;
    }
    .paste-progress-actions {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }
    .paste-progress-actions .danger {
      min-width: 128px;
    }
    .toast-stack {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 180;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      min-width: 180px;
      max-width: min(84vw, 360px);
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      background: rgba(36, 48, 67, 0.94);
      box-shadow: 0 10px 24px rgba(22, 33, 52, 0.18);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

      right: 0;
      top: 50%;
      height: 4px;

    function formatBytes(bytes) {

      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;

    function getHeightOffset(heights, endExclusive) {
      let total = 0;
      for (let i = 0; i < endExclusive; i += 1) {
        total += heights[i] || 0;
      }
      return total;
    }

    function findIndexAtOffset(heights, targetOffset) {
      if (!heights.length) {
        return { index: 0, offset: 0 };
      }

      let offset = 0;
      for (let i = 0; i < heights.length; i += 1) {
        const nextHeight = heights[i] || 0;
        if (offset + nextHeight > targetOffset || i === heights.length - 1) {
          return { index: i, offset };
        }
        offset += nextHeight;
      }

      return { index: 0, offset: 0 };
    }

    function createViewerChrome(stageClassName, { hideHorizontal = false } = {}) {
      const shell = document.createElement('div');
      shell.className = 'viewer-shell';

      const stage = document.createElement('div');
      stage.className = stageClassName;
      shell.appendChild(stage);

      const horizontal = document.createElement('div');
      horizontal.className = `viewer-indicator-track horizontal${hideHorizontal ? ' hidden' : ''}`;
      const horizontalThumb = document.createElement('div');
      horizontalThumb.className = 'viewer-indicator-thumb';
      horizontal.appendChild(horizontalThumb);

      const vertical = document.createElement('div');
      vertical.className = 'viewer-indicator-track vertical';
      const verticalThumb = document.createElement('div');
      verticalThumb.className = 'viewer-indicator-thumb';
      vertical.appendChild(verticalThumb);

      shell.appendChild(horizontal);
      shell.appendChild(vertical);

      let hideTimer = 0;
      let horizontalDisabled = hideHorizontal;
      const showIndicators = () => {
        shell.classList.add('indicators-visible');
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = window.setTimeout(() => {
          hideTimer = 0;
          shell.classList.remove('indicators-visible');
        }, VIEWER_INDICATOR_IDLE_MS);
      };

      const syncFromHorizontalPointer = (clientX) => {
        const rect = horizontal.getBoundingClientRect();
        const ratio = rect.width > 0 ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
        stage.scrollLeft = ratio * Math.max(0, stage.scrollWidth - stage.clientWidth);
        syncIndicators(true);
      };

      const syncFromVerticalPointer = (clientY) => {
        const rect = vertical.getBoundingClientRect();
        const ratio = rect.height > 0 ? Math.min(1, Math.max(0, (clientY - rect.top) / rect.height)) : 0;
        stage.scrollTop = ratio * Math.max(0, stage.scrollHeight - stage.clientHeight);
        syncIndicators(true);
      };

      const bindTrackDrag = (track, thumb, axis) => {
        let activePointerId = null;
        const moveHandler = (event) => {
          if (activePointerId !== null && event.pointerId !== activePointerId) return;
          event.preventDefault();
          if (axis === 'x') {
            syncFromHorizontalPointer(event.clientX);
          } else {
            syncFromVerticalPointer(event.clientY);
          }
        };
        const upHandler = () => {
          if (activePointerId !== null) {
            try {
              track.releasePointerCapture?.(activePointerId);
            } catch (_) {}
          }
          activePointerId = null;
          setGlobalDragScrollLock(false);
          thumb.classList.remove('dragging');
          window.removeEventListener('pointermove', moveHandler, true);
          window.removeEventListener('pointerup', upHandler, true);
          window.removeEventListener('pointercancel', upHandler, true);
        };
        track.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          event.stopPropagation();
          activePointerId = event.pointerId;
          setGlobalDragScrollLock(true);
          try {
            track.setPointerCapture?.(event.pointerId);
          } catch (_) {}
          thumb.classList.add('dragging');
          showIndicators();
          moveHandler(event);
          window.addEventListener('pointermove', moveHandler, true);
          window.addEventListener('pointerup', upHandler, true);
          window.addEventListener('pointercancel', upHandler, true);
        });
      };

      const syncIndicators = (forceVisible = false) => {
        const horizontalScrollable = !horizontalDisabled && stage.scrollWidth - stage.clientWidth > 1;
        const verticalScrollable = stage.scrollHeight - stage.clientHeight > 1;

        horizontal.classList.toggle('hidden', !horizontalScrollable);
        vertical.classList.toggle('hidden', !verticalScrollable);

        if (horizontalScrollable) {
          const trackWidth = horizontal.clientWidth || Math.max(1, shell.clientWidth - 28);
          const thumbWidth = Math.max(24, trackWidth * (stage.clientWidth / Math.max(stage.scrollWidth, 1)));
          const maxLeft = Math.max(0, trackWidth - thumbWidth);
          const progress = stage.scrollWidth > stage.clientWidth ? stage.scrollLeft / (stage.scrollWidth - stage.clientWidth) : 0;
          horizontalThumb.style.width = `${thumbWidth}px`;
          horizontalThumb.style.height = '4px';
          horizontalThumb.style.transform = `translateX(${maxLeft * progress}px)`;
        }

        if (verticalScrollable) {
          const trackHeight = vertical.clientHeight || Math.max(1, shell.clientHeight - 30);
          const thumbHeight = Math.max(24, trackHeight * (stage.clientHeight / Math.max(stage.scrollHeight, 1)));
          const maxTop = Math.max(0, trackHeight - thumbHeight);
          const progress = stage.scrollHeight > stage.clientHeight ? stage.scrollTop / (stage.scrollHeight - stage.clientHeight) : 0;
          verticalThumb.style.width = '4px';
          verticalThumb.style.height = `${thumbHeight}px`;
          verticalThumb.style.transform = `translateY(${maxTop * progress}px)`;
        }

        if (forceVisible) showIndicators();
      };

      const pointerHandler = () => showIndicators();
      const scrollHandler = () => syncIndicators(true);
      stage.addEventListener('scroll', scrollHandler, { passive: true });
      stage.addEventListener('pointerdown', pointerHandler, { passive: true });
      stage.addEventListener('wheel', pointerHandler, { passive: true });
      bindTrackDrag(horizontal, horizontalThumb, 'x');
      bindTrackDrag(vertical, verticalThumb, 'y');

      return {
        shell,
        stage,
        syncIndicators,
        showIndicators,
        setHorizontalHidden(hidden) {
          horizontalDisabled = hidden;
          syncIndicators(false);
        },
        cleanup() {
          stage.removeEventListener('scroll', scrollHandler);
          stage.removeEventListener('pointerdown', pointerHandler);
          stage.removeEventListener('wheel', pointerHandler);
          if (hideTimer) clearTimeout(hideTimer);
        },
      };
    }

    function createMomentumScroller(getStage, onUpdate = () => {}) {
      let rafId = 0;
      let velocityX = 0;
      let velocityY = 0;
      let lastX = 0;
      let lastY = 0;
      let lastTime = 0;

      const stop = () => {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        velocityX = 0;
        velocityY = 0;
      };

      const begin = (x, y) => {
        stop();
        lastX = x;
        lastY = y;
        lastTime = performance.now();
      };

      const track = (x, y) => {
        const now = performance.now();
        const dt = Math.max(1, now - lastTime);
        const dx = lastX - x;
        const dy = lastY - y;
        const frameScale = Math.min(1.6, 16.67 / dt);
        velocityX = Math.max(-48, Math.min(48, velocityX * 0.55 + dx * frameScale * 0.18));
        velocityY = Math.max(-48, Math.min(48, velocityY * 0.55 + dy * frameScale * 0.18));
        lastX = x;
        lastY = y;
        lastTime = now;
      };

      const release = () => {
        if (Math.hypot(velocityX, velocityY) < 0.35) {
          stop();
          return;
        }
        const step = () => {
          const stage = getStage();
          if (!stage) {
            stop();
            return;
          }
          const maxLeft = Math.max(0, stage.scrollWidth - stage.clientWidth);
          const maxTop = Math.max(0, stage.scrollHeight - stage.clientHeight);
          const nextLeft = Math.max(0, Math.min(maxLeft, stage.scrollLeft + velocityX));
          const nextTop = Math.max(0, Math.min(maxTop, stage.scrollTop + velocityY));
          const hitEdgeX = nextLeft === 0 || nextLeft === maxLeft;
          const hitEdgeY = nextTop === 0 || nextTop === maxTop;
          stage.scrollLeft = nextLeft;
          stage.scrollTop = nextTop;
          onUpdate();
          velocityX *= hitEdgeX ? 0.62 : 0.88;
          velocityY *= hitEdgeY ? 0.62 : 0.88;
          if (Math.hypot(velocityX, velocityY) < 0.35) {
            stop();
            return;
          }
          rafId = requestAnimationFrame(step);
        };
        rafId = requestAnimationFrame(step);
      };

      return { begin, track, release, stop };
    }

    function setInputDragActive(active) {

      return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;

    function ensureChatVirtualState() {
      if (chatVirtualState) return chatVirtualState;
      const topSpacer = document.createElement('div');
      topSpacer.className = 'chat-spacer';
      const host = document.createElement('div');
      host.className = 'chat-virtual-host';
      const bottomSpacer = document.createElement('div');
      bottomSpacer.className = 'chat-spacer';
      chat.replaceChildren(topSpacer, host, bottomSpacer);
      const state = {
        topSpacer,
        host,
        bottomSpacer,
        heights: new Map(),
        nodeCache: new Map(),
        start: 0,
        end: 0,
        shouldVirtualize: false,
        rowResizeObserver: null,
        measureRaf: 0,
        pendingAnchor: null,
        scrollSettleTimer: 0,
      };
      state.rowResizeObserver = new ResizeObserver((entries) => {
        let changed = false;
        for (const entry of entries) {
          const row = entry.target;
          const messageId = Number(row.dataset.messageId);
          if (!Number.isFinite(messageId)) continue;
          const measuredHeight = Math.ceil(row.getBoundingClientRect().height) + (row.dataset.isLast === '1' ? 0 : CHAT_ITEM_GAP);
          if (measuredHeight > 0 && Math.abs(measuredHeight - (state.heights.get(messageId) || 0)) > 1) {
            state.heights.set(messageId, measuredHeight);
            changed = true;
          }
        }
        if (!changed) return;
        if (state.scrollSettleTimer) {
          state.pendingAnchor = captureChatScrollAnchor();
          return;
        }
        queueChatViewportStabilize(captureChatScrollAnchor());
      });
      chatVirtualState = state;
      return chatVirtualState;
    }

    function queueChatViewportStabilize(anchor = null) {
      const state = ensureChatVirtualState();
      if (anchor && !state.pendingAnchor) {
        state.pendingAnchor = anchor;
      }
      if (state.measureRaf) return;
      state.measureRaf = requestAnimationFrame(() => {
        state.measureRaf = 0;
        const nextAnchor = state.pendingAnchor;
        state.pendingAnchor = null;
        renderChatViewport({ forceMessageId: nextAnchor?.messageId ?? null });
        if (nextAnchor) {
          restoreChatScrollAnchor(nextAnchor);
        }
      });
    }

    function scheduleChatViewportRender(forceMessageId = null) {
      if (forceMessageId != null) {
        chatViewportForcedMessageId = forceMessageId;
      }
      if (chatViewportRaf) return;
      chatViewportRaf = requestAnimationFrame(() => {
        chatViewportRaf = 0;
        const nextForcedId = chatViewportForcedMessageId;
        chatViewportForcedMessageId = null;
        renderChatViewport({ forceMessageId: nextForcedId });
      });
    }

    function scheduleChatScrollSettle() {
      const state = ensureChatVirtualState();
      if (state.scrollSettleTimer) clearTimeout(state.scrollSettleTimer);
      state.scrollSettleTimer = window.setTimeout(() => {
        state.scrollSettleTimer = 0;
        if (state.pendingAnchor) {
          const anchor = state.pendingAnchor;
          state.pendingAnchor = null;
          queueChatViewportStabilize(anchor);
        }
      }, SCROLL_SETTLE_MS);
    }

    function trimChatHeightCache(messages) {
      const state = ensureChatVirtualState();
      const liveIds = new Set(messages.map((msg) => msg.id));
      Array.from(state.heights.keys()).forEach((messageId) => {
        if (!liveIds.has(messageId)) {
          state.heights.delete(messageId);
        }
      });
      Array.from(state.nodeCache.keys()).forEach((messageId) => {
        if (!liveIds.has(messageId)) {
          state.nodeCache.delete(messageId);
        }
      });
    }

    function syncCachedMessageRow(row, msg) {
      if (!row) return;
      row.className = 'item';
      if (isSelfMessage(msg.id)) {
        row.classList.add('self');

      if (msg.id === getCurrentMediaMessageId()) {

      row.dataset.messageId = String(msg.id);
      const checkbox = row.querySelector('input[type="checkbox"]');
      if (checkbox) {

    function getChatRow(msg) {
      const state = ensureChatVirtualState();
      const cached = state.nodeCache.get(msg.id);
      if (cached && cached.manageMode === manageMode) {
        cached.hiddenAt = null;
        cached.lastSeenAt = Date.now();
        syncCachedMessageRow(cached.row, msg);
        return cached.row;
      }

      const row = renderMessage(msg);
      state.nodeCache.set(msg.id, {
        row,
        manageMode,
        hiddenAt: null,
        lastSeenAt: Date.now(),
      });
      return row;
    }

    function markChatRowCacheVisibility(visibleIds = new Set()) {
      const state = ensureChatVirtualState();
      const now = Date.now();
      for (const [messageId, entry] of state.nodeCache.entries()) {
        if (visibleIds.has(messageId)) {
          entry.hiddenAt = null;
          entry.lastSeenAt = now;
          continue;
        }
        if (entry.hiddenAt == null) {
          entry.hiddenAt = now;
        }
      }
    }

    function sweepChatRowCache() {
      const state = ensureChatVirtualState();
      const now = Date.now();
      for (const [messageId, entry] of state.nodeCache.entries()) {
        if (entry.hiddenAt == null) continue;
        if (now - entry.hiddenAt >= VIRTUAL_RETENTION_TTL) {
          state.nodeCache.delete(messageId);
        }
      }
    }

    function sweepVirtualRetentionCaches() {
      sweepChatRowCache();
      sweepTextViewerBlockCache();
    }

    if (!virtualRetentionClock) {
      virtualRetentionClock = window.setInterval(() => {
        sweepVirtualRetentionCaches();
      }, VIRTUAL_RETENTION_TICK_MS);
    }

    function estimateChatMessageHeight(msg) {
      const chatWidth = Math.max(320, chat.clientWidth || 640);
      const bubbleWidth = Math.max(220, Math.min(820, chatWidth - (manageMode ? 96 : 56)));
      const baseHeight = manageMode ? 90 : 68;
      if (msg.kind === 'text') {
        const textValue = msg.text || '';
        const textPreview = getTextPreview(textValue);
        const previewText = textPreview.truncated ? `${textPreview.preview}...` : textValue;
        const charsPerLine = Math.max(18, Math.floor(bubbleWidth / 7.2));
        const logicalLines = String(previewText || '').split('\n').reduce((sum, line) => {
          return sum + Math.max(1, Math.ceil(Math.max(line.length, 1) / charsPerLine));
        }, 0);
        return baseHeight + logicalLines * 24 + (textPreview.truncated ? 42 : 0) + CHAT_ITEM_GAP;
      }
      const mimeType = msg.mime_type || '';
      if (mimeType.startsWith('image/')) return baseHeight + Math.min(360, bubbleWidth * 0.72) + CHAT_ITEM_GAP;
      if (mimeType.startsWith('video/')) return baseHeight + 230 + CHAT_ITEM_GAP;
      if (mimeType.startsWith('audio/')) return baseHeight + 176 + CHAT_ITEM_GAP;
      return baseHeight + 54 + CHAT_ITEM_GAP;
    }

    function getChatMessageHeight(msg) {
      const state = ensureChatVirtualState();
      return state.heights.get(msg.id) || estimateChatMessageHeight(msg);
    }

    function getChatOffsetForIndex(messages, targetIndex) {
      let offset = 0;
      for (let i = 0; i < targetIndex; i += 1) {
        offset += getChatMessageHeight(messages[i]);
      }
      return offset;
    }

    function computeChatViewport(messages, forceMessageId = null) {
      const heights = messages.map((msg) => getChatMessageHeight(msg));
      const totalHeight = heights.reduce((sum, height) => sum + height, 0);
      const shouldVirtualize = messages.length >= CHAT_VIRTUALIZE_THRESHOLD;
      if (!shouldVirtualize) {
        return {
          shouldVirtualize,
          totalHeight,
          start: 0,
          end: messages.length,
          topHeight: 0,
          bottomHeight: 0,
        };
      }

      const visibleTop = findIndexAtOffset(heights, chat.scrollTop);
      const endBoundary = chat.scrollTop + chat.clientHeight;

      let visibleEnd = visibleTop.index;
      let renderedBottom = visibleTop.offset;
      while (visibleEnd < messages.length && renderedBottom < endBoundary) {
        renderedBottom += heights[visibleEnd];
        visibleEnd += 1;
      }
      if (visibleEnd === visibleTop.index && visibleEnd < messages.length) {
        renderedBottom += heights[visibleEnd];
        visibleEnd += 1;
      }

      let start = Math.max(0, visibleTop.index - CHAT_VIRTUAL_PRELOAD_BEFORE);
      let end = Math.min(messages.length, visibleEnd + CHAT_VIRTUAL_PRELOAD_AFTER);

      if (forceMessageId != null) {
        const forcedIndex = messages.findIndex((msg) => msg.id === forceMessageId);
        if (forcedIndex >= 0 && (forcedIndex < start || forcedIndex >= end)) {
          start = Math.max(0, forcedIndex - CHAT_VIRTUAL_PRELOAD_BEFORE);
          end = Math.min(messages.length, Math.max(visibleEnd + CHAT_VIRTUAL_PRELOAD_AFTER, forcedIndex + 1 + CHAT_VIRTUAL_PRELOAD_AFTER));
        }
      }

      const topHeight = getHeightOffset(heights, start);
      const endHeight = getHeightOffset(heights, end);
      return {
        shouldVirtualize,
        totalHeight,
        start,
        end,
        topHeight,
        bottomHeight: Math.max(0, totalHeight - endHeight),
      };
    }

    function renderChatViewport({ forceMessageId = null } = {}) {
      const state = ensureChatVirtualState();
      const visible = getVisibleMessages();
      trimChatHeightCache(visible);

      if (!visible.length) {
        state.topSpacer.style.height = '0px';
        state.bottomSpacer.style.height = '0px';
        state.host.replaceChildren();
        state.start = 0;
        state.end = 0;
        state.shouldVirtualize = false;
        return;
      }

      const viewport = computeChatViewport(visible, forceMessageId);
      if (
        forceMessageId == null &&
        state.start === viewport.start &&
        state.end === viewport.end &&
        state.shouldVirtualize === viewport.shouldVirtualize
      ) {
        state.topSpacer.style.height = viewport.shouldVirtualize ? `${viewport.topHeight}px` : '0px';
        state.bottomSpacer.style.height = viewport.shouldVirtualize ? `${viewport.bottomHeight}px` : '0px';
        return;
      }
      state.shouldVirtualize = viewport.shouldVirtualize;
      state.start = viewport.start;
      state.end = viewport.end;
      state.topSpacer.style.height = viewport.shouldVirtualize ? `${viewport.topHeight}px` : '0px';
      state.bottomSpacer.style.height = viewport.shouldVirtualize ? `${viewport.bottomHeight}px` : '0px';

      if (state.rowResizeObserver) {
        state.rowResizeObserver.disconnect();
      }

      const fragment = document.createDocumentFragment();
      const visibleIds = new Set();
      for (let i = viewport.start; i < viewport.end; i += 1) {
        visibleIds.add(visible[i].id);
        fragment.appendChild(getChatRow(visible[i]));
      }
      state.host.replaceChildren(fragment);

      let measuredChanged = false;
      Array.from(state.host.children).forEach((row, offset) => {
        const msg = visible[viewport.start + offset];
        const isLast = viewport.start + offset >= visible.length - 1;
        row.dataset.isLast = isLast ? '1' : '0';
        const measuredHeight = Math.ceil(row.getBoundingClientRect().height) + (isLast ? 0 : CHAT_ITEM_GAP);
        if (measuredHeight > 0 && Math.abs(measuredHeight - getChatMessageHeight(msg)) > 1) {
          state.heights.set(msg.id, measuredHeight);
          measuredChanged = true;
        }
        if (state.rowResizeObserver) {
          state.rowResizeObserver.observe(row);
        }
      });
      markChatRowCacheVisibility(visibleIds);

      if (measuredChanged) {
        queueChatViewportStabilize(captureChatScrollAnchor());
      }
    }

    function getBubbleVariant(msg) {
      if (msg.kind === 'text') {
        return isSelfMessage(msg.id) ? 'bubble-self-text' : 'bubble-text';
      }
      const mimeType = msg.mime_type || '';
      if (mimeType.startsWith('image/')) return 'bubble-file-image';
      if (mimeType.startsWith('video/')) return 'bubble-file-video';
      if (mimeType.startsWith('audio/')) return 'bubble-file-audio';
      if (isTextLikeFileMessage(msg)) return 'bubble-file-textlike';
      return 'bubble-file';
    }

    function loadSelfMessageIds() {

    function isChatNearBottom() {

    function showChatScrollIndicator() {
      if (!chatPanel || !chatScrollIndicator) return;

      chatIndicatorHideTimer = window.setTimeout(() => {

    function syncChatScrollIndicator(forceVisible = false) {
      if (!chatScrollIndicator || !chatScrollThumb) return;
      const scrollable = chat.scrollHeight - chat.clientHeight > 1;
      chatScrollIndicator.classList.toggle('hidden', !scrollable);
      if (!scrollable) return;
      const trackHeight = chatScrollIndicator.clientHeight || Math.max(1, chat.clientHeight - 24);
      const thumbHeight = Math.max(24, trackHeight * (chat.clientHeight / Math.max(chat.scrollHeight, 1)));
      const maxTop = Math.max(0, trackHeight - thumbHeight);
      const progress = chat.scrollHeight > chat.clientHeight ? chat.scrollTop / (chat.scrollHeight - chat.clientHeight) : 0;
      chatScrollThumb.style.height = `${thumbHeight}px`;
      chatScrollThumb.style.transform = `translateY(${maxTop * progress}px)`;
      if (forceVisible) showChatScrollIndicator();

    function bindChatScrollIndicatorDrag() {
      if (!chatScrollIndicator || !chatScrollThumb) return;
      let activePointerId = null;
      const moveHandler = (event) => {
        if (activePointerId !== null && event.pointerId !== activePointerId) return;
        event.preventDefault();
        const rect = chatScrollIndicator.getBoundingClientRect();
        const ratio = rect.height > 0 ? Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height)) : 0;
        chat.scrollTop = ratio * Math.max(0, chat.scrollHeight - chat.clientHeight);
        syncChatScrollIndicator(true);
      };
      const upHandler = () => {
        if (activePointerId !== null) {
          try {
            chatScrollIndicator.releasePointerCapture?.(activePointerId);
          } catch (_) {}
        }
        activePointerId = null;
        setGlobalDragScrollLock(false);
        chatScrollThumb.classList.remove('dragging');
        window.removeEventListener('pointermove', moveHandler, true);
        window.removeEventListener('pointerup', upHandler, true);
        window.removeEventListener('pointercancel', upHandler, true);
      };
      chatScrollIndicator.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        activePointerId = event.pointerId;
        setGlobalDragScrollLock(true);
        try {
          chatScrollIndicator.setPointerCapture?.(event.pointerId);
        } catch (_) {}
        chatScrollThumb.classList.add('dragging');
        showChatScrollIndicator();
        moveHandler(event);
        window.addEventListener('pointermove', moveHandler, true);
        window.addEventListener('pointerup', upHandler, true);
        window.addEventListener('pointercancel', upHandler, true);

    function bindResizeGrip(grip, target, { minHeight, maxHeight, onUpdate = () => {} } = {}) {
      if (!grip || !target) return;
      let activePointerId = null;
      let startY = 0;
      let startHeight = 0;
      const moveHandler = (event) => {
        if (activePointerId !== null && event.pointerId !== activePointerId) return;
        event.preventDefault();
        const nextHeight = Math.max(minHeight, Math.min(maxHeight, startHeight + (event.clientY - startY)));
        target.style.height = `${Math.round(nextHeight)}px`;
        onUpdate();
      };
      const upHandler = () => {
        if (activePointerId !== null) {
          try {
            grip.releasePointerCapture?.(activePointerId);
          } catch (_) {}
        }
        activePointerId = null;
        setGlobalDragScrollLock(false);
        grip.classList.remove('dragging');
        window.removeEventListener('pointermove', moveHandler, true);
        window.removeEventListener('pointerup', upHandler, true);
        window.removeEventListener('pointercancel', upHandler, true);
        saveCurrentSizeUiState().catch(() => {});

      };
      grip.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        activePointerId = event.pointerId;
        startY = event.clientY;
        startHeight = target.getBoundingClientRect().height;
        setGlobalDragScrollLock(true);
        try {
          grip.setPointerCapture?.(event.pointerId);
        } catch (_) {}
        grip.classList.add('dragging');
        window.addEventListener('pointermove', moveHandler, true);
        window.addEventListener('pointerup', upHandler, true);

    function applyUiState({ chat_height_px, input_height_px, text_wrap_enabled, text_zoom_scale }) {
      suppressUiResizeSave = true;
      chat.style.height = chat_height_px ? `${chat_height_px}px` : DEFAULT_CHAT_HEIGHT;

    async function saveMediaProgress(fileId, positionSeconds) {

      await api(`/api/video-progress/${encodeURIComponent(fileId)}`, {

    function getMediaCacheKey(item) {
      return item?.file_id || item?.file_url || item?.download_url || item?.file_name || '';
    }

    function getMediaCompatibility(item) {
      const key = getMediaCacheKey(item);
      return key ? mediaCompatibilityCache.get(key) || null : null;
    }

    function setMediaCompatibility(item, payload) {
      const key = getMediaCacheKey(item);
      if (!key) return;
      mediaCompatibilityCache.set(key, payload);
    }

    function getFileExtension(name) {
      const raw = String(name || '');
      const pos = raw.lastIndexOf('.');
      return pos >= 0 ? raw.slice(pos + 1).toLowerCase() : '';
    }

    function getFileBaseName(name) {
      const raw = String(name || '');
      const pos = raw.lastIndexOf('.');
      return pos > 0 ? raw.slice(0, pos) : raw;
    }

    function getMessageMediaKind(msg) {
      const mimeType = String(msg?.mime_type || '');
      if (mimeType.startsWith('image/')) return 'image';
      if (mimeType.startsWith('video/')) return 'video';
      if (mimeType.startsWith('audio/')) return 'audio';
      return null;
    }

    function isTextLikeFileMessage(msg) {
      if (msg?.kind !== 'file') return false;
      if (getMessageMediaKind(msg)) return false;
      const fileName = String(msg?.file_name || '').trim().toLowerCase();
      const mimeType = String(msg?.mime_type || '').toLowerCase();
      const ext = getFileExtension(fileName);
      if (TEXT_FILE_NAMES.has(fileName)) return true;
      if (mimeType.startsWith('text/')) return true;
      if (TEXT_FILE_MIME_ALLOWLIST.has(mimeType)) return true;
      if (mimeType.endsWith('+json') || mimeType.endsWith('+xml') || mimeType.endsWith('+yaml')) return true;
      if (mimeType.includes('javascript') || mimeType.includes('typescript')) return true;
      return TEXT_FILE_EXTENSIONS.has(ext);
    }

    async function fetchTextLikeFileContent(item) {
      const cacheKey = item?.file_id || item?.file_url || item?.id;
      if (!cacheKey) return '';
      if (textFileContentCache.has(cacheKey)) {
        return textFileContentCache.get(cacheKey);
      }
      const res = await fetch(item.file_url, token ? { headers: { Authorization: `Bearer ${token}` } } : {});
      if (!res.ok) {
        throw new Error(`读取文本文件失败: ${res.status}`);
      }
      const text = await res.text();
      textFileContentCache.set(cacheKey, text);
      return text;
    }

    function getTextMessageExportUrl(messageId) {
      return `/api/messages/${encodeURIComponent(String(messageId))}/export.txt`;
    }

    async function downloadTextMessageAsFile(messageId) {
      const res = await authorizedFetch(getTextMessageExportUrl(messageId));
      if (!res.ok) {
        throw new Error(`导出失败: ${res.status}`);
      }
      const blob = await res.blob();
      const disposition = res.headers.get('Content-Disposition') || '';
      const fileName = disposition.match(/filename="([^"]+)"/i)?.[1] || `message-${messageId}.txt`;
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = objectUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    }

    function isPlainFileMessage(msg) {
      return msg?.kind === 'file' && !getMessageMediaKind(msg) && !isTextLikeFileMessage(msg);
    }

    async function getViewerTextPayload(item) {
      if (item?.kind === 'text') {

      return {
        title: item?.file_name || '文本文件',

      };

    function normalizeSearchQuery(value) {

    }

    function matchesSearchQuery(msg, query = currentSearchQuery) {
      if (!query) return true;
      const text = msg?.kind === 'text' ? String(msg.text || '') : '';
      const fileName = msg?.kind === 'file' ? String(msg.file_name || '') : '';
      return text.toLowerCase().includes(query) || fileName.toLowerCase().includes(query);
    }

    function matchesCurrentFilter(msg) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'text') return msg.kind === 'text';
      if (currentFilter === 'file') return msg?.kind === 'file' && !getMessageMediaKind(msg);
      return getMessageMediaKind(msg) === currentFilter;
    }

    function isDefaultWindowLayout() {
      const chatDefault = !chat.style.height || chat.style.height === DEFAULT_CHAT_HEIGHT;

      if (currentFilter !== 'all') {

    function showToast(message, tone = 'success') {
      if (!toastStack) return;

      toast.className = `toast ${tone}`;

      toastStack.appendChild(toast);

    function openConfirmDialog({ title, message }) {

      }

    function formatLargePasteProgress(inserted, total) {
      const safeTotal = Math.max(1, Number(total || 0));
      const safeInserted = Math.min(safeTotal, Math.max(0, Number(inserted || 0)));
      const totalChunks = Math.max(1, Math.ceil(safeTotal / LARGE_PASTE_CHUNK_SIZE));
      const currentChunk = safeInserted <= 0 ? 1 : Math.min(totalChunks, Math.ceil(safeInserted / LARGE_PASTE_CHUNK_SIZE));
      return {
        currentChunk,
        totalChunks,
        percent: Math.min(100, Math.max(0, (safeInserted / safeTotal) * 100)),
      };
    }

    function updateLargePasteDialog(inserted, total, { progressVerb = '粘贴' } = {}) {
      if (!largePasteOverlay || !largePasteProgressFill || !largePasteProgressMeta) return;
      const progress = formatLargePasteProgress(inserted, total);
      largePasteProgressFill.style.width = `${progress.percent}%`;
      largePasteProgressMeta.textContent = `当前正在${progressVerb}第 ${progress.currentChunk} / ${progress.totalChunks} 片`;
    }

    function closeLargePasteDialog() {
      largePasteOverlay?.classList.add('hidden');
      activeLargePasteSession = null;
    }

    function openLargePasteDialog({ total, onCancel, title = '正在分段粘贴', message = '正在把大段文本分片写入输入区，请稍候。', progressVerb = '粘贴' }) {
      activeLargePasteSession = { onCancel };
      if (largePasteTitle) {
        largePasteTitle.textContent = title;
      }
      if (largePasteMessage) {
        largePasteMessage.textContent = message;
      }
      updateLargePasteDialog(0, total, { progressVerb });
      largePasteOverlay?.classList.remove('hidden');
      requestAnimationFrame(() => largePasteCancelBtn?.focus());
    }

    async function replaceTextareaValueWithProgress(textarea, text, {
      title = '正在分段粘贴',
      message = '正在把大段文本分片写入输入区，请稍候。',
      progressVerb = '粘贴',
      cancelToast = '已取消分段粘贴，已保留当前已写入内容',
      restoreOnCancel = false,
    } = {}) {
      const previousReadOnly = textarea.readOnly;
      const previousValue = textarea.value || '';
      const controller = { cancelled: false };
      let finalInserted = 0;
      let cancelled = false;
      textarea.dataset.largePasteBusy = '1';
      textarea.style.cursor = 'progress';
      textarea.readOnly = true;
      openLargePasteDialog({ total: text.length, onCancel: () => { controller.cancelled = true; }, title, message, progressVerb });
      await new Promise((resolve) => requestAnimationFrame(resolve));
      try {
        const result = await insertLargeTextInChunks(textarea, text, {
          start: 0,
          end: previousValue.length,
          controller,
          onChunk(inserted, total) {
            updateLargePasteDialog(inserted, total, { progressVerb });
          },
        });
        finalInserted = result?.inserted || 0;
        cancelled = Boolean(result?.cancelled);
        if (cancelled) {
          if (restoreOnCancel) {
            textarea.value = previousValue;
          }
          showToast(cancelToast, 'error');
        }
        return { cancelled, inserted: finalInserted };
      } finally {
        closeLargePasteDialog();
        delete textarea.dataset.largePasteBusy;
        textarea.style.cursor = '';
        textarea.readOnly = previousReadOnly;
      }
    }

    function toggleFilterMenu(force) {
      const nextHidden = typeof force === 'boolean' ? !force : !filterMenu.classList.contains('hidden');
      filterMenu.classList.toggle('hidden', nextHidden);
    }

    function applySearchQuery(value) {
      currentSearchQuery = normalizeSearchQuery(value);
      updateFilterButtonStates();
      renderMessages({ preserveScroll: true });
    }

    function syncVirtualTextareaBinding(binding, { force = false } = {}) {
      if (!binding?.textarea || !binding?.stage || !binding?.content || !binding?.scroll) return;
      const value = binding.textarea.value || '';
      const isActivelyEditing = document.activeElement === binding.textarea;
      const needsMirror = !isActivelyEditing && (force || binding.alwaysMirror || value.length >= INPUT_VIRTUALIZE_THRESHOLD);
      binding.stage.classList.toggle('mirror-disabled', !needsMirror);
      if (!needsMirror) {
        binding.content.textContent = '';
        binding.scroll.style.height = `${binding.textarea.scrollHeight || binding.textarea.clientHeight || 0}px`;
        return;
      }

      const lines = value.split('\n');
      const totalLines = Math.max(lines.length, 1);
      const scrollTop = binding.textarea.scrollTop;
      const scrollHeight = binding.textarea.scrollHeight || binding.textarea.clientHeight || 0;
      const viewportHeight = binding.textarea.clientHeight || parseInt(binding.textarea.style.height || '0', 10) || 110;
      const estimatedVisualLines = Math.max(1, Math.round(scrollHeight / INPUT_LINE_HEIGHT));
      const wrapHeavy = estimatedVisualLines > totalLines + INPUT_OVERSCAN_LINES;

      if (wrapHeavy) {
        binding.content.textContent = value || ' ';
        binding.content.style.top = '0px';
        binding.scroll.style.height = `${scrollHeight}px`;
        if (binding.layer) {
          binding.layer.scrollTop = scrollTop;
        }
        return;
      }

      const startLine = Math.max(0, Math.floor(scrollTop / INPUT_LINE_HEIGHT) - INPUT_OVERSCAN_LINES);
      const visibleLineCount = Math.max(1, Math.ceil(viewportHeight / INPUT_LINE_HEIGHT) + INPUT_OVERSCAN_LINES * 2);
      const endLine = Math.min(totalLines, startLine + visibleLineCount);
      binding.content.textContent = lines.slice(startLine, endLine).join('\n') || ' ';
      binding.content.style.top = `${startLine * INPUT_LINE_HEIGHT}px`;
      binding.scroll.style.height = `${Math.max(scrollHeight, totalLines * INPUT_LINE_HEIGHT + 20)}px`;
      if (binding.layer) {
        binding.layer.scrollTop = scrollTop;
      }
    }

    function syncInputVirtualization() {
      syncVirtualTextareaBinding({
        stage: textInputStage,
        textarea: textInput,
        layer: inputVirtualLayer,
        scroll: inputVirtualScroll,
        content: inputVirtualContent,
        alwaysMirror: false,
      }, { force: Boolean(activeEditorState) });
    }

    let openDraftEditorBusy = false;

    async function triggerOpenDraftEditor() {
      if (openDraftEditorBusy) return;
      openDraftEditorBusy = true;
      try {
        await openDraftEditor();
      } finally {
        openDraftEditorBusy = false;
      }
    }

    function shouldChunkLargePaste(text) {
      return String(text || '').length >= LARGE_PASTE_THRESHOLD;
    }

    async function insertLargeTextInChunks(textarea, text, { onChunk = null, start = null, end = null, controller = null } = {}) {
      const initialValue = textarea.value || '';
      const safeStart = Number.isFinite(start) ? start : (textarea.selectionStart ?? initialValue.length);
      const safeEnd = Number.isFinite(end) ? end : (textarea.selectionEnd ?? initialValue.length);
      const before = initialValue.slice(0, safeStart);
      const after = initialValue.slice(safeEnd);
      let inserted = 0;
      textarea.value = before;
      if (typeof onChunk === 'function') {
        onChunk(0, text.length);
      }
      while (inserted < text.length) {
        if (controller?.cancelled) break;
        const chunk = text.slice(inserted, inserted + LARGE_PASTE_CHUNK_SIZE);
        textarea.value += chunk;
        inserted += chunk.length;
        const caret = before.length + inserted;
        textarea.setSelectionRange(caret, caret);
        if (typeof onChunk === 'function') {
          onChunk(inserted, text.length);
        }
        if (inserted < text.length) {
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      }
      textarea.value += after;
      const finalCaret = before.length + inserted;
      textarea.setSelectionRange(finalCaret, finalCaret);
      return { inserted, cancelled: Boolean(controller?.cancelled) };
    }

    function handleLargeTextPaste(event, textarea, { onChunk = null } = {}) {
      if (!textarea || textarea.dataset.largePasteBusy === '1') {
        event.preventDefault();
        return true;
      }
      const pastedText = event.clipboardData?.getData('text/plain') || '';
      if (!shouldChunkLargePaste(pastedText)) {
        return false;
      }

      event.preventDefault();
      const start = textarea.selectionStart ?? textarea.value.length;
      const end = textarea.selectionEnd ?? textarea.value.length;
      const previousReadOnly = textarea.readOnly;
      const controller = { cancelled: false };
      let finalInserted = 0;
      let cancelled = false;
      textarea.dataset.largePasteBusy = '1';
      textarea.style.cursor = 'progress';
      textarea.readOnly = true;
      openLargePasteDialog({
        total: pastedText.length,
        onCancel: () => {
          controller.cancelled = true;
        },
        title: '正在分段粘贴',
        message: '正在把大段文本分片写入输入区，请稍候。',
        progressVerb: '粘贴',
      });
      insertLargeTextInChunks(textarea, pastedText, {
        onChunk(inserted, total) {
          updateLargePasteDialog(inserted, total, { progressVerb: '粘贴' });
          if (typeof onChunk === 'function') {
            onChunk(inserted, total);
          }
        },
        start,
        end,
        controller,
      })
        .then((result) => {
          finalInserted = result?.inserted || 0;
          cancelled = Boolean(result?.cancelled);
          if (cancelled) {
            showToast('已取消分段粘贴，已保留当前已写入内容', 'error');
          }
        })
        .catch((err) => alert(err?.message || '大文本粘贴失败'))
        .finally(() => {
          closeLargePasteDialog();
          delete textarea.dataset.largePasteBusy;
          textarea.style.cursor = '';
          textarea.readOnly = previousReadOnly;
          if (typeof onChunk === 'function') {
            onChunk(cancelled ? finalInserted : pastedText.length, pastedText.length);
          }
        });
      return true;
    }

    function getTextPreview(text) {
      const raw = String(text || '');
      let lineBoundary = raw.length;
      let lineCount = 1;
      for (let i = 0; i < raw.length; i += 1) {
        if (raw[i] !== '\n') continue;
        if (lineCount >= TEXT_PREVIEW_MAX_LINES) {
          lineBoundary = i;
          break;
        }
        lineCount += 1;
      }
      const limit = Math.min(raw.length, TEXT_PREVIEW_MAX_CHARS, lineBoundary);
      return {
        preview: raw.slice(0, limit).replace(/\s+$/u, ''),
        truncated: limit < raw.length,
      };
    }

    function getViewerMessageTitle(item) {
      if (item?.kind === 'text') {
        return String(item.text || '').split('\n').find((line) => line.trim()) || '文本消息';
      }
      return getFileBaseName(item?.file_name || '媒体文件');
    }

    function formatMediaTypeLabel(mimeType, fileName) {
      const ext = getFileExtension(fileName);
      if (ext) return ext.toUpperCase();
      if (!mimeType) return 'FILE';
      const major = mimeType.split('/')[0] || mimeType;
      return major.toUpperCase();
    }

    function truncateMediaTitleName(name) {
      const raw = String(name || '媒体文件');
      const budget = window.innerWidth <= 768 ? 10 : 18;
      if (raw.length <= budget) return raw;
      return `${raw.slice(0, Math.max(1, budget - 3))}...`;
    }

    function renderMediaViewerTitle(item, index, total) {
      const fileName = getViewerMessageTitle(item);
      const nameSpan = document.createElement('span');
      nameSpan.className = 'media-title-name';
      nameSpan.textContent = truncateMediaTitleName(fileName);

      const typeSpan = document.createElement('span');
      typeSpan.className = 'media-title-type';
      const typeLabel = item?.kind === 'text'
        ? 'TEXT'
        : formatMediaTypeLabel(item?.mime_type, item?.file_name);
      typeSpan.textContent = `[${typeLabel}]`;

      const indexSpan = document.createElement('span');
      indexSpan.className = 'media-title-index';
      indexSpan.textContent = `(${index + 1}/${total})`;

      mediaViewerTitle.replaceChildren(nameSpan, typeSpan, indexSpan);
    }

    function buildUnsupportedMessage(kind, item) {
      const ext = getFileExtension(item?.file_name);
      if (kind === 'video') {
        return `当前浏览器无法纯前端解码这个${ext ? ` ${ext.toUpperCase()}` : ''}视频，继续播放只会出现有声音没画面。`;
      }
      if (kind === 'audio') {
        return `当前浏览器无法纯前端解码这个${ext ? ` ${ext.toUpperCase()}` : ''}音频。`;
      }
      return `当前浏览器无法纯前端预览这个${ext ? ` ${ext.toUpperCase()}` : ''}图片格式。`;
    }

    function createMediaPlaceholder(item, message, compact = false) {
      const box = document.createElement('div');
      box.className = `media-placeholder${compact ? ' compact thumb' : ''}`;

      const title = document.createElement('strong');
      title.textContent = item?.file_name || (compact ? '媒体预览不可用' : '媒体无法预览');
      box.appendChild(title);

      const desc = document.createElement('small');
      desc.textContent = message;
      box.appendChild(desc);

      if (item?.download_url) {

        link.href = item.download_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '下载原文件';
        box.appendChild(link);
      }

      return box;
    }

    function showUnsupportedMedia(item, kind) {
      mediaStage.innerHTML = '';
      mediaStage.classList.add('placeholder-surface');
      mediaStage.appendChild(createMediaPlaceholder(item, buildUnsupportedMessage(kind, item), false));

    function replaceThumbWithPlaceholder(node, item, kind) {
      const placeholder = createMediaPlaceholder(item, buildUnsupportedMessage(kind, item), true);
      placeholder.title = '点击查看详情';
      placeholder.onclick = () => openMediaByMessageId(item.id).catch(() => {});

    function formatAudioMime(mimeType, fileName) {
      const ext = getFileExtension(fileName);
      if (ext) return ext.toUpperCase();
      if (!mimeType) return 'AUDIO';
      const slash = mimeType.split('/')[1] || mimeType;
      return slash.toUpperCase();
    }

    function getAudioVisual(item) {
      const key = getMediaCacheKey(item);
      return key ? audioVisualCache.get(key) || null : null;
    }

    function setAudioVisual(item, value) {
      const key = getMediaCacheKey(item);
