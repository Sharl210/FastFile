    function createAudioCard(item, { compact = false, withCanvas = false } = {}) {
      const card = document.createElement('div');
      card.className = compact ? 'audio-card thumb' : 'audio-card';
      card.style.setProperty('--audio-wave-bg', 'linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 100%)');

      if (withCanvas) {
        const canvas = document.createElement('canvas');
        canvas.className = 'audio-card-canvas';
        card.appendChild(canvas);
      }

      const badge = document.createElement('div');
      badge.className = 'audio-card-badge';
      badge.textContent = compact ? '音频' : '音频播放';
      card.appendChild(badge);

      const title = document.createElement('div');
      title.className = 'audio-card-name';
      title.textContent = item?.file_name || '音频文件';
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'audio-card-meta';
      const size = document.createElement('span');
      size.textContent = formatBytes(item?.file_size || 0);
      const fmt = document.createElement('span');
      fmt.textContent = formatAudioMime(item?.mime_type, item?.file_name);
      meta.appendChild(size);
      meta.appendChild(fmt);
      card.appendChild(meta);

      const visual = getAudioVisual(item);
      if (visual?.background) {
        card.style.setProperty('--audio-wave-bg', `url(${visual.background})`);
      }
      return card;
    }

    function renderWaveformBackground(channelData, width = 1200, height = 360) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#13273f';
      ctx.fillRect(0, 0, width, height);

      const gradient = ctx.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, '#ffb35c');
      gradient.addColorStop(0.24, '#ffe45e');
      gradient.addColorStop(0.5, '#8dff65');
      gradient.addColorStop(0.74, '#5dd6ff');
      gradient.addColorStop(1, '#9f8dff');

      const bars = 8;
      const spanWidth = width * 0.58;
      const step = Math.max(1, Math.floor(channelData.length / bars));
      const barWidth = spanWidth / bars;
      const floorY = height * 0.94;
      const maxBarHeight = height * 0.9;
      ctx.fillStyle = gradient;

      for (let i = 0; i < bars; i += 1) {
        const start = i * step;
        const end = Math.min(channelData.length, start + step);
        let peak = 0;
        for (let j = start; j < end; j += 1) {
          const value = Math.abs(channelData[j] || 0);
          if (value > peak) peak = value;
        }
        const minHeight = Math.max(18, maxBarHeight * 0.1);
        const barHeight = Math.max(minHeight, peak * maxBarHeight);
        const x = i * barWidth + barWidth * 0.14;
        const w = Math.max(20, barWidth * 0.58);
        const y = floorY - barHeight;
        const r = Math.min(8, w / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, floorY, r);
        ctx.arcTo(x + w, floorY, x, floorY, r);
        ctx.arcTo(x, floorY, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fill();
      }

      const lineGradient = ctx.createLinearGradient(0, floorY, width, floorY);
      lineGradient.addColorStop(0, 'rgba(106, 213, 255, 0.65)');
      lineGradient.addColorStop(1, 'rgba(196, 217, 255, 0.28)');
      ctx.fillStyle = lineGradient;
      ctx.fillRect(0, floorY + 8, width, 3);

      return canvas.toDataURL('image/png');
    }

    async function ensureAudioVisual(item) {
      const key = getMediaCacheKey(item);
      if (!key || audioVisualCache.has(key)) return audioVisualCache.get(key);
      if (audioVisualPending.has(key)) return audioVisualPending.get(key);

      const pending = (async () => {
        const payload = { background: null, duration: null };
        setAudioVisual(item, payload);
        audioVisualPending.delete(key);
        return payload;
      })();

      audioVisualPending.set(key, pending);
      return pending;
    }

    function enhanceAudioCard(card, item) {
      ensureAudioVisual(item).then((visual) => {
        if (!visual?.background || !card.isConnected) return;
        card.style.setProperty('--audio-wave-bg', `url(${visual.background})`);
      }).catch(() => {});
    }

    function attachAudioCompatibility(audio, item, onUnsupported) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'audio' && cached.supported === false) {
        onUnsupported();
        return;
      }

      let resolved = false;
      const markSupported = () => {
        if (resolved) return true;
        resolved = true;
        setMediaCompatibility(item, { kind: 'audio', supported: true });
        return true;
      };
      const markUnsupported = () => {
        if (resolved) return;
        resolved = true;
        setMediaCompatibility(item, { kind: 'audio', supported: false });
        onUnsupported();
      };

      audio.addEventListener('loadedmetadata', () => {
        markSupported();
      }, { once: true });
      audio.addEventListener('canplay', () => {
        markSupported();
      }, { once: true });
      audio.addEventListener('error', () => {
        markUnsupported();
      }, { once: true });
    }

    function playMediaElement(media, { unmuteAfterStart = false } = {}) {
      const tryPlay = () => {
        const playing = media.play();
        if (playing && typeof playing.then === 'function') {
          playing.then(() => {
            if (unmuteAfterStart) media.muted = false;
          }).catch(() => {});
        } else if (unmuteAfterStart) {
          media.muted = false;
        }
      };
      requestAnimationFrame(tryPlay);
      media.addEventListener('loadeddata', tryPlay, { once: true });
      media.addEventListener('canplay', tryPlay, { once: true });
    }

    function cleanupActiveAudioShell() {
      if (typeof activeAudioShellCleanup === 'function') {
        activeAudioShellCleanup();
      }
      activeAudioShellCleanup = null;
    }

    function formatMediaClock(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '0:00';
      const total = Math.floor(sec);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function createAudioShell(item, audio) {
      const shell = document.createElement('div');
      shell.className = 'audio-view';

      audio.style.display = 'none';
      audio.setAttribute('aria-hidden', 'true');
      shell.appendChild(audio);

      const canvas = document.createElement('canvas');
      canvas.className = 'audio-shell-canvas';
      shell.appendChild(canvas);

      const info = document.createElement('div');
      info.className = 'audio-shell-info';
      const name = document.createElement('div');
      name.className = 'audio-shell-name';
      name.textContent = item.file_name || '音频文件';
      const meta = document.createElement('div');
      meta.className = 'audio-shell-meta';
      meta.innerHTML = `<span>${formatAudioMime(item.mime_type, item.file_name)}</span>`;
      info.appendChild(name);
      info.appendChild(meta);
      shell.appendChild(info);

      const footer = document.createElement('div');
      footer.className = 'audio-shell-footer';

      const current = document.createElement('div');
      current.className = 'audio-shell-time';
      current.textContent = '0:00 / 0:00';
      const progress = document.createElement('div');
      progress.className = 'audio-shell-progress';
      const progressFill = document.createElement('div');
      progressFill.className = 'audio-shell-progress-fill';
      const progressKnob = document.createElement('div');
      progressKnob.className = 'audio-shell-progress-knob';
      progress.appendChild(progressFill);
      progress.appendChild(progressKnob);

      const controls = document.createElement('div');
      controls.className = 'audio-shell-controls';
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'audio-shell-btn';
      toggleBtn.type = 'button';
      toggleBtn.textContent = '❚❚';
      const volumeWrap = document.createElement('div');
      volumeWrap.className = 'audio-shell-volume-wrap';
      const volumeBtn = document.createElement('button');
      volumeBtn.className = 'audio-shell-btn';
      volumeBtn.type = 'button';
      volumeBtn.textContent = '🔊';
      volumeBtn.setAttribute('aria-label', '音量');
      const volumePopover = document.createElement('div');
      volumePopover.className = 'audio-shell-volume-popover';
      const volume = document.createElement('input');
      volume.className = 'audio-shell-volume';
      volume.type = 'range';
      volume.min = '0';
      volume.max = '100';
      volume.step = '1';
      volume.value = String(Math.round((audio.volume || 1) * 100));
      volumePopover.appendChild(volume);
      volumeWrap.appendChild(volumeBtn);
      volumeWrap.appendChild(volumePopover);

      controls.appendChild(toggleBtn);
      controls.appendChild(current);
      controls.appendChild(progress);
      controls.appendChild(volumeWrap);
      footer.appendChild(controls);
      shell.appendChild(footer);

      const sync = () => {
        const total = Number.isFinite(audio.duration) ? audio.duration : 0;
        const now = audio.currentTime || 0;
        current.textContent = `${formatMediaClock(now)} / ${formatMediaClock(total)}`;
        const ratio = total > 0 ? now / total : 0;
        progressFill.style.width = `${ratio * 100}%`;
        progressKnob.style.left = `${ratio * 100}%`;
        toggleBtn.textContent = audio.paused ? '▶' : '❚❚';
        volumeBtn.textContent = audio.muted || audio.volume === 0 ? '🔈' : '🔊';
      };

      const seek = (clientX) => {
        const rect = progress.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = ratio * audio.duration;
          sync();
        }
      };

      progress.addEventListener('click', (e) => seek(e.clientX));
      toggleBtn.onclick = () => {
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      };
      volume.addEventListener('input', () => {
        audio.muted = false;
        audio.volume = Number(volume.value) / 100;
        sync();
      });
      volumeBtn.onclick = () => {
        volumeWrap.classList.toggle('open');
      };
      const closeVolumePopover = (event) => {
        if (volumeWrap.contains(event.target)) return;
        volumeWrap.classList.remove('open');
      };
      document.addEventListener('pointerdown', closeVolumePopover, true);

      ['play', 'pause', 'timeupdate', 'loadedmetadata', 'volumechange', 'ended'].forEach((eventName) => {
        audio.addEventListener(eventName, sync);
      });
      sync();

      activeAudioShellCleanup = () => {
        document.removeEventListener('pointerdown', closeVolumePopover, true);
      };

      return { shell, canvas, meta, sync };
    }

    function cleanupActiveAudioVisualizer() {
      if (typeof activeAudioVisualizerCleanup === 'function') {
        activeAudioVisualizerCleanup();
      }
      activeAudioVisualizerCleanup = null;
    }

    function cleanupActiveImageViewer() {
      if (!activeImageViewerState) return;
      if (activeImageViewerState.resizeObserver) {
        activeImageViewerState.resizeObserver.disconnect();
      }
      if (activeImageViewerState.viewerChrome) {
        activeImageViewerState.viewerChrome.cleanup();
      }
      if (typeof activeImageViewerState.cleanup === 'function') {
        activeImageViewerState.cleanup();
      }
      activeImageViewerState = null;
    }

    function resetMediaDialogLayout() {
      cleanupActiveImageViewer();
      cleanupActiveTextViewer();
      cleanupActiveEditor();
      mediaDialog.style.width = '';
      mediaStage.style.width = '';
      mediaStage.style.height = '';
      mediaStage.classList.remove('placeholder-surface');
      mediaDialog.classList.remove('image-mode');
      mediaDialog.classList.remove('text-mode');
      mediaDialog.classList.remove('editor-mode');
      mediaDialog.classList.remove('video-mode');
      mediaDialog.classList.remove('audio-mode');
      mediaPrevBtn.classList.remove('hidden');
      mediaNextBtn.classList.remove('hidden');
      mediaCopyBtn.classList.add('hidden');
      mediaCloseBtn.textContent = '关闭';
      mediaCopyBtn.textContent = '复制';
      renderMediaViewerHint(null);
    }

    function fitMediaDialogToAspect(width, height) {
      if (!width || !height) return;
      const isMobile = window.innerWidth <= 768;
      const viewportWidth = Math.min(window.innerWidth * (isMobile ? 0.96 : MEDIA_VIEWPORT_MAX_RATIO), 980);
      const viewportHeight = Math.max(isMobile ? 220 : 280, Math.min(window.innerHeight * MEDIA_VIEWPORT_MAX_RATIO - (isMobile ? 130 : 110), window.innerHeight * MEDIA_VIEWPORT_MAX_RATIO));
      const scale = Math.min(viewportWidth / width, viewportHeight / height);
      const fittedWidth = Math.max(isMobile ? 220 : 320, Math.round(width * scale));
      const fittedHeight = Math.max(isMobile ? 180 : 240, Math.round(height * scale));
      const dialogPadding = isMobile ? 16 : 28;
      const minDialogWidth = isMobile ? 260 : 420;
      mediaStage.style.width = `${fittedWidth}px`;
      mediaStage.style.height = `${fittedHeight}px`;
      mediaDialog.style.width = `${Math.max(minDialogWidth, Math.min(viewportWidth, fittedWidth + dialogPadding))}px`;
    }

    function fitMediaDialogForAudio() {
      const isMobile = window.innerWidth <= 768;
      const dialogPadding = isMobile ? 16 : 28;
      const maxDialogWidth = Math.min(window.innerWidth * (isMobile ? 0.96 : MEDIA_VIEWPORT_MAX_RATIO), 980);
      const maxStageWidth = Math.max(isMobile ? 240 : 420, Math.round(maxDialogWidth - dialogPadding));
      const maxStageHeight = Math.max(isMobile ? 260 : 420, Math.min(window.innerHeight * (isMobile ? 0.54 : 0.68), window.innerHeight * MEDIA_VIEWPORT_MAX_RATIO - (isMobile ? 170 : 126)));
      const ergonomicAspect = isMobile
        ? Math.min(1.08, Math.max(0.88, (window.innerWidth / Math.max(window.innerHeight, 1)) * 1.85))
        : Math.min(1.85, Math.max(1.45, (window.innerWidth / Math.max(window.innerHeight, 1)) * 1.02));
      let stageWidth = Math.min(maxStageWidth, Math.round(maxStageHeight * ergonomicAspect));
      let stageHeight = Math.round(stageWidth / ergonomicAspect);
      if (stageHeight > maxStageHeight) {
        stageHeight = Math.round(maxStageHeight);
        stageWidth = Math.round(stageHeight * ergonomicAspect);
      }
      stageWidth = Math.max(isMobile ? 240 : 420, Math.round(stageWidth));
      stageHeight = Math.max(isMobile ? 260 : 420, Math.round(stageHeight));
      mediaStage.style.width = `${stageWidth}px`;
      mediaStage.style.height = `${stageHeight}px`;
      mediaDialog.style.width = `${Math.max(isMobile ? 260 : 420, Math.min(maxDialogWidth, stageWidth + dialogPadding))}px`;
    }

    function fitMediaDialogForText() {
      const isMobile = window.innerWidth <= 768;
      const viewportWidth = Math.min(window.innerWidth * (isMobile ? 0.96 : 0.9), 980);
      const viewportHeight = Math.max(320, Math.min(window.innerHeight * 0.78, 760));
      mediaStage.style.width = `${Math.round(viewportWidth - (isMobile ? 20 : 32))}px`;
      mediaStage.style.height = `${Math.round(viewportHeight - (isMobile ? 96 : 112))}px`;
      mediaDialog.style.width = `${Math.round(viewportWidth)}px`;
    }

    function cleanupActiveTextViewer() {
      if (!activeTextViewerState) return;
      const { stage, scrollHandler, progressHandler, resizeObserver, zoomCleanup, blockResizeObserver, renderRaf, viewerChrome, scrollSettleTimer } = activeTextViewerState;
      if (stage && scrollHandler) {
        stage.removeEventListener('scroll', scrollHandler);
      }
      if (stage && progressHandler) {
        stage.removeEventListener('scroll', progressHandler);
      }
      if (resizeObserver) {
        resizeObserver.disconnect();
      }
      if (blockResizeObserver) {
        blockResizeObserver.disconnect();
      }
      if (renderRaf) {
        cancelAnimationFrame(renderRaf);
      }
      if (scrollSettleTimer) {
        clearTimeout(scrollSettleTimer);
      }
      if (viewerChrome) {
        viewerChrome.cleanup();
      }
      if (typeof zoomCleanup === 'function') {
        zoomCleanup();
      }
      activeTextViewerState = null;
    }

    function cleanupActiveEditor() {
      if (!activeEditorState) return;
      if (activeEditorState.resizeObserver) {
        activeEditorState.resizeObserver.disconnect();
      }
      activeEditorState = null;
    }

    function splitTextViewerBlocks(text, wrapEnabled) {
      const lines = String(text || '').split('\n');
      if (!lines.length) lines.push('');
      const blockLineCount = wrapEnabled ? TEXT_VIEWER_WRAP_BLOCK_LINES : TEXT_VIEWER_NOWRAP_BLOCK_LINES;
      const blocks = [];
      for (let i = 0; i < lines.length; i += blockLineCount) {
        const blockLines = lines.slice(i, i + blockLineCount);
        blocks.push({
          startLine: i + 1,
          endLine: i + blockLines.length,
          lineCount: blockLines.length,
          text: blockLines.join('\n'),
        });
      }
      return blocks;
    }

    function estimateTextViewerBlockHeight(block, wrapEnabled, stageWidth) {
      const fontSize = 14 * textViewerZoom;
      const lineHeight = fontSize * 1.65;
      if (!wrapEnabled) {
        return Math.round(Math.max(1, block?.lineCount || 1) * lineHeight);
      }

      const usableWidth = Math.max(220, stageWidth - 40);
      const charsPerLine = Math.max(12, Math.floor(usableWidth / Math.max(7, fontSize * 0.58)));
      const logicalLines = String(block?.text || '').split('\n').reduce((sum, line) => {
        return sum + Math.max(1, Math.ceil(Math.max(line.length, 1) / charsPerLine));
      }, 0);
      return Math.round(logicalLines * lineHeight);
    }

    function queueTextViewerViewportRefresh(state, preserveLine = null) {
      if (!state) return;
      if (preserveLine != null && state.pendingLine == null) {
        state.pendingLine = preserveLine;
      }
      if (state.renderRaf) return;
      state.renderRaf = requestAnimationFrame(() => {
        state.renderRaf = 0;
        const nextLine = state.pendingLine;
        state.pendingLine = null;
        renderTextViewerViewport(state);
        if (nextLine != null) {
          scrollTextViewerToLine(state, nextLine);
        }
      });
    }

    function scheduleTextViewerScrollSettle(state) {
      if (!state) return;
      if (state.scrollSettleTimer) clearTimeout(state.scrollSettleTimer);
      state.scrollSettleTimer = window.setTimeout(() => {
        state.scrollSettleTimer = 0;
        if (state.pendingMeasureRefresh) {
          state.pendingMeasureRefresh = false;
          queueTextViewerViewportRefresh(state, getTextViewerCurrentLine(state));
        }
      }, SCROLL_SETTLE_MS);
    }

    function getTextViewerBlockNode(state, index) {
      const cached = state.blockCache.get(index);
      if (cached) {
        cached.hiddenAt = null;
        cached.lastSeenAt = Date.now();
        cached.node.dataset.blockIndex = String(index);
        return cached.node;
      }

      const block = document.createElement('div');
      block.className = 'text-viewer-block';
      block.dataset.blockIndex = String(index);
      block.textContent = state.blocks[index].text;
      state.blockCache.set(index, {
        node: block,
        hiddenAt: null,
        lastSeenAt: Date.now(),
      });
      return block;
    }

    function markTextViewerBlockCacheVisibility(state, visibleIndexes = new Set()) {
      if (!state) return;
      const now = Date.now();
      for (const [index, entry] of state.blockCache.entries()) {
        if (visibleIndexes.has(index)) {
          entry.hiddenAt = null;
          entry.lastSeenAt = now;
          continue;
        }
        if (entry.hiddenAt == null) {
          entry.hiddenAt = now;
        }
      }
    }

    function sweepTextViewerBlockCache() {
      const state = activeTextViewerState;
      if (!state?.blockCache) return;
      const now = Date.now();
      for (const [index, entry] of state.blockCache.entries()) {
        if (entry.hiddenAt == null) continue;
        if (now - entry.hiddenAt >= VIRTUAL_RETENTION_TTL) {
          state.blockCache.delete(index);
        }
      }
    }

    function renderTextViewerViewport(state) {
      const { stage, heights, topSpacer, host, bottomSpacer, blockResizeObserver } = state;
      const visibleTop = findIndexAtOffset(heights, stage.scrollTop);
      const endBoundary = stage.scrollTop + stage.clientHeight;

      let visibleEnd = visibleTop.index;
      let renderedBottom = visibleTop.offset;
      while (visibleEnd < heights.length && renderedBottom < endBoundary) {
        renderedBottom += heights[visibleEnd];
        visibleEnd += 1;
      }
      if (visibleEnd === visibleTop.index && visibleEnd < heights.length) {
        renderedBottom += heights[visibleEnd];
        visibleEnd += 1;
      }

      const start = Math.max(0, visibleTop.index - TEXT_VIEWER_PRELOAD_BEFORE);
      const end = Math.min(heights.length, visibleEnd + TEXT_VIEWER_PRELOAD_AFTER);
      const topHeight = getHeightOffset(heights, start);
      const endHeight = getHeightOffset(heights, end);

      if (state.start === start && state.end === end) {
        state.viewerChrome?.syncIndicators(false);
        return;
      }

      const preservedLine = state.start !== state.end ? getTextViewerCurrentLine(state) : null;

      topSpacer.style.height = `${18 + topHeight}px`;

      if (blockResizeObserver) {
        blockResizeObserver.disconnect();
      }

      const fragment = document.createDocumentFragment();
      const visibleIndexes = new Set();
      for (let i = start; i < end; i += 1) {
        visibleIndexes.add(i);
        const block = getTextViewerBlockNode(state, i);
        fragment.appendChild(block);
      }
      host.replaceChildren(fragment);

      let measuredChanged = false;
      Array.from(host.children).forEach((node, offset) => {
        const index = start + offset;
        const measuredHeight = Math.ceil(node.getBoundingClientRect().height);
        if (measuredHeight > 0 && Math.abs(measuredHeight - heights[index]) > 1) {
          heights[index] = measuredHeight;
          measuredChanged = true;
        }
        if (blockResizeObserver) {
          blockResizeObserver.observe(node);
        }
      });

      const totalHeight = heights.reduce((sum, height) => sum + height, 0);
      bottomSpacer.style.height = `${18 + Math.max(0, totalHeight - endHeight)}px`;
      state.start = start;
      state.end = end;
      markTextViewerBlockCacheVisibility(state, visibleIndexes);
      state.viewerChrome?.syncIndicators(false);

      if (measuredChanged) {
        if (state.scrollSettleTimer) {
          state.pendingMeasureRefresh = true;
        } else {
          queueTextViewerViewportRefresh(state, preservedLine);
        }
      }
    }

    function getTextViewerCurrentLine(state) {
      if (!state?.blocks?.length) return 1;
      const scrollTop = Math.max(0, state.stage.scrollTop);
      let topHeight = 0;
      for (let i = 0; i < state.blocks.length; i += 1) {
        const block = state.blocks[i];
        const blockHeight = state.heights[i] || 0;
        const blockBottom = topHeight + blockHeight;
        if (scrollTop <= blockBottom || i === state.blocks.length - 1) {
          const offset = Math.max(0, scrollTop - topHeight);
          const ratio = blockHeight > 0 ? Math.min(0.999, offset / blockHeight) : 0;
          const lineOffset = Math.floor(ratio * Math.max(1, block.lineCount));
          return Math.min(block.endLine, block.startLine + lineOffset);
        }
        topHeight = blockBottom;
      }
      return state.totalLines || 1;
    }

    function scrollTextViewerToLine(state, lineNumber) {
      if (!state?.blocks?.length) return;
      const targetLine = Math.max(1, Math.min(state.totalLines || 1, Number(lineNumber || 1)));
      let topHeight = 0;
      for (let i = 0; i < state.blocks.length; i += 1) {
        const block = state.blocks[i];
        const blockHeight = state.heights[i] || 0;
        if (targetLine >= block.startLine && targetLine <= block.endLine) {
          const ratio = block.lineCount > 0 ? (targetLine - block.startLine) / block.lineCount : 0;
          state.stage.scrollTop = Math.max(0, topHeight + blockHeight * ratio);
          renderTextViewerViewport(state);
          return;
        }
        topHeight += blockHeight;
      }
    }

    function scheduleTextViewerProgressSaveForState(messageId, state) {
      if (!messageId || !state) return;
      if (textProgressSaveTimer) clearTimeout(textProgressSaveTimer);
      textProgressSaveTimer = setTimeout(() => {
        const lineNumber = activeTextViewerState === state ? getTextViewerCurrentLine(state) : 1;
        saveTextProgress(messageId, lineNumber).catch(() => {});
      }, 240);
    }

    async function persistActiveTextViewerProgress() {
      const item = mediaList[mediaIndex];
      if (!item || item.kind !== 'text' || !activeTextViewerState) return;
      const currentLine = getTextViewerCurrentLine(activeTextViewerState);
      if (textProgressSaveTimer) {
        clearTimeout(textProgressSaveTimer);
        textProgressSaveTimer = 0;
      }
      await saveTextProgress(item.id, currentLine);
    }

    function applyTextViewerStageState(state) {
      if (!state?.stage) return;
      state.stage.classList.toggle('wrap-disabled', !textWrapEnabled);
      state.stage.style.setProperty('--text-viewer-font-size', `${14 * textViewerZoom}px`);
      state.viewerChrome?.setHorizontalHidden(textWrapEnabled);
    }

    function recomputeTextViewerHeights(state) {
      if (!state) return;
      const stageWidth = state.stage.clientWidth || parseInt(mediaStage.style.width || '0', 10) || 640;
      state.heights = state.blocks.map((block) => estimateTextViewerBlockHeight(block, textWrapEnabled, stageWidth));
    }

    function mountTextViewerState(stage, item, preservedScrollTop = 0, preservedLine = 1, viewerChrome = null) {
      const blocks = splitTextViewerBlocks(item.text || '', textWrapEnabled);
      const stageWidth = stage.clientWidth || parseInt(mediaStage.style.width || '0', 10) || 640;
      const heights = blocks.map((block) => estimateTextViewerBlockHeight(block, textWrapEnabled, stageWidth));

      stage.innerHTML = '';

      const topSpacer = document.createElement('div');
      const host = document.createElement('div');
      const bottomSpacer = document.createElement('div');
      stage.appendChild(topSpacer);
      stage.appendChild(host);
      stage.appendChild(bottomSpacer);

      const state = {
        stage,
        item,
        blocks,
        heights,
        blockCache: new Map(),
        topSpacer,
        host,
          bottomSpacer,
          totalLines: blocks.length ? blocks[blocks.length - 1].endLine : 1,
          start: 0,
          end: 0,
          scrollHandler: null,
          progressHandler: null,
          resizeObserver: null,
          blockResizeObserver: null,
          zoomCleanup: null,
          renderRaf: 0,
          pendingLine: null,
          scrollSettleTimer: 0,
          pendingMeasureRefresh: false,
          viewerChrome,
      };
      applyTextViewerStageState(state);

      state.scrollHandler = () => {
        scheduleTextViewerScrollSettle(state);
        queueTextViewerViewportRefresh(state);
      };
      stage.addEventListener('scroll', state.scrollHandler, { passive: true });
      state.progressHandler = () => scheduleTextViewerProgressSaveForState(item.id, state);
      stage.addEventListener('scroll', state.progressHandler, { passive: true });
      state.resizeObserver = new ResizeObserver(() => queueTextViewerViewportRefresh(state, getTextViewerCurrentLine(state)));
      state.resizeObserver.observe(stage);
      state.blockResizeObserver = new ResizeObserver((entries) => {
        let changed = false;
        for (const entry of entries) {
          const blockIndex = Number(entry.target.dataset.blockIndex);
          if (!Number.isFinite(blockIndex)) continue;
          const measuredHeight = Math.ceil(entry.target.getBoundingClientRect().height);
          if (measuredHeight > 0 && Math.abs(measuredHeight - state.heights[blockIndex]) > 1) {
            state.heights[blockIndex] = measuredHeight;
            changed = true;
          }
        }
        if (changed) {
          if (state.scrollSettleTimer) {
            state.pendingMeasureRefresh = true;
          } else {
            queueTextViewerViewportRefresh(state, getTextViewerCurrentLine(state));
          }
        }
      });
      state.zoomCleanup = attachTextViewerZoom(stage);
      activeTextViewerState = state;
      stage.scrollTop = Math.max(0, preservedScrollTop);
      renderTextViewerViewport(state);
      state.viewerChrome?.syncIndicators(false);
      if (preservedLine > 1) {
        requestAnimationFrame(() => {
          if (activeTextViewerState === state) {
            scrollTextViewerToLine(state, preservedLine);
          }
        });
      }
    }

    function setTextViewerZoom(nextZoom, { stage = null, anchorClientX = null, anchorClientY = null } = {}) {
      const previousZoom = textViewerZoom;
      const clampedZoom = Math.max(0.5, Math.min(4, nextZoom));
      if (!Number.isFinite(clampedZoom) || Math.abs(clampedZoom - previousZoom) < 0.001) return;
      const activeStage = stage || mediaStage.querySelector('.text-viewer-stage');
      const rect = activeStage ? activeStage.getBoundingClientRect() : null;
      const anchorX = rect ? (anchorClientX == null ? rect.width / 2 : anchorClientX - rect.left) : 0;
      const anchorY = rect ? (anchorClientY == null ? rect.height / 2 : anchorClientY - rect.top) : 0;
      const previousScrollLeft = activeStage?.scrollLeft || 0;
      const previousScrollTop = activeStage?.scrollTop || 0;
      const zoomRatio = clampedZoom / previousZoom;
      textViewerZoom = clampedZoom;
      if (textViewerZoomSaveTimer) clearTimeout(textViewerZoomSaveTimer);
      textViewerZoomSaveTimer = setTimeout(() => {
        saveUiState({ text_zoom_scale: textViewerZoom }).catch(() => {});
      }, 180);
      if (activeTextViewerState && activeTextViewerState.stage === activeStage) {
        applyTextViewerStageState(activeTextViewerState);
        recomputeTextViewerHeights(activeTextViewerState);
        queueTextViewerViewportRefresh(activeTextViewerState, getTextViewerCurrentLine(activeTextViewerState));
      } else {
        syncTextViewerWrapUi();
      }
      requestAnimationFrame(() => {
        const refreshedStage = activeTextViewerState?.stage || stage || mediaStage.querySelector('.text-viewer-stage');
        if (!refreshedStage) return;
        refreshedStage.scrollLeft = Math.max(0, (previousScrollLeft + anchorX) * zoomRatio - anchorX);
        refreshedStage.scrollTop = Math.max(0, (previousScrollTop + anchorY) * zoomRatio - anchorY);
        activeTextViewerState?.viewerChrome?.syncIndicators(true);
      });
    }

    function attachTextViewerZoom(stage) {
      let pinchDistance = 0;
      let pinchStartZoom = textViewerZoom;
      const activePointers = new Map();
      const beginPinch = () => {
        if (activePointers.size < 2) return false;
        const [a, b] = Array.from(activePointers.values());
        pinchDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (!pinchDistance) return false;
        pinchStartZoom = textViewerZoom;
        stage.classList.add('is-pinching');
        activeTextViewerState?.viewerChrome?.showIndicators();
        return true;
      };

      const endPinch = () => {
        pinchDistance = 0;
        stage.classList.remove('is-pinching');
      };

      const wheelHandler = (event) => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        const factor = Math.exp(-event.deltaY * 0.0015);
        setTextViewerZoom(textViewerZoom * factor, {
          stage,
          anchorClientX: event.clientX,
          anchorClientY: event.clientY,
        });
      };
      const pointerDownHandler = (event) => {
        if (event.pointerType !== 'touch') return;
        activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
        try {
          stage.setPointerCapture?.(event.pointerId);
        } catch (_) {}
        if (activePointers.size >= 2) {
          if (beginPinch()) {
            event.preventDefault();
            event.stopPropagation();
          }
          return;
        }
        activeTextViewerState?.viewerChrome?.showIndicators();
      };
      const pointerMoveHandler = (event) => {
        if (!activePointers.has(event.pointerId)) return;
        activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
        if (activePointers.size >= 2 && pinchDistance) {
          const [a, b] = Array.from(activePointers.values());
          const nextDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          if (!nextDistance) return;
          const centerX = (a.clientX + b.clientX) / 2;
          const centerY = (a.clientY + b.clientY) / 2;
          event.preventDefault();
          event.stopPropagation();
          setTextViewerZoom(pinchStartZoom * (nextDistance / pinchDistance), {
            stage,
            anchorClientX: centerX,
            anchorClientY: centerY,
          });
          activeTextViewerState?.viewerChrome?.showIndicators();
          return;
        }
        if (activePointers.size === 1) {
          activeTextViewerState?.viewerChrome?.showIndicators();
        }
      };
      const pointerEndHandler = (event) => {
        activePointers.delete(event.pointerId);
        try {
          stage.releasePointerCapture?.(event.pointerId);
        } catch (_) {}
        if (activePointers.size >= 2) {
          beginPinch();
          return;
        }
        endPinch();
        activeTextViewerState?.viewerChrome?.showIndicators();
      };
      const gestureBlockHandler = (event) => {
        event.preventDefault();
        event.stopPropagation();
        pinchStartZoom = textViewerZoom;
        stage.classList.add('is-pinching');
      };
      const gestureScaleHandler = (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (typeof event.scale === 'number' && Number.isFinite(event.scale) && event.scale > 0) {
          stage.classList.add('is-pinching');
          setTextViewerZoom(pinchStartZoom * event.scale, { stage });
          activeTextViewerState?.viewerChrome?.showIndicators();
        }
      };

      stage.addEventListener('wheel', wheelHandler, { passive: false });
      stage.addEventListener('pointerdown', pointerDownHandler, { passive: false });
      stage.addEventListener('pointermove', pointerMoveHandler, { passive: false });
      stage.addEventListener('pointerup', pointerEndHandler, { passive: false });
      stage.addEventListener('pointercancel', pointerEndHandler, { passive: false });
      stage.addEventListener('gesturestart', gestureBlockHandler, { passive: false });
      stage.addEventListener('gesturechange', gestureScaleHandler, { passive: false });
      stage.addEventListener('gestureend', endPinch, { passive: false });

      return () => {
        stage.removeEventListener('wheel', wheelHandler);
        stage.removeEventListener('pointerdown', pointerDownHandler);
        stage.removeEventListener('pointermove', pointerMoveHandler);
        stage.removeEventListener('pointerup', pointerEndHandler);
        stage.removeEventListener('pointercancel', pointerEndHandler);
        stage.removeEventListener('gesturestart', gestureBlockHandler);
        stage.removeEventListener('gesturechange', gestureScaleHandler);
        stage.removeEventListener('gestureend', endPinch);
        endPinch();
      };
    }

    function updateImageViewerLayout(state, nextScale, anchorClientX = null, anchorClientY = null) {
      const clampedScale = Math.max(1, Math.min(6, nextScale));
      const stageRect = state.stage.getBoundingClientRect();
      const anchorX = anchorClientX == null ? stageRect.width / 2 : anchorClientX - stageRect.left;
      const anchorY = anchorClientY == null ? stageRect.height / 2 : anchorClientY - stageRect.top;
      const previousWidth = state.canvas.scrollWidth || state.stage.clientWidth;
      const previousHeight = state.canvas.scrollHeight || state.stage.clientHeight;
      const previousScrollLeft = state.stage.scrollLeft;
      const previousScrollTop = state.stage.scrollTop;

      state.scale = clampedScale;
      const imageWidth = Math.max(1, Math.round(state.baseWidth * clampedScale));
      const imageHeight = Math.max(1, Math.round(state.baseHeight * clampedScale));
      state.img.style.width = `${imageWidth}px`;
      state.img.style.height = `${imageHeight}px`;
      state.canvas.style.width = `${Math.max(state.stage.clientWidth, imageWidth)}px`;
      state.canvas.style.height = `${Math.max(state.stage.clientHeight, imageHeight)}px`;

      requestAnimationFrame(() => {
        const nextWidth = state.canvas.scrollWidth || state.stage.clientWidth;
        const nextHeight = state.canvas.scrollHeight || state.stage.clientHeight;
        const ratioX = previousWidth > 0 ? nextWidth / previousWidth : 1;
        const ratioY = previousHeight > 0 ? nextHeight / previousHeight : 1;
        state.stage.scrollLeft = Math.max(0, (previousScrollLeft + anchorX) * ratioX - anchorX);
        state.stage.scrollTop = Math.max(0, (previousScrollTop + anchorY) * ratioY - anchorY);
        state.viewerChrome?.syncIndicators(true);
      });
    }

    function attachImageViewerZoom(state) {
      let pinchDistance = 0;
      let pinchStartScale = state.scale;
      let dragPointerId = null;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragStartLeft = 0;
      let dragStartTop = 0;
      const activePointers = new Map();
      const momentum = createMomentumScroller(() => state.stage, () => state.viewerChrome?.syncIndicators(true));

      const beginPinch = () => {
        if (activePointers.size < 2) return false;
        const [a, b] = Array.from(activePointers.values());
        pinchDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (!pinchDistance) return false;
        pinchStartScale = state.scale;
        dragPointerId = null;
        momentum.stop();
        state.stage.classList.add('is-pinching');
        state.viewerChrome?.showIndicators();
        return true;
      };

      const endPinch = () => {
        pinchDistance = 0;
        state.stage.classList.remove('is-pinching');
      };

      const wheelHandler = (event) => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        const factor = Math.exp(-event.deltaY * 0.0015);
        updateImageViewerLayout(state, state.scale * factor, event.clientX, event.clientY);
      };

      const pointerDownHandler = (event) => {
        if (event.pointerType !== 'touch') return;
        activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
        try {
          state.stage.setPointerCapture?.(event.pointerId);
        } catch (_) {}
        if (activePointers.size >= 2) {
          if (beginPinch()) {
            event.preventDefault();
          }
          return;
        }
        dragPointerId = event.pointerId;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        dragStartLeft = state.stage.scrollLeft;
        dragStartTop = state.stage.scrollTop;
        momentum.begin(event.clientX, event.clientY);
      };

      const pointerMoveHandler = (event) => {
        if (!activePointers.has(event.pointerId)) return;
        activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
        if (activePointers.size >= 2 && pinchDistance) {
          const [a, b] = Array.from(activePointers.values());
          const nextDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          if (!nextDistance) return;
          const centerX = (a.clientX + b.clientX) / 2;
          const centerY = (a.clientY + b.clientY) / 2;
          event.preventDefault();
          updateImageViewerLayout(state, pinchStartScale * (nextDistance / pinchDistance), centerX, centerY);
          state.viewerChrome?.showIndicators();
          return;
        }
        if (dragPointerId !== event.pointerId || activePointers.size !== 1) return;
        event.preventDefault();
        state.stage.classList.add('is-dragging');
        state.stage.scrollLeft = Math.max(0, dragStartLeft + (dragStartX - event.clientX));
        state.stage.scrollTop = Math.max(0, dragStartTop + (dragStartY - event.clientY));
        momentum.track(event.clientX, event.clientY);
        state.viewerChrome?.showIndicators();
      };

      const pointerEndHandler = (event) => {
        activePointers.delete(event.pointerId);
        try {
          state.stage.releasePointerCapture?.(event.pointerId);
        } catch (_) {}
        state.stage.classList.remove('is-dragging');
        if (activePointers.size >= 2) {
          beginPinch();
          return;
        }
        endPinch();
        if (activePointers.size === 1) {
          const [remainingId, remainingPointer] = Array.from(activePointers.entries())[0];
          dragPointerId = remainingId;
          dragStartX = remainingPointer.clientX;
          dragStartY = remainingPointer.clientY;
          dragStartLeft = state.stage.scrollLeft;
          dragStartTop = state.stage.scrollTop;
          momentum.begin(remainingPointer.clientX, remainingPointer.clientY);
        } else {
          dragPointerId = null;
          momentum.release();
        }
      };

      const gestureStartHandler = (event) => {
        event.preventDefault();
        pinchStartScale = state.scale;
      };

      const gestureChangeHandler = (event) => {
        event.preventDefault();
        if (typeof event.scale === 'number' && Number.isFinite(event.scale) && event.scale > 0) {
          updateImageViewerLayout(state, pinchStartScale * event.scale);
          state.viewerChrome?.showIndicators();
        }
      };

      state.stage.addEventListener('wheel', wheelHandler, { passive: false });
      state.stage.addEventListener('pointerdown', pointerDownHandler, { passive: false });
      state.stage.addEventListener('pointermove', pointerMoveHandler, { passive: false });
      state.stage.addEventListener('pointerup', pointerEndHandler, { passive: false });
      state.stage.addEventListener('pointercancel', pointerEndHandler, { passive: false });
      state.stage.addEventListener('gesturestart', gestureStartHandler, { passive: false });
      state.stage.addEventListener('gesturechange', gestureChangeHandler, { passive: false });
      state.stage.addEventListener('gestureend', pointerEndHandler, { passive: false });

      return () => {
        state.stage.removeEventListener('wheel', wheelHandler);
        state.stage.removeEventListener('pointerdown', pointerDownHandler);
        state.stage.removeEventListener('pointermove', pointerMoveHandler);
        state.stage.removeEventListener('pointerup', pointerEndHandler);
        state.stage.removeEventListener('pointercancel', pointerEndHandler);
        state.stage.removeEventListener('gesturestart', gestureStartHandler);
        state.stage.removeEventListener('gesturechange', gestureChangeHandler);
        state.stage.removeEventListener('gestureend', pointerEndHandler);
        momentum.stop();
        state.stage.classList.remove('is-dragging');
        endPinch();
      };
    }

    function mountImageViewerState(stage, canvas, img, naturalWidth, naturalHeight, viewerChrome = null) {
      const fitScale = Math.min(stage.clientWidth / naturalWidth, stage.clientHeight / naturalHeight);
      const state = {
        stage,
        canvas,
        img,
        baseWidth: Math.max(1, Math.round(naturalWidth * fitScale)),
        baseHeight: Math.max(1, Math.round(naturalHeight * fitScale)),
        scale: 1,
        resizeObserver: null,
        cleanup: null,
        viewerChrome,
      };
      updateImageViewerLayout(state, 1);
      state.resizeObserver = new ResizeObserver(() => updateImageViewerLayout(state, state.scale));
      state.resizeObserver.observe(stage);
      state.cleanup = attachImageViewerZoom(state);
      activeImageViewerState = state;
      state.viewerChrome?.syncIndicators(false);
    }

    function attachAudioVisualizer(audio, canvas, meta) {
      cleanupActiveAudioVisualizer();
      if (!canvas || !window.AudioContext) return;

      const ctx = canvas.getContext('2d');
      const audioContext = new window.AudioContext();
      const source = audioContext.createMediaElementSource(audio);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 128;
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      const samples = new Uint8Array(analyser.frequencyBinCount);
      let smoothedBars = new Float32Array(0);
      let rafId = 0;
      let stopped = false;

      const resizeCanvas = () => {
        const host = canvas.parentElement;
        if (!host) return;
        const ratio = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.floor(host.clientWidth * ratio));
        const height = Math.max(1, Math.floor(host.clientHeight * ratio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          canvas.style.width = `${host.clientWidth}px`;
          canvas.style.height = `${host.clientHeight}px`;
        }
      };

      const fillRoundedRect = (x, y, w, h, radius, fillStyle) => {
        const r = Math.min(radius, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
      };

      const draw = () => {
        if (stopped) return;
        resizeCanvas();
        analyser.getByteFrequencyData(samples);
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        const canvasGradient = ctx.createLinearGradient(0, 0, width, height);
        canvasGradient.addColorStop(0, 'rgba(255,255,255,0.98)');
        canvasGradient.addColorStop(0.44, 'rgba(249, 238, 255, 0.98)');
        canvasGradient.addColorStop(1, 'rgba(235, 245, 255, 0.98)');
        ctx.fillStyle = canvasGradient;
        ctx.fillRect(0, 0, width, height);
        const progress = audio.duration ? Math.min(1, audio.currentTime / audio.duration) : 0;
        const playedWidth = width * progress;
        const playedGlow = ctx.createLinearGradient(0, 0, playedWidth || 1, 0);
        playedGlow.addColorStop(0, 'rgba(255,255,255,0.03)');
        playedGlow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = playedGlow;
        ctx.fillRect(0, 0, playedWidth, height);
        ctx.fillStyle = 'rgba(255,255,255,0)';
        ctx.fillRect(playedWidth, 0, width - playedWidth, height);

        const bars = Math.max(14, Math.min(24, Math.round(width / 84)));
        if (smoothedBars.length !== bars) {
          smoothedBars = new Float32Array(bars);
        }
        const spanWidth = width * 0.9;
        const gap = width * 0.0045;
        const barWidth = (spanWidth - gap * (bars - 1)) / bars;
        const clusterStart = (width - spanWidth) / 2;
        const gradient = ctx.createLinearGradient(clusterStart, 0, clusterStart + spanWidth, 0);
        gradient.addColorStop(0, 'rgba(255, 184, 92, 0.92)');
        gradient.addColorStop(0.22, 'rgba(255, 232, 94, 0.96)');
        gradient.addColorStop(0.5, 'rgba(141, 255, 101, 0.94)');
        gradient.addColorStop(0.76, 'rgba(93, 214, 255, 0.92)');
        gradient.addColorStop(1, 'rgba(159, 141, 255, 0.9)');
        const glowGradient = ctx.createLinearGradient(clusterStart, 0, clusterStart + spanWidth, 0);
        glowGradient.addColorStop(0, 'rgba(255, 176, 66, 0.16)');
        glowGradient.addColorStop(0.5, 'rgba(108, 224, 255, 0.09)');
        glowGradient.addColorStop(1, 'rgba(159, 141, 255, 0.05)');
        fillRoundedRect(
          clusterStart - width * 0.015,
          height * 0.08,
          spanWidth + width * 0.03,
          height * 0.8,
          width * 0.022,
          glowGradient,
        );

        ctx.fillStyle = gradient;
        const floorY = height * 0.84;
        const maxBarHeight = height * 0.8;
        const minBarHeight = height * 0.22;
        const rawLevels = new Float32Array(bars);
        const usableBins = Math.max(bars, Math.floor(samples.length * 0.62));

        for (let i = 0; i < bars; i += 1) {
          const startIndex = Math.floor(((i / bars) ** 1.35) * usableBins);
          const endIndex = Math.max(startIndex + 1, Math.floor((((i + 1) / bars) ** 1.35) * usableBins));
          let sum = 0;
          let count = 0;
          for (let j = startIndex; j < endIndex; j += 1) {
            sum += samples[j] / 255;
            count += 1;
          }
          rawLevels[i] = count ? sum / count : 0;
        }

        for (let i = 0; i < bars; i += 1) {
          const leftLevel = rawLevels[Math.max(0, i - 1)];
          const centerLevel = rawLevels[i];
          const rightLevel = rawLevels[Math.min(bars - 1, i + 1)];
          const sample = leftLevel * 0.22 + centerLevel * 0.56 + rightLevel * 0.22;
          const edgeFade = 0.92 + (1 - Math.abs((i / Math.max(bars - 1, 1)) * 2 - 1)) * 0.08;
          const targetHeight = Math.max(minBarHeight, (sample ** 0.88) * maxBarHeight * edgeFade);
          const previousHeight = smoothedBars[i] || minBarHeight;
          const easing = targetHeight > previousHeight ? 0.16 : 0.1;
          const barHeight = previousHeight + (targetHeight - previousHeight) * easing;
          smoothedBars[i] = barHeight;
          const x = clusterStart + i * (barWidth + gap);
          const y = floorY - barHeight;
          const w = barWidth;
          const radius = Math.min(10, w / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, floorY, radius);
          ctx.arcTo(x + w, floorY, x, floorY, radius);
          ctx.arcTo(x, floorY, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
          ctx.fill();
        }
        rafId = requestAnimationFrame(draw);
      };

      audio.addEventListener('play', () => {
        audioContext.resume().catch(() => {});
      });
      draw();

      activeAudioVisualizerCleanup = () => {
        stopped = true;
        if (rafId) cancelAnimationFrame(rafId);
        source.disconnect();
        analyser.disconnect();
        audioContext.close().catch(() => {});
      };
    }

    function attachImageCompatibility(img, item, compact = false) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'image' && cached.supported === false) {
        if (compact) replaceThumbWithPlaceholder(img, item, 'image');
        else showUnsupportedMedia(item, 'image');
        return;
      }

      img.addEventListener('load', () => {
        setMediaCompatibility(item, { kind: 'image', supported: true });
      }, { once: true });

      img.addEventListener('error', () => {
        setMediaCompatibility(item, { kind: 'image', supported: false });
        if (compact) replaceThumbWithPlaceholder(img, item, 'image');
        else showUnsupportedMedia(item, 'image');
      }, { once: true });
    }

    function attachVideoCompatibility(video, item, compact = false) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'video' && cached.supported === false) {
        if (compact) replaceThumbWithPlaceholder(video, item, 'video');
        else showUnsupportedMedia(item, 'video');
        return;
      }

      let resolved = false;
      const markSupported = () => {
        if (resolved) return true;
        if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return false;
        resolved = true;
        setMediaCompatibility(item, { kind: 'video', supported: true });
        return true;
      };

      const markUnsupported = () => {
        if (resolved) return;
        resolved = true;
        setMediaCompatibility(item, { kind: 'video', supported: false });
        video.pause();
        if (compact) replaceThumbWithPlaceholder(video, item, 'video');
        else showUnsupportedMedia(item, 'video');
      };

      video.addEventListener('loadedmetadata', () => {
        if (markSupported()) {
          if (compact) {
            const previewTime = Math.min(0.08, Math.max(0.001, (video.duration || 0) / 4));
            if (previewTime > 0) {
              try {
                video.currentTime = previewTime;
              } catch (_) {}
            }
          }
          return;
        }
        markUnsupported();
      }, { once: true });

      if (compact) {
        video.addEventListener('seeked', () => {
          video.pause();
        });
      } else {
        video.addEventListener('timeupdate', () => {
          if ((video.currentTime || 0) > 0.35 && !markSupported()) {
            markUnsupported();
          }
        });
      }

      video.addEventListener('error', () => {
        markUnsupported();
      }, { once: true });
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2;
    }

    function animateChatScroll(target, duration = SMOOTH_SCROLL_DURATION) {
      if (scrollAnimationFrame) cancelAnimationFrame(scrollAnimationFrame);
      const start = chat.scrollTop;
      const maxTarget = Math.max(0, chat.scrollHeight - chat.clientHeight);
      const finalTarget = Math.max(0, Math.min(target, maxTarget));
      const delta = finalTarget - start;
      if (Math.abs(delta) < 1) {
        chat.scrollTop = finalTarget;
        updateScrollButtonState();
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        const startedAt = performance.now();
        const step = (now) => {
          const progress = Math.min(1, (now - startedAt) / duration);
          chat.scrollTop = start + delta * easeInOutCubic(progress);
          updateScrollButtonState();
          if (progress < 1) {
            scrollAnimationFrame = requestAnimationFrame(step);
          } else {
            scrollAnimationFrame = 0;
            resolve();
          }
        };
        scrollAnimationFrame = requestAnimationFrame(step);
      });
    }

    function captureChatScrollAnchor() {
      const chatRect = chat.getBoundingClientRect();
      const rows = Array.from(chat.querySelectorAll('.item[data-message-id]'));
      const anchorRow = rows.find((row) => row.getBoundingClientRect().bottom > chatRect.top + 1) || rows[0] || null;
      if (!anchorRow) {
        return {
          messageId: null,
          offset: 0,
          scrollTop: chat.scrollTop,
        };
      }
      return {
        messageId: Number(anchorRow.dataset.messageId),
        offset: anchorRow.getBoundingClientRect().top - chatRect.top,
        scrollTop: chat.scrollTop,
      };
    }

    function restoreChatScrollAnchor(anchor) {
      if (!anchor) return;
      if (anchor.messageId == null) {
        chat.scrollTop = Math.min(anchor.scrollTop, Math.max(0, chat.scrollHeight - chat.clientHeight));
        renderChatViewport();
        updateScrollButtonState();
        return;
      }
      const anchorRow = chat.querySelector(`.item[data-message-id="${anchor.messageId}"]`);
      if (!anchorRow) {
        chat.scrollTop = Math.min(anchor.scrollTop, Math.max(0, chat.scrollHeight - chat.clientHeight));
        renderChatViewport({ forceMessageId: anchor.messageId });
        updateScrollButtonState();
        return;
      }
      const chatRect = chat.getBoundingClientRect();
      const nextOffset = anchorRow.getBoundingClientRect().top - chatRect.top;
      const nextScrollTop = chat.scrollTop + (nextOffset - anchor.offset);
      chat.scrollTop = Math.max(0, Math.min(nextScrollTop, chat.scrollHeight - chat.clientHeight));
      renderChatViewport({ forceMessageId: anchor.messageId });
      updateScrollButtonState();
    }

    function getVisibleMessages() {
      if (!manageMode) return allMessages;
      return allMessages.filter((msg) => matchesCurrentFilter(msg) && matchesSearchQuery(msg));
    }

    async function finalizeLogin(data, { rememberChoice = rememberPassword.checked, hydrate = true, reloadMessages = true, clearInput = true, password = passwordInput.value } = {}) {
      token = data.token;
      activeUserId = data.user_id || '';
      try {
        if (rememberChoice) {
          localStorage.setItem(REMEMBER_PASSWORD_KEY, password);
        } else {
          localStorage.removeItem(REMEMBER_PASSWORD_KEY);
        }
      } catch (_) {}
      if (clearInput) {
        passwordInput.value = '';
      }
      loadSelfMessageIds();
      loginMask.classList.add('hidden');
      if (!hydrate) return;
      const uiState = await fetchUiState();
      applyUiState(uiState);
      if (!reloadMessages) {
        updateScrollButtonState();
        return;
      }
      await loadMessages({ source: 'login', followBottom: true, preserveScroll: false });
      updateScrollButtonState();
    }

    async function requestAuth(password) {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (!res.ok) {
        let msg = `请求失败: ${res.status}`;
        try {
          const j = await res.json();
          if (j.error) msg = j.error;
        } catch (_) {}
        throw new Error(msg);
      }
      return res.json();
    }

    async function tryAutoReauthenticate() {
      const cached = getRememberedPassword();
      if (!cached) return false;
      if (autoReauthPromise) return autoReauthPromise;
      prepareLoginMaskWithRememberedPassword();
      autoReauthPromise = requestAuth(cached)
        .then(async (data) => {
          await finalizeLogin(data, { rememberChoice: true, hydrate: true, reloadMessages: false, clearInput: false, password: cached });
          return true;
        })
        .catch(() => false)
        .finally(() => {
          autoReauthPromise = null;
        });
      return autoReauthPromise;
    }

    async function authorizedFetch(path, options = {}) {
      const cfg = { ...options };
      cfg.headers = { ...(options.headers || {}) };
      if (token) cfg.headers.Authorization = `Bearer ${token}`;

      let res = await fetch(path, cfg);
      if (res.status === 401 && path !== '/api/auth') {
        token = '';
        const recovered = await tryAutoReauthenticate();
        if (recovered && token) {
          const retryCfg = { ...cfg, headers: { ...cfg.headers, Authorization: `Bearer ${token}` } };
          res = await fetch(path, retryCfg);
        }
      }
      if (res.status === 401) {
        token = '';
        prepareLoginMaskWithRememberedPassword();
        throw new Error('未授权');
      }
      return res;
    }

    async function api(path, options = {}) {
      const res = await authorizedFetch(path, options);
      if (!res.ok) {
        let msg = `请求失败: ${res.status}`;
        try {
          const j = await res.json();
          if (j.error) msg = j.error;
        } catch (_) {}
        throw new Error(msg);
      }
      return res.json();
    }

    async function copyRawText(value) {
      const text = String(value ?? '');
      if (navigator.clipboard?.write && typeof ClipboardItem !== 'undefined') {
        try {
          const item = new ClipboardItem({
            'text/plain': new Blob([text], { type: 'text/plain;charset=utf-8' }),
          });
          await navigator.clipboard.write([item]);
          return;
        } catch (_) {}
      }
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(temp);
      if (!ok) {
        throw new Error('复制失败');
      }
      return;
    }

    function renderMessages({ followBottom = false, preserveScroll = true } = {}) {
      ensureChatVirtualState();
      const previousScrollTop = chat.scrollTop;
      renderChatViewport();

      if (followBottom) {
        chat.scrollTop = Math.max(0, chat.scrollHeight - chat.clientHeight);
        renderChatViewport();
      } else if (preserveScroll) {
        const nextScrollTop = Math.min(previousScrollTop, Math.max(0, chat.scrollHeight - chat.clientHeight));
        if (Math.abs(nextScrollTop - chat.scrollTop) > 1) {
          chat.scrollTop = nextScrollTop;
          renderChatViewport();
        }
      }

      syncMediaHistoryContext(false);
      updateScrollButtonState();
    }

    function scrollChatToMessageId(messageId) {
      if (messageId == null) return;
      const visible = getVisibleMessages();
      const targetIndex = visible.findIndex((msg) => msg.id === messageId);
      if (targetIndex < 0) return;
      const targetTop = getChatOffsetForIndex(visible, targetIndex);
      const targetHeight = getChatMessageHeight(visible[targetIndex]);
      const nextScrollTop = Math.max(
        0,
        Math.min(
          targetTop - Math.max(0, (chat.clientHeight - targetHeight) / 2),
          Math.max(0, chat.scrollHeight - chat.clientHeight)
        )
      );
      chat.scrollTop = nextScrollTop;
      renderChatViewport({ forceMessageId: messageId });
      updateScrollButtonState();
    }

    function buildMediaList(mode = currentViewerMode) {
      currentViewerMode = mode;
      mediaList = allMessages.filter((m) => {
        if (mode === 'text') {
          return m.kind === 'text' || isTextLikeFileMessage(m);
        }
        if (m.kind !== 'file') return false;
        const mt = m.mime_type || '';
        return mt.startsWith('image/') || mt.startsWith('video/') || mt.startsWith('audio/');
      });
    }

    function getCurrentMediaMessageId() {
      if (mediaIndex < 0 || mediaIndex >= mediaList.length) return null;
      return mediaList[mediaIndex]?.id ?? null;
    }

    function syncMediaHistoryContext(shouldScroll = false) {
      const currentMessageId = getCurrentMediaMessageId();
      const rows = chat.querySelectorAll('.item[data-message-id]');
      rows.forEach((row) => {
        row.classList.toggle('is-media-active', Number(row.dataset.messageId) === currentMessageId);
      });

      if (!shouldScroll || currentMessageId == null) return;
      scrollChatToMessageId(currentMessageId);
    }

    async function showMediaAt(index) {
      if (!mediaList.length) return;
      if (index < 0 || index >= mediaList.length) return;

      const wasHidden = mediaViewer.classList.contains('hidden');
      mediaIndex = index;
      let item = mediaList[mediaIndex];
      if (wasHidden) {
        prepareMediaViewerShell(item, {
          showLoading: true,
          loadingMessage: item.kind === 'text' || isTextLikeFileMessage(item) ? '正在载入文本…' : '正在载入媒体…',
        });
        appPage.classList.add('modal-scroll-lock');
        mediaViewer.classList.remove('hidden');
        syncMediaHistoryContext(false);
        requestAnimationFrame(() => mediaDialog.focus());
      }

      await persistActiveVideoProgress();
      await persistActiveTextViewerProgress();
      cleanupActiveAudioVisualizer();
      cleanupActiveAudioShell();
      resetMediaDialogLayout();

      item = mediaList[mediaIndex];
      const mt = item.mime_type || '';
      prepareMediaViewerShell(item);

      if (item.kind === 'text' || isTextLikeFileMessage(item)) {
        mediaDialog.classList.add('text-mode');
        fitMediaDialogForText();
        const textChrome = createViewerChrome('text-viewer-stage', { hideHorizontal: textWrapEnabled });
        mediaStage.appendChild(textChrome.shell);
        const savedLine = await fetchTextProgress(item.id);
        const viewerPayload = await getViewerTextPayload(item);
        mountTextViewerState(textChrome.stage, { ...item, text: viewerPayload.content }, 0, savedLine, textChrome);
      } else if (mt.startsWith('image/')) {
        mediaDialog.classList.add('image-mode');
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'image' && cached.supported === false) {
          showUnsupportedMedia(item, 'image');
        } else {
          const imageChrome = createViewerChrome('image-viewer-stage');
          const imageCanvas = document.createElement('div');
          imageCanvas.className = 'image-viewer-canvas';
          const img = document.createElement('img');
          img.src = item.file_url;
          img.alt = item.file_name || 'image';
          img.addEventListener('load', () => {
            fitMediaDialogToAspect(img.naturalWidth || img.width, img.naturalHeight || img.height);
            mountImageViewerState(imageChrome.stage, imageCanvas, img, img.naturalWidth || img.width, img.naturalHeight || img.height, imageChrome);
          }, { once: true });
          attachImageCompatibility(img, item, false);
          imageCanvas.appendChild(img);
          imageChrome.stage.appendChild(imageCanvas);
          mediaStage.appendChild(imageChrome.shell);
        }
      } else if (mt.startsWith('video/')) {
        mediaDialog.classList.add('video-mode');
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'video' && cached.supported === false) {
          showUnsupportedMedia(item, 'video');
        } else {
          const video = document.createElement('video');
          video.controls = true;
          video.autoplay = true;
          video.preload = 'metadata';
          video.playsInline = true;
          video.addEventListener('play', () => pauseOtherVideos(video));
          video.addEventListener('loadedmetadata', () => {
            fitMediaDialogToAspect(video.videoWidth || 0, video.videoHeight || 0);
          }, { once: true });
          if (item.file_id) {
            const savedPosition = await fetchMediaProgress(item.file_id);
            video.addEventListener('loadedmetadata', () => {
              if ((video.videoWidth || 0) > 0 && (video.videoHeight || 0) > 0 && savedPosition > 0 && savedPosition < video.duration) {
                video.currentTime = savedPosition;
                playMediaElement(video);
              }
            }, { once: true });
            video.addEventListener('timeupdate', () => {
              if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return;
              if (videoProgressSaveTimer) clearTimeout(videoProgressSaveTimer);
              videoProgressSaveTimer = setTimeout(() => {
                  saveMediaProgress(item.file_id, video.currentTime).catch(() => {});
              }, 500);
            });
            video.addEventListener('pause', () => {
              if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return;
              saveMediaProgress(item.file_id, video.currentTime).catch(() => {});
            });
          }
          attachVideoCompatibility(video, item, false);
          video.src = item.file_url;
          mediaStage.appendChild(video);
          playMediaElement(video);
        }
      } else if (mt.startsWith('audio/')) {
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'audio' && cached.supported === false) {
          showUnsupportedMedia(item, 'audio');
        } else {
          mediaDialog.classList.add('audio-mode');
          const audio = document.createElement('audio');
          audio.autoplay = true;
          audio.preload = 'metadata';
          audio.muted = true;
          fitMediaDialogForAudio();
          attachAudioCompatibility(audio, item, () => showUnsupportedMedia(item, 'audio'));
          audio.src = item.file_url;
          if (item.file_id) {
            const savedPosition = await fetchMediaProgress(item.file_id);
            audio.addEventListener('loadedmetadata', () => {
              if (savedPosition > 0 && savedPosition < audio.duration) {
                audio.currentTime = savedPosition;
                playMediaElement(audio, { unmuteAfterStart: true });
              }
            }, { once: true });
            audio.addEventListener('timeupdate', () => {
              if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
              if (videoProgressSaveTimer) clearTimeout(videoProgressSaveTimer);
              videoProgressSaveTimer = setTimeout(() => {
                saveMediaProgress(item.file_id, audio.currentTime).catch(() => {});
              }, 500);
            });
            audio.addEventListener('pause', () => {
              if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
              saveMediaProgress(item.file_id, audio.currentTime).catch(() => {});
            });
          }

          const { shell, canvas, meta } = createAudioShell(item, audio);
          mediaStage.appendChild(shell);
          attachAudioVisualizer(audio, canvas, meta);
          playMediaElement(audio, { unmuteAfterStart: true });
        }
      }

      appPage.classList.add('modal-scroll-lock');
      mediaViewer.classList.remove('hidden');
      syncMediaHistoryContext(false);
      requestAnimationFrame(() => mediaDialog.focus());
    }

    function applyMessages(messages, { followBottom = false, preserveScroll = true, revision = '' } = {}) {
      allMessages = messages;

        mediaIndex = currentMessageId == null ? -1 : mediaList.findIndex((m) => m.id === currentMessageId);
      }
      lastAppliedRevision = revision;
      pendingMessages = null;
      pendingRevision = '';
      updateRefreshButtonState();
      renderMessages({ followBottom, preserveScroll });
    }

    function flushPendingMessages({ followBottom = false } = {}) {
      if (!pendingMessages) return false;
      const queued = pendingMessages;
      const revision = pendingRevision;
      applyMessages(queued, { followBottom, preserveScroll: !followBottom, revision });
      return true;
    }

    async function loadMessages({ source = 'poll', followBottom = false, preserveScroll = true } = {}) {
      const requestSeq = ++messageRequestSeq;
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;
      const knownRevision = pendingRevision || lastAppliedRevision;
      if (knownRevision) headers['If-None-Match'] = knownRevision;

      const res = await fetch('/api/messages', { headers });
      if (requestSeq < latestHandledMessageRequestSeq) {
        return;
      }
      if (res.status === 304) {
        latestHandledMessageRequestSeq = Math.max(latestHandledMessageRequestSeq, requestSeq);
        return;
      }
      if (res.status === 401) {
        token = '';
        loginMask.classList.remove('hidden');
        throw new Error('未授权');
      }
      if (!res.ok) {
        let msg = `请求失败: ${res.status}`;
        try {
          const j = await res.json();
          if (j.error) msg = j.error;
        } catch (_) {}
        throw new Error(msg);
      }

      const incoming = await res.json();
      const incomingRevision = getMessageRevisionHeader(res);
      if (requestSeq < latestHandledMessageRequestSeq) {
        return;
      }
      if (incomingRevision && (incomingRevision === pendingRevision || incomingRevision === lastAppliedRevision)) {
        latestHandledMessageRequestSeq = Math.max(latestHandledMessageRequestSeq, requestSeq);
        return;
      }

      if (source === 'poll' && shouldDeferMessageRender()) {
        latestHandledMessageRequestSeq = Math.max(latestHandledMessageRequestSeq, requestSeq);
        pendingMessages = incoming;
        pendingRevision = incomingRevision;
        updateRefreshButtonState();
        return;
      }

      latestHandledMessageRequestSeq = Math.max(latestHandledMessageRequestSeq, requestSeq);
      applyMessages(incoming, { followBottom, preserveScroll, revision: incomingRevision });
    }
