<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>FastFile 云端传输助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-border: #dbe3ef;
      --text: #243043;
      --muted: #6a7a92;
      --accent: #1d72ff;
      --danger: #d04545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
    }
    .chat-panel {
      position: relative;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topbar-title {
      font-weight: 700;
      letter-spacing: .02em;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .topbar-actions {
      margin-left: auto;
    }
    .manage-actions {
      width: 100%;
      justify-content: flex-end;
    }
    .topbar-select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    button, input[type="password"], input[type="file"], select {
      border-radius: 8px;
      border: 1px solid #c8d3e3;
      background: #fff;
      color: #243043;
      padding: 8px 11px;
      font-size: 14px;
      transition: transform .05s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 1px 0 rgba(25, 31, 43, .04);
    }
    button {
      cursor: pointer;
      user-select: none;
    }
    button:hover { box-shadow: 0 2px 8px rgba(40, 74, 140, .12); }
    button:active {
      transform: translateY(1px) scale(.99);
      filter: brightness(.95);
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
    }
    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .danger {
      background: #fff3f3;
      color: var(--danger);
      border-color: #f4bdbd;
    }
    .soft-accent {
      background: #f4f8ff;
      border-color: #cfe0ff;
      color: #315ea8;
    }
    .success {
      background: #ebfaef;
      border-color: #b8e3c2;
      color: #237a3b;
    }
    .warning {
      background: #fff6df;
      border-color: #efd391;
      color: #9a6b00;
    }
    #chat {
      height: 66vh;
      min-height: 420px;
      max-height: 82vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: #f9fbff;
      border: 1px solid #e4ebf5;
      border-radius: 10px;
      resize: vertical;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .item.self {
      justify-content: flex-end;
    }
    .bubble {
      max-width: min(92%, 820px);
      border-radius: 10px;
      border: 1px solid #dce6f3;
      background: #fff;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-text {
      background: #ffffff;
      border-color: #dce6f3;
    }
    .bubble-self-text {
      background: #e9f8ea;
      border-color: #b7dfbb;
    }
    .bubble-file {
      background: #fff6e8;
      border-color: #f0d3a2;
    }
    .bubble-file-image {
      background: #f6edff;
      border-color: #dcc6ff;
    }
    .bubble-file-video {
      background: #eaf5ff;
      border-color: #c4dfff;
    }
    .bubble-file-audio {
      background: #fff0f8;
      border-color: #f3c9e2;
    }
    .item.is-media-active .bubble {
      border-color: #7ba7ff;
      box-shadow: 0 0 0 3px rgba(29, 114, 255, .14);
    }
    .bubble-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 4px;
    }
    .bubble-title {
      font-size: 13px;
      font-weight: 600;
      color: #44556f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bubble-copy-btn {
      padding: 4px 8px;
      font-size: 12px;
      min-height: auto;
      box-shadow: none;
    }
    .bubble-text-body {
      line-height: 1.5;
    }
    .bubble-open-viewer-btn {
      margin-top: 8px;
      padding: 5px 10px;
      font-size: 12px;
      min-height: auto;
      box-shadow: none;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
    .thumb {
      width: 260px;
      max-width: 100%;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #d8e2f0;
      background: #eef4fd;
    }
    .media-placeholder {
      width: min(100%, 520px);
      padding: 18px;
      border-radius: 10px;
      border: 1px dashed #c6d5ea;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fd 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      justify-content: center;
    }
    .media-placeholder.compact {
      width: 260px;
      max-width: 100%;
      min-height: 152px;
      margin-top: 8px;
      padding: 14px;
      cursor: pointer;
    }
    .media-placeholder strong {
      font-size: 14px;
      line-height: 1.4;
    }
    .media-placeholder small {
      color: var(--muted);
      line-height: 1.5;
    }
    .media-placeholder a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }
    .media-placeholder a:hover {
      text-decoration: underline;
    }
    .scroll-fab-group {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .scroll-fab {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      border-color: #cfd9eb;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid #ccd7e7;
      padding: 10px;
      outline: none;
      color: var(--text);
      background: #fff;
      font-size: 14px;
    }
    textarea:focus {
      border-color: #8fb0ea;
      box-shadow: 0 0 0 3px rgba(29, 114, 255, .1);
    }
    .hidden { display: none !important; }
    .footer-note { color: var(--muted); font-size: 12px; }
    #mediaViewerHint {
      text-align: center;
      line-height: 1.45;
    }

    .login-mask {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 38, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
    }
    .login-box {
      width: min(92vw, 360px);
      background: #fff;
      border: 1px solid #d9e4f2;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 27, 41, .25);
      z-index: 110;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 16px;
    }
    .task-dialog {
      width: min(960px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid #d8e2f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .task-head {
      padding: 12px;
      border-bottom: 1px solid #e1e9f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .task-list {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      border: 1px solid #dbe5f3;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    .task-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .task-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-status { color: var(--muted); }
    .progress {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e6eefb;
      overflow: hidden;
      margin: 8px 0;
    }
    .bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #4f8cff, #5fb5ff);
      transition: width .2s ease;
    }
    .task-grid {
      display: grid;
      gap: 6px 14px;
      grid-template-columns: repeat(3, minmax(130px, 1fr));
      font-size: 12px;
      color: var(--muted);
    }

    #manageTools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .media-viewer {
      position: fixed;
      inset: 0;
      background: rgba(12, 20, 32, .78);
      z-index: 130;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .media-dialog {
      --media-surface-radius: 26px;
      --media-dialog-bg: #ffffff;
      --media-head-bg: transparent;
      --media-stage-bg: transparent;
      --media-type-bg: #e7eefb;
      --media-type-color: #31435f;
      width: min(980px, 100%);
      max-height: 90vh;
      background: var(--media-dialog-bg);
      border-radius: var(--media-surface-radius);
      border: 1px solid #d4e1f2;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      outline: none;
      overflow: hidden;
    }
    .media-head {
      padding: 12px 12px 10px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      background: var(--media-head-bg);
    }
    .media-head-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: start;
    }
    #mediaViewerTitle {
      margin: 0;
      justify-self: center;
      text-align: center;
      min-width: 0;
      max-width: min(100%, 640px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .media-title-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .media-title-type,
    .media-title-index {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .media-title-type {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--media-type-bg);
      color: var(--media-type-color);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .media-title-index {
      color: #52627a;
      font-size: 13px;
    }
    .media-stage {
      flex: 0 0 auto;
      min-height: 280px;
      display: flex;
      align-self: center;
      align-items: center;
      justify-content: center;
      margin: 0 12px 12px;
      border-radius: var(--media-surface-radius);
      background: var(--media-stage-bg);
      overflow: hidden;
    }
    .media-dialog.image-mode {
      --media-dialog-bg: #f6edff;
      --media-type-bg: #eadcff;
      --media-type-color: #6a44a6;
    }
    .media-dialog.video-mode {
      --media-dialog-bg: #eaf5ff;
      --media-type-bg: #d9ecff;
      --media-type-color: #1f5f96;
    }
    .media-dialog.text-mode {
      --media-dialog-bg: #f8fafc;
      --media-stage-bg: linear-gradient(180deg, #fbfdff 0%, #f3f7fb 100%);
      --media-type-bg: #e5ecf5;
      --media-type-color: #41546e;
    }
    .media-stage.placeholder-surface {
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fd 100%);
    }
    .media-dialog.audio-mode {
      --media-dialog-bg: #fff0f8;
      --media-type-bg: #ffd9f1;
      --media-type-color: #a33573;
      background: var(--media-dialog-bg);
      border: 0;
      box-shadow: none;
    }
    .media-dialog.audio-mode .media-head {
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      width: auto;
      transform: none;
      z-index: 3;
      padding: 12px 12px 10px;
      border-radius: 0;
      border: 0;
      border-bottom: 1px solid #e1e9f5;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: none;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }
    .media-dialog.audio-mode #mediaViewerTitle {
      color: #243043;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      max-width: min(100%, 520px);
    }
    .media-dialog.audio-mode #mediaViewerHint {
      display: block;
      padding: 0 14px 14px;
      text-align: center;
      line-height: 1.45;
      min-height: 30px;
    }
    .media-dialog.audio-mode .media-head button {
      background: #fff;
      border-color: #d6e0f0;
      color: #243043;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(67, 90, 133, 0.08);
    }
    .media-dialog.audio-mode .media-stage {
      margin: 0;
      border-radius: 0 0 var(--media-surface-radius) var(--media-surface-radius);
      background: transparent;
    }
    .media-stage img,
    .media-stage video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: transparent;
      display: block;
      border-radius: inherit;
    }
    .text-viewer-stage {
      --text-viewer-font-size: 14px;
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 0;
      box-sizing: border-box;
      font-size: var(--text-viewer-font-size);
      line-height: 1.65;
      color: #243043;
      white-space: pre-wrap;
      word-break: break-word;
      overscroll-behavior: contain;
    }
    .text-viewer-stage.wrap-disabled {
      white-space: pre;
      word-break: normal;
    }
    .text-viewer-block {
      padding: 0 20px;
      box-sizing: border-box;
      white-space: inherit;
      word-break: inherit;
    }
    .audio-card {
      width: 260px;
      max-width: 100%;
      min-height: 152px;
      margin-top: 8px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #d8e2f0;
      background: linear-gradient(135deg, #15314f 0%, #3b5d8c 55%, #7bb7ff 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-sizing: border-box;
    }
    .audio-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--audio-wave-bg, linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 100%));
      background-size: cover;
      background-position: center;
      opacity: .92;
      pointer-events: none;
    }
    .audio-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 14, 24, .05) 0%, rgba(7, 14, 24, .62) 100%);
      pointer-events: none;
    }
    .audio-card > * {
      position: relative;
      z-index: 1;
    }
    .audio-card-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: .95;
      pointer-events: none;
    }
    .audio-card-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      word-break: break-word;
      text-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    .audio-card-meta {
      font-size: 12px;
      color: rgba(255,255,255,.88);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      text-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .audio-card-badge {
      align-self: flex-start;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,.16);
      color: rgba(255,255,255,.96);
      backdrop-filter: blur(8px);
    }
    .audio-view {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: inherit;
      background: #000;
      border: 0;
      box-shadow: none;
    }
    .audio-shell-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .audio-shell-info {
      display: none;
    }
    .audio-shell-name {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .01em;
      word-break: break-word;
    }
    .audio-shell-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.76);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .audio-shell-footer {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 2px;
      z-index: 2;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      color: #243043;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(205, 216, 238, 0.95);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 28px rgba(62, 96, 159, 0.12);
      backdrop-filter: blur(12px);
    }
    .audio-shell-progress {
      position: relative;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 167, 196, 0.28);
      overflow: visible;
      cursor: pointer;
      min-width: 0;
    }
    .audio-shell-progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #f5c14b 0%, #6fe4ff 100%);
      box-shadow: none;
    }
    .audio-shell-progress-knob {
      position: absolute;
      top: 50%;
      left: 0;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.85);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }
    .audio-shell-controls {
      display: contents;
    }
    .audio-shell-btn {
      border: 0;
      background: transparent;
      color: #243043;
      font-size: 16px;
      padding: 0;
      cursor: pointer;
      line-height: 1;
      opacity: .72;
    }
    .audio-shell-time {
      font-size: 11px;
      color: #5f718d;
      min-width: 64px;
      font-variant-numeric: tabular-nums;
    }
    .audio-shell-volume-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-self: end;
    }
    .audio-shell-volume-popover {
      position: absolute;
      right: -2px;
      bottom: calc(100% + 10px);
      width: 44px;
      height: 132px;
      border-radius: 18px;
      border: 1px solid rgba(205, 216, 238, 0.95);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 28px rgba(62, 96, 159, 0.16);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
    }
    .audio-shell-volume-wrap.open .audio-shell-volume-popover {
      display: flex;
    }
    .audio-shell-volume {
      width: 96px;
      accent-color: #7fc7ff;
      opacity: .72;
      transform: rotate(-90deg);
    }
    .media-stage .media-placeholder {
      width: 100%;
      height: 100%;
      min-height: 280px;
      margin: 0;
      border-radius: inherit;
      border: 0;
    }

    @media (max-width: 768px) {
      .page { padding: 8px; gap: 8px; }
      #chat {
        height: 58vh;
        min-height: 320px;
      }
      .task-overlay { padding: 0; }
      .task-dialog {
        width: 100%;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
      .task-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
      .scroll-fab-group {
        right: 8px;
      }
      button, input[type="file"], select {
        min-height: 38px;
      }
      .media-head {
        grid-template-columns: 1fr auto;

<body>
  <div class="login-mask" id="loginMask">
    <div class="login-box">
      <strong>进入 FastFile 云端传输助手</strong>
      <input id="passwordInput" type="password" placeholder="请输入密码" autocomplete="off" />
      <label class="footer-note" style="display:flex; align-items:center; gap:8px;">
        <input id="rememberPassword" type="checkbox" />
        记住密码（仅本地浏览器）
      </label>
      <button id="loginBtn" class="primary">登录</button>
      <div id="loginError" class="footer-note"></div>
    </div>
  </div>

  <div class="task-overlay hidden" id="uploadTaskOverlay">
    <div class="task-dialog">
      <div class="task-head">
        <strong>上传任务</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="clearFinishedBtn">清理已完成</button>
          <button id="hideTaskPanelBtn">隐藏到后台</button>

      <div class="task-list" id="uploadTaskList"></div>

  <div class="media-viewer hidden" id="mediaViewer">
    <div class="media-dialog" id="mediaDialog" tabindex="0">
      <div class="media-head">
        <div class="media-head-nav">
          <button id="mediaPrevBtn">上一条</button>
          <button id="mediaNextBtn">下一条</button>
          <button id="mediaCopyBtn" class="hidden">复制</button>
        </div>
        <strong id="mediaViewerTitle">媒体预览</strong>
        <button id="mediaCloseBtn">关闭</button>
      </div>
      <div class="media-stage" id="mediaStage"></div>
      <div class="footer-note" id="mediaViewerHint">提示：键盘 ↑/↓ 可切换上一条/下一条</div>
    </div>
  </div>

  <div class="page">
    <div class="topbar panel">
      <strong class="topbar-title">FastFile</strong>
      <div class="actions topbar-actions" id="normalActions">
        <button id="uploadTasksBtn">上传任务</button>
        <button id="manageBtn" class="success">管理</button>
        <button id="refreshBtn">刷新</button>
      </div>
      <div class="actions manage-actions hidden" id="manageActions">

        <button id="selectAllBtn">全选</button>
        <button id="invertSelectBtn">反选</button>
        <label class="topbar-select">

        <button id="deleteBtn" class="danger">删除已勾选</button>
        <button id="resetSizeBtn">恢复默认大小</button>
        <button id="restartBtn" class="danger">重启服务</button>
        <button id="logoutBtn" class="danger">退出登录</button>

    <div class="panel chat-panel">
      <div id="chat"></div>
      <div class="scroll-fab-group hidden" id="scrollFabGroup">

    <div class="panel">
      <textarea id="textInput" placeholder="输入要发送的文本（Enter 发送，Ctrl + Enter 换行）"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
        <div style="position:relative;">
          <button id="plusMenuBtn" title="上传菜单">＋</button>

        支持多文件、断点续传、实时进度。任务可隐藏到后台继续执行。

  <script>
    const loginMask = document.getElementById('loginMask');
    const loginBtn = document.getElementById('loginBtn');
    const passwordInput = document.getElementById('passwordInput');
    const rememberPassword = document.getElementById('rememberPassword');
    const loginError = document.getElementById('loginError');

    const chat = document.getElementById('chat');
    const normalActions = document.getElementById('normalActions');
    const manageActions = document.getElementById('manageActions');
    const refreshBtn = document.getElementById('refreshBtn');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const plusMenuBtn = document.getElementById('plusMenuBtn');
    const plusMenu = document.getElementById('plusMenu');
    const pickImageBtn = document.getElementById('pickImageBtn');
    const pickVideoBtn = document.getElementById('pickVideoBtn');
    const pickAudioBtn = document.getElementById('pickAudioBtn');
    const imageUploadInput = document.getElementById('imageUploadInput');
    const videoUploadInput = document.getElementById('videoUploadInput');
    const audioUploadInput = document.getElementById('audioUploadInput');
    const sendFileBtn = document.getElementById('sendFileBtn');
    const textInput = document.getElementById('textInput');
    const fileInput = document.getElementById('fileInput');

    const restartBtn = document.getElementById('restartBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const manageBtn = document.getElementById('manageBtn');
    const exitManageBtn = document.getElementById('exitManageBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const invertSelectBtn = document.getElementById('invertSelectBtn');
    const filterSelect = document.getElementById('filterSelect');
    const deleteBtn = document.getElementById('deleteBtn');
    const resetSizeBtn = document.getElementById('resetSizeBtn');

    const uploadTasksBtn = document.getElementById('uploadTasksBtn');
    const uploadTaskOverlay = document.getElementById('uploadTaskOverlay');
    const uploadTaskList = document.getElementById('uploadTaskList');
    const hideTaskPanelBtn = document.getElementById('hideTaskPanelBtn');
    const clearFinishedBtn = document.getElementById('clearFinishedBtn');

    const mediaViewer = document.getElementById('mediaViewer');
    const mediaDialog = document.getElementById('mediaDialog');
    const mediaStage = document.getElementById('mediaStage');
    const mediaViewerTitle = document.getElementById('mediaViewerTitle');
    const mediaPrevBtn = document.getElementById('mediaPrevBtn');
    const mediaNextBtn = document.getElementById('mediaNextBtn');
    const mediaCopyBtn = document.getElementById('mediaCopyBtn');
    const mediaCloseBtn = document.getElementById('mediaCloseBtn');
    const mediaViewerHint = document.getElementById('mediaViewerHint');
    const scrollFabGroup = document.getElementById('scrollFabGroup');
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const scrollBottomBtn = document.getElementById('scrollBottomBtn');

    let token = '';
    let allMessages = [];
    let manageMode = false;
    let currentFilter = 'all';
    const selectedIds = new Set();

    let restartArmed = false;
    let restartArmTimer = null;
    let logoutArmed = false;
    let logoutArmTimer = null;
    let deleteArmed = false;
    let deleteArmTimer = null;

    const uploadTasks = new Map();
    let uploadTaskSeq = 1;
    const REMEMBER_PASSWORD_KEY = 'fastfile.remember_password';
    const SELF_MESSAGE_IDS_KEY = 'fastfile.self_message_ids';
    const DEFAULT_CHAT_HEIGHT = '66vh';
    const DEFAULT_INPUT_HEIGHT = '110px';
    let mediaList = [];
    let mediaIndex = -1;
    let lastAppliedSnapshot = '';
    let pendingMessages = null;
    let pendingSnapshot = '';
    let pollingInFlight = false;
    let scrollAnimationFrame = 0;
    const selfMessageIds = new Set();
    const mediaProgressCache = new Map();
    const mediaCompatibilityCache = new Map();
    const audioVisualCache = new Map();
    const audioVisualPending = new Map();
    let activeAudioVisualizerCleanup = null;
    let activeAudioShellCleanup = null;
    let activeTextViewerState = null;
    let uiStateSaveTimer = 0;
    let suppressUiResizeSave = false;
    let videoProgressSaveTimer = 0;
    let textWrapEnabled = true;
    let textViewerZoom = 1;

    const SCROLL_EDGE_THRESHOLD = 24;
    const SMOOTH_SCROLL_DURATION = 1000;
    const MEDIA_VIEWPORT_MAX_RATIO = 0.9;
    const TEXT_PREVIEW_MAX_LINES = 5;
    const TEXT_PREVIEW_MAX_CHARS = 200;
    const TEXT_VIEWER_WRAP_BLOCK_CHARS = 1600;
    const TEXT_VIEWER_NOWRAP_BLOCK_LINES = 40;
    const TEXT_VIEWER_OVERSCAN = 2;

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      return `${(n / 1024 / 1024 / 1024).toFixed(2)} GB`;
    }

    function formatDuration(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '--';
      const s = Math.floor(sec % 60);
      const m = Math.floor((sec / 60) % 60);
      const h = Math.floor(sec / 3600);
      return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    }

    function formatSpeed(bps) {
      if (!bps || !Number.isFinite(bps) || bps <= 0) return '--';
      return `${formatBytes(bps)}/s`;
    }

    function taskStatusText(status) {
      const map = {
        queued: '排队中',
        uploading: '上传中',
        retrying: '重试中',
        done: '完成',
        error: '失败',
        cancelled: '已取消'
      };
      return map[status] || status;
    }

    function snapshotMessages(messages) {
      return JSON.stringify((messages || []).map((m) => [
        m.id,
        m.kind,
        m.text,
        m.created_at,
        m.file_id,
        m.file_name,
        m.file_size,
        m.mime_type,
      ]));
    }

    function getBubbleVariant(msg) {
      if (msg.kind === 'text') {
        return isSelfMessage(msg.id) ? 'bubble-self-text' : 'bubble-text';
      }
      const mimeType = msg.mime_type || '';
      if (mimeType.startsWith('image/')) return 'bubble-file-image';
      if (mimeType.startsWith('video/')) return 'bubble-file-video';
      if (mimeType.startsWith('audio/')) return 'bubble-file-audio';
      return 'bubble-file';
    }

    function loadSelfMessageIds() {
      selfMessageIds.clear();
      try {
        const raw = sessionStorage.getItem(SELF_MESSAGE_IDS_KEY);
        const ids = JSON.parse(raw || '[]');
        ids.forEach((id) => {
          selfMessageIds.add(Number(id));
        });
      } catch (_) {}
    }

    function saveSelfMessageIds() {
      try {
        sessionStorage.setItem(SELF_MESSAGE_IDS_KEY, JSON.stringify(Array.from(selfMessageIds)));
      } catch (_) {}
    }

    function markMessageAsSelf(id) {
      if (!Number.isFinite(Number(id))) return;
      selfMessageIds.add(Number(id));
      saveSelfMessageIds();
    }

    function isSelfMessage(id) {
      return selfMessageIds.has(Number(id));
    }

    function isChatNearTop() {
      return chat.scrollTop <= SCROLL_EDGE_THRESHOLD;
    }

    function isChatNearBottom() {
      return chat.scrollHeight - chat.clientHeight - chat.scrollTop <= SCROLL_EDGE_THRESHOLD;
    }

    function shouldDeferMessageRender() {
      return !isChatNearBottom();
    }

    function updateRefreshButtonState() {
      refreshBtn.textContent = pendingMessages ? '刷新（有更新）' : '刷新';
    }

    function updateScrollButtonState() {
      const shouldShow = !loginMask.classList.contains('hidden');
      scrollFabGroup.classList.toggle('hidden', shouldShow);
      scrollTopBtn.disabled = isChatNearTop();
      scrollBottomBtn.disabled = isChatNearBottom();
    }

    function applyUiState({ chat_height_px, input_height_px, text_wrap_enabled }) {
      suppressUiResizeSave = true;
      chat.style.height = chat_height_px ? `${chat_height_px}px` : DEFAULT_CHAT_HEIGHT;
      textInput.style.height = input_height_px ? `${input_height_px}px` : DEFAULT_INPUT_HEIGHT;
      textWrapEnabled = text_wrap_enabled !== false;
      syncTextViewerWrapUi();
      updateScrollButtonState();
      setTimeout(() => {
        suppressUiResizeSave = false;
      }, 0);
    }

    async function fetchUiState() {
      return api('/api/ui-state');
    }

    async function saveUiState(partial) {
      if (!token) return;
      await api('/api/ui-state', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(partial),
      });
    }

    function scheduleUiStateSave() {
      if (suppressUiResizeSave || !token) return;
      if (uiStateSaveTimer) clearTimeout(uiStateSaveTimer);
      uiStateSaveTimer = setTimeout(() => {
        saveUiState({
          chat_height_px: Math.round(chat.getBoundingClientRect().height),
          input_height_px: Math.round(textInput.getBoundingClientRect().height),
        }).catch(() => {});
      }, 400);
    }

    async function restoreDefaultUiState() {
      await api('/api/ui-state/reset', { method: 'POST' });
      applyUiState({ chat_height_px: null, input_height_px: null, text_wrap_enabled: true });
    }

    async function fetchMediaProgress(fileId) {
      if (mediaProgressCache.has(fileId)) {
        return mediaProgressCache.get(fileId);
      }
      const result = await api(`/api/video-progress/${encodeURIComponent(fileId)}`);
      const value = Number(result.position_seconds || 0);
      mediaProgressCache.set(fileId, value);
      return value;
    }

    async function saveMediaProgress(fileId, positionSeconds) {
      if (!token || !fileId) return;
      const safePosition = Math.max(0, Number(positionSeconds || 0));
      mediaProgressCache.set(fileId, safePosition);
      await api(`/api/video-progress/${encodeURIComponent(fileId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ position_seconds: safePosition }),
      });
    }

    function getMediaCacheKey(item) {
      return item?.file_id || item?.file_url || item?.download_url || item?.file_name || '';
    }

    function getMediaCompatibility(item) {
      const key = getMediaCacheKey(item);
      return key ? mediaCompatibilityCache.get(key) || null : null;
    }

    function setMediaCompatibility(item, payload) {
      const key = getMediaCacheKey(item);
      if (!key) return;
      mediaCompatibilityCache.set(key, payload);
    }

    function getFileExtension(name) {
      const raw = String(name || '');
      const pos = raw.lastIndexOf('.');
      return pos >= 0 ? raw.slice(pos + 1).toLowerCase() : '';
    }

    function getFileBaseName(name) {
      const raw = String(name || '');
      const pos = raw.lastIndexOf('.');
      return pos > 0 ? raw.slice(0, pos) : raw;
    }

    function getTextPreview(text) {
      const raw = String(text || '');
      let lineBoundary = raw.length;
      let lineCount = 1;
      for (let i = 0; i < raw.length; i += 1) {
        if (raw[i] !== '\n') continue;
        if (lineCount >= TEXT_PREVIEW_MAX_LINES) {
          lineBoundary = i;
          break;
        }
        lineCount += 1;
      }
      const limit = Math.min(raw.length, TEXT_PREVIEW_MAX_CHARS, lineBoundary);
      return {
        preview: raw.slice(0, limit).replace(/\s+$/u, ''),
        truncated: limit < raw.length,
      };
    }

    function isLongTextMessage(msg) {
      return msg?.kind === 'text' && getTextPreview(msg.text).truncated;
    }

    function getViewerMessageTitle(item) {
      if (item?.kind === 'text') {
        return String(item.text || '').split('\n').find((line) => line.trim()) || '文本消息';
      }
      return getFileBaseName(item?.file_name || '媒体文件');
    }

    function formatMediaTypeLabel(mimeType, fileName) {
      const ext = getFileExtension(fileName);
      if (ext) return ext.toUpperCase();
      if (!mimeType) return 'FILE';
      const major = mimeType.split('/')[0] || mimeType;
      return major.toUpperCase();
    }

    function truncateMediaTitleName(name) {
      const raw = String(name || '媒体文件');
      const budget = window.innerWidth <= 768 ? 10 : 18;
      if (raw.length <= budget) return raw;
      return `${raw.slice(0, Math.max(1, budget - 3))}...`;
    }

    function renderMediaViewerTitle(item, index, total) {
      const fileName = getViewerMessageTitle(item);
      const nameSpan = document.createElement('span');
      nameSpan.className = 'media-title-name';
      nameSpan.textContent = truncateMediaTitleName(fileName);

      const typeSpan = document.createElement('span');
      typeSpan.className = 'media-title-type';
      const typeLabel = item?.kind === 'text'
        ? 'TEXT'
        : formatMediaTypeLabel(item?.mime_type, item?.file_name);
      typeSpan.textContent = `[${typeLabel}]`;

      const indexSpan = document.createElement('span');
      indexSpan.className = 'media-title-index';
      indexSpan.textContent = `(${index + 1}/${total})`;

      mediaViewerTitle.replaceChildren(nameSpan, typeSpan, indexSpan);
    }

    function buildUnsupportedMessage(kind, item) {
      const ext = getFileExtension(item?.file_name);
      if (kind === 'video') {
        return `当前浏览器无法纯前端解码这个${ext ? ` ${ext.toUpperCase()}` : ''}视频，继续播放只会出现有声音没画面。`;
      }
      if (kind === 'audio') {
        return `当前浏览器无法纯前端解码这个${ext ? ` ${ext.toUpperCase()}` : ''}音频。`;
      }
      return `当前浏览器无法纯前端预览这个${ext ? ` ${ext.toUpperCase()}` : ''}图片格式。`;
    }

    function createMediaPlaceholder(item, message, compact = false) {
      const box = document.createElement('div');
      box.className = `media-placeholder${compact ? ' compact thumb' : ''}`;

      const title = document.createElement('strong');
      title.textContent = item?.file_name || (compact ? '媒体预览不可用' : '媒体无法预览');
      box.appendChild(title);

      const desc = document.createElement('small');
      desc.textContent = message;
      box.appendChild(desc);

      if (item?.download_url) {
        const link = document.createElement('a');
        link.href = item.download_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '下载原文件';
        box.appendChild(link);
      }

      return box;
    }

    function showUnsupportedMedia(item, kind) {
      mediaStage.innerHTML = '';
      mediaStage.classList.add('placeholder-surface');
      mediaStage.appendChild(createMediaPlaceholder(item, buildUnsupportedMessage(kind, item), false));
    }

    function replaceThumbWithPlaceholder(node, item, kind) {
      const placeholder = createMediaPlaceholder(item, buildUnsupportedMessage(kind, item), true);
      placeholder.title = '点击查看详情';
      placeholder.onclick = () => openMediaByMessageId(item.id).catch(() => {});
      node.replaceWith(placeholder);
    }

    function formatAudioMime(mimeType, fileName) {
      const ext = getFileExtension(fileName);
      if (ext) return ext.toUpperCase();
      if (!mimeType) return 'AUDIO';
      const slash = mimeType.split('/')[1] || mimeType;
      return slash.toUpperCase();
    }

    function getAudioVisual(item) {
      const key = getMediaCacheKey(item);
      return key ? audioVisualCache.get(key) || null : null;
    }

    function setAudioVisual(item, value) {
      const key = getMediaCacheKey(item);
      if (!key) return;
      audioVisualCache.set(key, value);
    }

    function createAudioCard(item, { compact = false, withCanvas = false } = {}) {
      const card = document.createElement('div');
      card.className = compact ? 'audio-card thumb' : 'audio-card';
      card.style.setProperty('--audio-wave-bg', 'linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 100%)');

      if (withCanvas) {
        const canvas = document.createElement('canvas');
        canvas.className = 'audio-card-canvas';
        card.appendChild(canvas);
      }

      const badge = document.createElement('div');
      badge.className = 'audio-card-badge';
      badge.textContent = compact ? '音频' : '音频播放';
      card.appendChild(badge);

      const title = document.createElement('div');
      title.className = 'audio-card-name';
      title.textContent = item?.file_name || '音频文件';
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'audio-card-meta';
      const size = document.createElement('span');
      size.textContent = formatBytes(item?.file_size || 0);
      const fmt = document.createElement('span');
      fmt.textContent = formatAudioMime(item?.mime_type, item?.file_name);
      meta.appendChild(size);
      meta.appendChild(fmt);
      card.appendChild(meta);

      const visual = getAudioVisual(item);
      if (visual?.background) {
        card.style.setProperty('--audio-wave-bg', `url(${visual.background})`);
      }
      return card;
    }

    function renderWaveformBackground(channelData, width = 1200, height = 360) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#13273f';
      ctx.fillRect(0, 0, width, height);

      const gradient = ctx.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, '#ffb35c');
      gradient.addColorStop(0.24, '#ffe45e');
      gradient.addColorStop(0.5, '#8dff65');
      gradient.addColorStop(0.74, '#5dd6ff');
      gradient.addColorStop(1, '#9f8dff');

      const bars = 8;
      const spanWidth = width * 0.58;
      const step = Math.max(1, Math.floor(channelData.length / bars));
      const barWidth = spanWidth / bars;
      const floorY = height * 0.94;
      const maxBarHeight = height * 0.9;
      ctx.fillStyle = gradient;

      for (let i = 0; i < bars; i += 1) {
        const start = i * step;
        const end = Math.min(channelData.length, start + step);
        let peak = 0;
        for (let j = start; j < end; j += 1) {
          const value = Math.abs(channelData[j] || 0);
          if (value > peak) peak = value;
        }
        const minHeight = Math.max(18, maxBarHeight * 0.1);
        const barHeight = Math.max(minHeight, peak * maxBarHeight);
        const x = i * barWidth + barWidth * 0.14;
        const w = Math.max(20, barWidth * 0.58);
        const y = floorY - barHeight;
        const r = Math.min(8, w / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, floorY, r);
        ctx.arcTo(x + w, floorY, x, floorY, r);
        ctx.arcTo(x, floorY, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fill();
      }

      const lineGradient = ctx.createLinearGradient(0, floorY, width, floorY);
      lineGradient.addColorStop(0, 'rgba(106, 213, 255, 0.65)');
      lineGradient.addColorStop(1, 'rgba(196, 217, 255, 0.28)');
      ctx.fillStyle = lineGradient;
      ctx.fillRect(0, floorY + 8, width, 3);

      return canvas.toDataURL('image/png');
    }

    async function ensureAudioVisual(item) {
      const key = getMediaCacheKey(item);
      if (!key || audioVisualCache.has(key)) return audioVisualCache.get(key);
      if (audioVisualPending.has(key)) return audioVisualPending.get(key);

      const pending = (async () => {
        try {
          const response = await fetch(item.file_url);
          if (!response.ok) throw new Error('音频读取失败');
          const buffer = await response.arrayBuffer();
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const decoded = await audioContext.decodeAudioData(buffer.slice(0));
          const channelData = decoded.getChannelData(0);
          const payload = { background: renderWaveformBackground(channelData), duration: decoded.duration };
          setAudioVisual(item, payload);
          await audioContext.close().catch(() => {});
          return payload;
        } catch (_) {
          const payload = { background: null, duration: null };
          setAudioVisual(item, payload);
          return payload;
        } finally {
          audioVisualPending.delete(key);
        }
      })();

      audioVisualPending.set(key, pending);
      return pending;
    }

    function enhanceAudioCard(card, item) {
      ensureAudioVisual(item).then((visual) => {
        if (!visual?.background || !card.isConnected) return;
        card.style.setProperty('--audio-wave-bg', `url(${visual.background})`);
      }).catch(() => {});
    }

    function attachAudioCompatibility(audio, item, onUnsupported) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'audio' && cached.supported === false) {
        onUnsupported();
        return;
      }

      let resolved = false;
      const markSupported = () => {
        if (resolved) return true;
        resolved = true;
        setMediaCompatibility(item, { kind: 'audio', supported: true });
        return true;
      };
      const markUnsupported = () => {
        if (resolved) return;
        resolved = true;
        setMediaCompatibility(item, { kind: 'audio', supported: false });
        onUnsupported();
      };

      audio.addEventListener('loadedmetadata', () => {
        markSupported();
      }, { once: true });
      audio.addEventListener('canplay', () => {
        markSupported();
      }, { once: true });
      audio.addEventListener('error', () => {
        markUnsupported();
      }, { once: true });
    }

    function playMediaElement(media, { unmuteAfterStart = false } = {}) {
      const tryPlay = () => {
        const playing = media.play();
        if (playing && typeof playing.then === 'function') {
          playing.then(() => {
            if (unmuteAfterStart) media.muted = false;
          }).catch(() => {});
        } else if (unmuteAfterStart) {
          media.muted = false;
        }
      };
      requestAnimationFrame(tryPlay);
      media.addEventListener('loadeddata', tryPlay, { once: true });
      media.addEventListener('canplay', tryPlay, { once: true });
    }

    function cleanupActiveAudioShell() {
      if (typeof activeAudioShellCleanup === 'function') {
        activeAudioShellCleanup();
      }
      activeAudioShellCleanup = null;
    }

    function formatMediaClock(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '0:00';
      const total = Math.floor(sec);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function createAudioShell(item, audio) {
      const shell = document.createElement('div');
      shell.className = 'audio-view';

      audio.style.display = 'none';
      audio.setAttribute('aria-hidden', 'true');
      shell.appendChild(audio);

      const canvas = document.createElement('canvas');
      canvas.className = 'audio-shell-canvas';
      shell.appendChild(canvas);

      const info = document.createElement('div');
      info.className = 'audio-shell-info';
      const name = document.createElement('div');
      name.className = 'audio-shell-name';
      name.textContent = item.file_name || '音频文件';
      const meta = document.createElement('div');
      meta.className = 'audio-shell-meta';
      meta.innerHTML = `<span>${formatAudioMime(item.mime_type, item.file_name)}</span>`;
      info.appendChild(name);
      info.appendChild(meta);
      shell.appendChild(info);

      const footer = document.createElement('div');
      footer.className = 'audio-shell-footer';

      const current = document.createElement('div');
      current.className = 'audio-shell-time';
      current.textContent = '0:00 / 0:00';
      const progress = document.createElement('div');
      progress.className = 'audio-shell-progress';
      const progressFill = document.createElement('div');
      progressFill.className = 'audio-shell-progress-fill';
      const progressKnob = document.createElement('div');
      progressKnob.className = 'audio-shell-progress-knob';
      progress.appendChild(progressFill);
      progress.appendChild(progressKnob);

      const controls = document.createElement('div');
      controls.className = 'audio-shell-controls';
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'audio-shell-btn';
      toggleBtn.type = 'button';
      toggleBtn.textContent = '❚❚';
      const volumeWrap = document.createElement('div');
      volumeWrap.className = 'audio-shell-volume-wrap';
      const volumeBtn = document.createElement('button');
      volumeBtn.className = 'audio-shell-btn';
      volumeBtn.type = 'button';
      volumeBtn.textContent = '🔊';
      volumeBtn.setAttribute('aria-label', '音量');
      const volumePopover = document.createElement('div');
      volumePopover.className = 'audio-shell-volume-popover';
      const volume = document.createElement('input');
      volume.className = 'audio-shell-volume';
      volume.type = 'range';
      volume.min = '0';
      volume.max = '100';
      volume.step = '1';
      volume.value = String(Math.round((audio.volume || 1) * 100));
      volumePopover.appendChild(volume);
      volumeWrap.appendChild(volumeBtn);
      volumeWrap.appendChild(volumePopover);

      controls.appendChild(toggleBtn);
      controls.appendChild(current);
      controls.appendChild(progress);
      controls.appendChild(volumeWrap);
      footer.appendChild(controls);
      shell.appendChild(footer);

      const sync = () => {
        const total = Number.isFinite(audio.duration) ? audio.duration : 0;
        const now = audio.currentTime || 0;
        current.textContent = `${formatMediaClock(now)} / ${formatMediaClock(total)}`;
        const ratio = total > 0 ? now / total : 0;
        progressFill.style.width = `${ratio * 100}%`;
        progressKnob.style.left = `${ratio * 100}%`;
        toggleBtn.textContent = audio.paused ? '▶' : '❚❚';
        volumeBtn.textContent = audio.muted || audio.volume === 0 ? '🔈' : '🔊';
      };

      const seek = (clientX) => {
        const rect = progress.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = ratio * audio.duration;
          sync();
        }
      };

      progress.addEventListener('click', (e) => seek(e.clientX));
      toggleBtn.onclick = () => {
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      };
      volume.addEventListener('input', () => {
        audio.muted = false;
        audio.volume = Number(volume.value) / 100;
        sync();
      });
      volumeBtn.onclick = () => {
        volumeWrap.classList.toggle('open');
      };
      const closeVolumePopover = (event) => {
        if (volumeWrap.contains(event.target)) return;
        volumeWrap.classList.remove('open');
      };
      document.addEventListener('pointerdown', closeVolumePopover, true);

      ['play', 'pause', 'timeupdate', 'loadedmetadata', 'volumechange', 'ended'].forEach((eventName) => {
        audio.addEventListener(eventName, sync);
      });
      sync();

      activeAudioShellCleanup = () => {
        document.removeEventListener('pointerdown', closeVolumePopover, true);
      };

      return { shell, canvas, meta, sync };
    }

    function cleanupActiveAudioVisualizer() {
      if (typeof activeAudioVisualizerCleanup === 'function') {
        activeAudioVisualizerCleanup();
      }
      activeAudioVisualizerCleanup = null;
    }

    function resetMediaDialogLayout() {
      cleanupActiveTextViewer();
      mediaDialog.style.width = '';
      mediaStage.style.width = '';
      mediaStage.style.height = '';
      mediaStage.classList.remove('placeholder-surface');
      mediaDialog.classList.remove('image-mode');
      mediaDialog.classList.remove('text-mode');
      mediaDialog.classList.remove('video-mode');
      mediaDialog.classList.remove('audio-mode');

    function fitMediaDialogToAspect(width, height) {
      if (!width || !height) return;
      const isMobile = window.innerWidth <= 768;
      const viewportWidth = Math.min(window.innerWidth * (isMobile ? 0.96 : MEDIA_VIEWPORT_MAX_RATIO), 980);
      const viewportHeight = Math.max(isMobile ? 220 : 280, Math.min(window.innerHeight * MEDIA_VIEWPORT_MAX_RATIO - (isMobile ? 130 : 110), window.innerHeight * MEDIA_VIEWPORT_MAX_RATIO));
      const scale = Math.min(viewportWidth / width, viewportHeight / height);
      const fittedWidth = Math.max(isMobile ? 220 : 320, Math.round(width * scale));
      const fittedHeight = Math.max(isMobile ? 180 : 240, Math.round(height * scale));
      const dialogPadding = isMobile ? 16 : 28;
      const minDialogWidth = isMobile ? 260 : 420;
      mediaStage.style.width = `${fittedWidth}px`;
      mediaStage.style.height = `${fittedHeight}px`;
      mediaDialog.style.width = `${Math.max(minDialogWidth, Math.min(viewportWidth, fittedWidth + dialogPadding))}px`;
    }

    function fitMediaDialogForAudio() {
      const isMobile = window.innerWidth <= 768;
      const dialogPadding = isMobile ? 16 : 28;
      const maxDialogWidth = Math.min(window.innerWidth * (isMobile ? 0.96 : MEDIA_VIEWPORT_MAX_RATIO), 980);
      const maxStageWidth = Math.max(isMobile ? 240 : 420, Math.round(maxDialogWidth - dialogPadding));
      const maxStageHeight = Math.max(isMobile ? 260 : 420, Math.min(window.innerHeight * (isMobile ? 0.54 : 0.68), window.innerHeight * MEDIA_VIEWPORT_MAX_RATIO - (isMobile ? 170 : 126)));
      const ergonomicAspect = isMobile
        ? Math.min(1.08, Math.max(0.88, (window.innerWidth / Math.max(window.innerHeight, 1)) * 1.85))
        : Math.min(1.85, Math.max(1.45, (window.innerWidth / Math.max(window.innerHeight, 1)) * 1.02));
      let stageWidth = Math.min(maxStageWidth, Math.round(maxStageHeight * ergonomicAspect));
      let stageHeight = Math.round(stageWidth / ergonomicAspect);
      if (stageHeight > maxStageHeight) {
        stageHeight = Math.round(maxStageHeight);
        stageWidth = Math.round(stageHeight * ergonomicAspect);
      }
      stageWidth = Math.max(isMobile ? 240 : 420, Math.round(stageWidth));
      stageHeight = Math.max(isMobile ? 260 : 420, Math.round(stageHeight));
      mediaStage.style.width = `${stageWidth}px`;
      mediaStage.style.height = `${stageHeight}px`;
      mediaDialog.style.width = `${Math.max(isMobile ? 260 : 420, Math.min(maxDialogWidth, stageWidth + dialogPadding))}px`;
    }

    function fitMediaDialogForText() {
      const isMobile = window.innerWidth <= 768;
      const viewportWidth = Math.min(window.innerWidth * (isMobile ? 0.96 : 0.9), 980);
      const viewportHeight = Math.max(320, Math.min(window.innerHeight * 0.78, 760));
      mediaStage.style.width = `${Math.round(viewportWidth - (isMobile ? 20 : 32))}px`;
      mediaStage.style.height = `${Math.round(viewportHeight - (isMobile ? 96 : 112))}px`;
      mediaDialog.style.width = `${Math.round(viewportWidth)}px`;
    }

    function cleanupActiveTextViewer() {
      if (!activeTextViewerState) return;
      const { stage, scrollHandler, resizeObserver, zoomCleanup } = activeTextViewerState;
      if (stage && scrollHandler) {
        stage.removeEventListener('scroll', scrollHandler);
      }
      if (resizeObserver) {
        resizeObserver.disconnect();
      }
      if (typeof zoomCleanup === 'function') {
        zoomCleanup();
      }
      activeTextViewerState = null;
    }

    function splitTextViewerBlocks(text, wrapEnabled) {
      const raw = String(text || '');
      if (!raw) return [''];
      if (wrapEnabled) {
        const blocks = [];
        for (let i = 0; i < raw.length; i += TEXT_VIEWER_WRAP_BLOCK_CHARS) {
          blocks.push(raw.slice(i, i + TEXT_VIEWER_WRAP_BLOCK_CHARS));
        }
        return blocks;
      }

      const lines = raw.split('\n');
      const blocks = [];
      for (let i = 0; i < lines.length; i += TEXT_VIEWER_NOWRAP_BLOCK_LINES) {
        blocks.push(lines.slice(i, i + TEXT_VIEWER_NOWRAP_BLOCK_LINES).join('\n'));
      }
      return blocks;
    }

    function estimateTextViewerBlockHeight(blockText, wrapEnabled, stageWidth) {
      const fontSize = 14 * textViewerZoom;
      const lineHeight = fontSize * 1.65;
      if (!wrapEnabled) {
        return Math.round(Math.max(1, String(blockText || '').split('\n').length) * lineHeight);
      }

      const usableWidth = Math.max(220, stageWidth - 40);
      const charsPerLine = Math.max(12, Math.floor(usableWidth / Math.max(7, fontSize * 0.58)));
      const logicalLines = String(blockText || '').split('\n').reduce((sum, line) => {
        return sum + Math.max(1, Math.ceil(Math.max(line.length, 1) / charsPerLine));
      }, 0);
      return Math.round(logicalLines * lineHeight);
    }

    function renderTextViewerViewport(state) {
      const { stage, blocks, heights, topSpacer, host, bottomSpacer } = state;
      const overscanPx = stage.clientHeight * TEXT_VIEWER_OVERSCAN;
      const startBoundary = Math.max(0, stage.scrollTop - overscanPx);
      const endBoundary = stage.scrollTop + stage.clientHeight + overscanPx;

      let start = 0;
      let topHeight = 0;
      while (start < heights.length && topHeight + heights[start] < startBoundary) {
        topHeight += heights[start];
        start += 1;
      }

      let end = start;
      let renderedBottom = topHeight;
      while (end < heights.length && renderedBottom < endBoundary) {
        renderedBottom += heights[end];
        end += 1;
      }
      if (end === start && end < heights.length) {
        renderedBottom += heights[end];
        end += 1;
      }

      topSpacer.style.height = `${18 + topHeight}px`;

      const fragment = document.createDocumentFragment();
      for (let i = start; i < end; i += 1) {
        const block = document.createElement('div');
        block.className = 'text-viewer-block';
        block.textContent = blocks[i];
        fragment.appendChild(block);
      }
      host.replaceChildren(fragment);

      let measuredChanged = false;
      Array.from(host.children).forEach((node, offset) => {
        const index = start + offset;
        const measuredHeight = Math.ceil(node.getBoundingClientRect().height);
        if (measuredHeight > 0 && Math.abs(measuredHeight - heights[index]) > 1) {
          heights[index] = measuredHeight;
          measuredChanged = true;
        }
      });

      const totalHeight = heights.reduce((sum, height) => sum + height, 0);
      const renderedHeight = heights.slice(start, end).reduce((sum, height) => sum + height, 0);
      bottomSpacer.style.height = `${18 + Math.max(0, totalHeight - topHeight - renderedHeight)}px`;
      state.start = start;
      state.end = end;

      if (measuredChanged) {
        requestAnimationFrame(() => renderTextViewerViewport(state));
      }
    }

    function mountTextViewerState(stage, item, preservedScrollTop = 0) {
      const blocks = splitTextViewerBlocks(item.text || '', textWrapEnabled);
      const stageWidth = stage.clientWidth || parseInt(mediaStage.style.width || '0', 10) || 640;
      const heights = blocks.map((blockText) => estimateTextViewerBlockHeight(blockText, textWrapEnabled, stageWidth));

      stage.innerHTML = '';
      stage.classList.toggle('wrap-disabled', !textWrapEnabled);
      stage.style.setProperty('--text-viewer-font-size', `${14 * textViewerZoom}px`);

      const topSpacer = document.createElement('div');
      const host = document.createElement('div');
      const bottomSpacer = document.createElement('div');
      stage.appendChild(topSpacer);
      stage.appendChild(host);
      stage.appendChild(bottomSpacer);

      const state = {
        stage,
        item,
        blocks,
        heights,
        topSpacer,
        host,
        bottomSpacer,
        start: 0,
        end: 0,
        scrollHandler: null,
        resizeObserver: null,
        zoomCleanup: null,
      };

      state.scrollHandler = () => renderTextViewerViewport(state);
      stage.addEventListener('scroll', state.scrollHandler, { passive: true });
      state.resizeObserver = new ResizeObserver(() => renderTextViewerViewport(state));
      state.resizeObserver.observe(stage);
      state.zoomCleanup = attachTextViewerZoom(stage);
      activeTextViewerState = state;
      stage.scrollTop = Math.max(0, preservedScrollTop);
      renderTextViewerViewport(state);
    }

    function syncTextViewerWrapUi() {
      const textStage = mediaStage.querySelector('.text-viewer-stage');
      if (textStage) {
        textStage.classList.toggle('wrap-disabled', !textWrapEnabled);
        textStage.style.setProperty('--text-viewer-font-size', `${14 * textViewerZoom}px`);
      }

      const toggle = document.getElementById('textWrapToggle');
      if (toggle) {
        toggle.checked = textWrapEnabled;
      }

      if (activeTextViewerState && textStage) {
        const keepScrollTop = textStage.scrollTop;
        cleanupActiveTextViewer();
        mountTextViewerState(textStage, activeTextViewerState?.item || mediaList[mediaIndex], keepScrollTop);
      }
    }

    function renderMediaViewerHint(item) {
      mediaViewerHint.innerHTML = '';
      if (item?.kind !== 'text') {
        mediaViewerHint.textContent = '提示：键盘 ↑/↓ 可切换上一条/下一条';

      const row = document.createElement('div');

      row.style.justifyContent = 'center';

      row.style.flexWrap = 'wrap';

      const wrapLabel = document.createElement('label');
      wrapLabel.style.display = 'inline-flex';
      wrapLabel.style.alignItems = 'center';
      wrapLabel.style.gap = '8px';
      wrapLabel.style.lineHeight = '1';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'textWrapToggle';
      checkbox.checked = textWrapEnabled;
      checkbox.addEventListener('change', () => {
        textWrapEnabled = checkbox.checked;
        syncTextViewerWrapUi();
        saveUiState({ text_wrap_enabled: textWrapEnabled }).catch(() => {});
      });

      wrapLabel.appendChild(labelText);

      const note = document.createElement('span');
