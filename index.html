<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>FastFile 云端传输助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-border: #dbe3ef;
      --text: #243043;
      --muted: #6a7a92;
      --accent: #1d72ff;
      --danger: #d04545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
    }
    .chat-panel {
      position: relative;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topbar-title {
      font-weight: 700;
      letter-spacing: .02em;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .topbar-actions {
      margin-left: auto;
    }
    .manage-actions {
      width: 100%;
      justify-content: flex-end;
    }
    .topbar-select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    button, input[type="password"], input[type="file"], select {
      border-radius: 8px;
      border: 1px solid #c8d3e3;
      background: #fff;
      color: #243043;
      padding: 8px 11px;
      font-size: 14px;
      transition: transform .05s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 1px 0 rgba(25, 31, 43, .04);
    }
    button {
      cursor: pointer;
      user-select: none;
    }
    button:hover { box-shadow: 0 2px 8px rgba(40, 74, 140, .12); }
    button:active {
      transform: translateY(1px) scale(.99);
      filter: brightness(.95);
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
    }
    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .danger {
      background: #fff3f3;
      color: var(--danger);
      border-color: #f4bdbd;
    }
    .soft-accent {
      background: #f4f8ff;
      border-color: #cfe0ff;
      color: #315ea8;
    }
    .success {
      background: #ebfaef;
      border-color: #b8e3c2;
      color: #237a3b;
    }
    .warning {
      background: #fff6df;
      border-color: #efd391;
      color: #9a6b00;
    }
    #chat {
      height: 66vh;
      min-height: 420px;
      max-height: 82vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: #f9fbff;
      border: 1px solid #e4ebf5;
      border-radius: 10px;
      resize: vertical;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .item.self {
      justify-content: flex-end;
    }
    .bubble {
      max-width: min(92%, 820px);
      border-radius: 10px;
      border: 1px solid #dce6f3;
      background: #fff;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-text {
      background: #ffffff;
      border-color: #dce6f3;
    }
    .bubble-self-text {
      background: #e9f8ea;
      border-color: #b7dfbb;
    }
    .bubble-file {
      background: #fff6e8;
      border-color: #f0d3a2;
    }
    .item.is-media-active .bubble {
      border-color: #7ba7ff;
      box-shadow: 0 0 0 3px rgba(29, 114, 255, .14);
    }
    .bubble-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 4px;
    }
    .bubble-title {
      font-size: 13px;
      font-weight: 600;
      color: #44556f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bubble-copy-btn {
      padding: 4px 8px;
      font-size: 12px;
      min-height: auto;
      box-shadow: none;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
    .thumb {
      width: 260px;
      max-width: 100%;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #d8e2f0;
      background: #eef4fd;
    }
    .media-placeholder {
      width: min(100%, 520px);
      padding: 18px;
      border-radius: 10px;
      border: 1px dashed #c6d5ea;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fd 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      justify-content: center;
    }
    .media-placeholder.compact {
      width: 260px;
      max-width: 100%;
      min-height: 152px;
      margin-top: 8px;
      padding: 14px;
      cursor: pointer;
    }
    .media-placeholder strong {
      font-size: 14px;
      line-height: 1.4;
    }
    .media-placeholder small {
      color: var(--muted);
      line-height: 1.5;
    }
    .media-placeholder a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }
    .media-placeholder a:hover {
      text-decoration: underline;
    }
    .scroll-fab-group {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .scroll-fab {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      border-color: #cfd9eb;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid #ccd7e7;
      padding: 10px;
      outline: none;
      color: var(--text);
      background: #fff;
      font-size: 14px;
    }
    textarea:focus {
      border-color: #8fb0ea;
      box-shadow: 0 0 0 3px rgba(29, 114, 255, .1);
    }
    .hidden { display: none !important; }
    .footer-note { color: var(--muted); font-size: 12px; }

    .login-mask {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 38, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
    }
    .login-box {
      width: min(92vw, 360px);
      background: #fff;
      border: 1px solid #d9e4f2;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 27, 41, .25);
      z-index: 110;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 16px;
    }
    .task-dialog {
      width: min(960px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid #d8e2f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .task-head {
      padding: 12px;
      border-bottom: 1px solid #e1e9f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .task-list {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      border: 1px solid #dbe5f3;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    .task-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .task-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-status { color: var(--muted); }
    .progress {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e6eefb;
      overflow: hidden;
      margin: 8px 0;
    }
    .bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #4f8cff, #5fb5ff);
      transition: width .2s ease;
    }
    .task-grid {
      display: grid;
      gap: 6px 14px;
      grid-template-columns: repeat(3, minmax(130px, 1fr));
      font-size: 12px;
      color: var(--muted);
    }

    #manageTools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .media-viewer {
      position: fixed;
      inset: 0;
      background: rgba(12, 20, 32, .78);
      z-index: 130;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .media-dialog {
      width: min(980px, 100%);
      max-height: 90vh;
      background: #fff;
      border-radius: 14px;
      border: 1px solid #d4e1f2;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      outline: none;
    }
    .media-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .media-stage {
      flex: 1;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f6fd;
      border: 1px solid #e0e9f7;
      border-radius: 10px;
      overflow: hidden;
    }
    .media-stage img,
    .media-stage video {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      background: #f2f6fd;
    }
    .media-stage .media-placeholder {
      min-height: 240px;
      margin: 18px;
    }

    @media (max-width: 768px) {
      .page { padding: 8px; gap: 8px; }
      #chat {
        height: 58vh;
        min-height: 320px;
      }
      .task-overlay { padding: 0; }
      .task-dialog {
        width: 100%;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
      .task-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
      .scroll-fab-group {
        right: 8px;
      }
      button, input[type="file"], select {
        min-height: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="login-mask" id="loginMask">
    <div class="login-box">
      <strong>进入 FastFile 云端传输助手</strong>
      <input id="passwordInput" type="password" placeholder="请输入密码" autocomplete="off" />
      <label class="footer-note" style="display:flex; align-items:center; gap:8px;">
        <input id="rememberPassword" type="checkbox" />
        记住密码（仅本地浏览器）
      </label>
      <button id="loginBtn" class="primary">登录</button>
      <div id="loginError" class="footer-note"></div>
    </div>
  </div>

  <div class="task-overlay hidden" id="uploadTaskOverlay">
    <div class="task-dialog">
      <div class="task-head">
        <strong>上传任务</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="clearFinishedBtn">清理已完成</button>
          <button id="hideTaskPanelBtn">隐藏到后台</button>
        </div>
      </div>
      <div class="task-list" id="uploadTaskList"></div>
    </div>
  </div>

  <div class="media-viewer hidden" id="mediaViewer">
    <div class="media-dialog" id="mediaDialog" tabindex="0">
      <div class="media-head">
        <strong id="mediaViewerTitle">媒体预览</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="mediaPrevBtn">上一条</button>
          <button id="mediaNextBtn">下一条</button>
          <button id="mediaCloseBtn">关闭</button>
        </div>
      </div>
      <div class="media-stage" id="mediaStage"></div>
      <div class="footer-note" id="mediaViewerHint">提示：键盘 ↑/↓ 可切换上一条/下一条</div>
    </div>
  </div>

  <div class="page">
    <div class="topbar panel">
      <strong class="topbar-title">FastFile</strong>
      <div class="actions topbar-actions" id="normalActions">
        <button id="uploadTasksBtn">上传任务</button>
        <button id="manageBtn" class="success">管理</button>
        <button id="refreshBtn">刷新</button>
      </div>
      <div class="actions manage-actions hidden" id="manageActions">
        <button id="exitManageBtn" class="warning">完成管理</button>
        <button id="selectAllBtn">全选</button>
        <button id="invertSelectBtn">反选</button>
        <label class="topbar-select">
          筛选
          <select id="filterSelect">
            <option value="all">全部</option>
            <option value="file">仅文件</option>
            <option value="text">仅文字</option>
          </select>
        </label>
        <button id="deleteBtn" class="danger">删除已勾选</button>
        <button id="resetSizeBtn">恢复默认大小</button>
        <button id="restartBtn" class="danger">重启服务</button>
        <button id="logoutBtn" class="danger">退出登录</button>
      </div>
    </div>

    <div class="panel chat-panel">
      <div id="chat"></div>
      <div class="scroll-fab-group hidden" id="scrollFabGroup">
        <button id="scrollTopBtn" class="scroll-fab" title="回到顶部">↑</button>
        <button id="scrollBottomBtn" class="scroll-fab" title="滑到底部">↓</button>
      </div>
    </div>

    <div class="panel">
      <textarea id="textInput" placeholder="输入要发送的文本（Enter 发送，Ctrl + Enter 换行）"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
        <div style="position:relative;">
          <button id="plusMenuBtn" title="上传菜单">＋</button>
          <div id="plusMenu" class="panel hidden" style="position:absolute; top:42px; left:0; min-width:180px; z-index:70; padding:8px;">
            <button id="pickImageBtn" style="width:100%; text-align:left; margin-bottom:6px;">图片上传</button>
            <button id="pickVideoBtn" style="width:100%; text-align:left;">视频上传</button>
          </div>
          <input id="imageUploadInput" type="file" accept="image/*" multiple class="hidden" />
          <input id="videoUploadInput" type="file" accept="video/*" multiple class="hidden" />
        </div>
        <button id="sendTextBtn" class="primary">发送文本</button>
      </div>
      <div class="footer-note" style="margin-top:8px;">支持直接粘贴图片到输入框自动上传。</div>
    </div>

    <div class="panel">
      <input id="fileInput" type="file" multiple />
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
        <button id="sendFileBtn" class="primary">上传文件</button>
      </div>
      <div class="footer-note" style="margin-top:8px;">
        支持多文件、断点续传、实时进度。任务可隐藏到后台继续执行。
      </div>
    </div>
  </div>

  <script>
    const loginMask = document.getElementById('loginMask');
    const loginBtn = document.getElementById('loginBtn');
    const passwordInput = document.getElementById('passwordInput');
    const rememberPassword = document.getElementById('rememberPassword');
    const loginError = document.getElementById('loginError');

    const chat = document.getElementById('chat');
    const normalActions = document.getElementById('normalActions');
    const manageActions = document.getElementById('manageActions');
    const refreshBtn = document.getElementById('refreshBtn');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const plusMenuBtn = document.getElementById('plusMenuBtn');
    const plusMenu = document.getElementById('plusMenu');
    const pickImageBtn = document.getElementById('pickImageBtn');
    const pickVideoBtn = document.getElementById('pickVideoBtn');
    const imageUploadInput = document.getElementById('imageUploadInput');
    const videoUploadInput = document.getElementById('videoUploadInput');
    const sendFileBtn = document.getElementById('sendFileBtn');
    const textInput = document.getElementById('textInput');
    const fileInput = document.getElementById('fileInput');

    const restartBtn = document.getElementById('restartBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const manageBtn = document.getElementById('manageBtn');
    const exitManageBtn = document.getElementById('exitManageBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const invertSelectBtn = document.getElementById('invertSelectBtn');
    const filterSelect = document.getElementById('filterSelect');
    const deleteBtn = document.getElementById('deleteBtn');
    const resetSizeBtn = document.getElementById('resetSizeBtn');

    const uploadTasksBtn = document.getElementById('uploadTasksBtn');
    const uploadTaskOverlay = document.getElementById('uploadTaskOverlay');
    const uploadTaskList = document.getElementById('uploadTaskList');
    const hideTaskPanelBtn = document.getElementById('hideTaskPanelBtn');
    const clearFinishedBtn = document.getElementById('clearFinishedBtn');

    const mediaViewer = document.getElementById('mediaViewer');
    const mediaDialog = document.getElementById('mediaDialog');
    const mediaStage = document.getElementById('mediaStage');
    const mediaViewerTitle = document.getElementById('mediaViewerTitle');
    const mediaPrevBtn = document.getElementById('mediaPrevBtn');
    const mediaNextBtn = document.getElementById('mediaNextBtn');
    const mediaCloseBtn = document.getElementById('mediaCloseBtn');
    const scrollFabGroup = document.getElementById('scrollFabGroup');
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const scrollBottomBtn = document.getElementById('scrollBottomBtn');

    let token = '';
    let allMessages = [];
    let manageMode = false;
    let currentFilter = 'all';
    const selectedIds = new Set();

    let restartArmed = false;
    let restartArmTimer = null;
    let logoutArmed = false;
    let logoutArmTimer = null;
    let deleteArmed = false;
    let deleteArmTimer = null;

    const uploadTasks = new Map();
    let uploadTaskSeq = 1;
    const REMEMBER_PASSWORD_KEY = 'fastfile.remember_password';
    const SELF_MESSAGE_IDS_KEY = 'fastfile.self_message_ids';
    const DEFAULT_CHAT_HEIGHT = '66vh';
    const DEFAULT_INPUT_HEIGHT = '110px';
    let mediaList = [];
    let mediaIndex = -1;
    let lastAppliedSnapshot = '';
    let pendingMessages = null;
    let pendingSnapshot = '';
    let pollingInFlight = false;
    let scrollAnimationFrame = 0;
    const selfMessageIds = new Set();
    const mediaProgressCache = new Map();
    const mediaCompatibilityCache = new Map();
    let uiStateSaveTimer = 0;
    let suppressUiResizeSave = false;
    let videoProgressSaveTimer = 0;

    const SCROLL_EDGE_THRESHOLD = 24;
    const SMOOTH_SCROLL_DURATION = 1500;

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      return `${(n / 1024 / 1024 / 1024).toFixed(2)} GB`;
    }

    function formatDuration(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '--';
      const s = Math.floor(sec % 60);
      const m = Math.floor((sec / 60) % 60);
      const h = Math.floor(sec / 3600);
      return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    }

    function formatSpeed(bps) {
      if (!bps || !Number.isFinite(bps) || bps <= 0) return '--';
      return `${formatBytes(bps)}/s`;
    }

    function taskStatusText(status) {
      const map = {
        queued: '排队中',
        uploading: '上传中',
        retrying: '重试中',
        done: '完成',
        error: '失败',
        cancelled: '已取消'
      };
      return map[status] || status;
    }

    function snapshotMessages(messages) {
      return JSON.stringify((messages || []).map((m) => [
        m.id,
        m.kind,
        m.text,
        m.created_at,
        m.file_id,
        m.file_name,
        m.file_size,
        m.mime_type,
      ]));
    }

    function getBubbleVariant(msg) {
      if (msg.kind === 'text') {
        return isSelfMessage(msg.id) ? 'bubble-self-text' : 'bubble-text';
      }
      return 'bubble-file';
    }

    function loadSelfMessageIds() {
      selfMessageIds.clear();
      try {
        const raw = sessionStorage.getItem(SELF_MESSAGE_IDS_KEY);
        const ids = JSON.parse(raw || '[]');
        ids.forEach((id) => {
          selfMessageIds.add(Number(id));
        });
      } catch (_) {}
    }

    function saveSelfMessageIds() {
      try {
        sessionStorage.setItem(SELF_MESSAGE_IDS_KEY, JSON.stringify(Array.from(selfMessageIds)));
      } catch (_) {}
    }

    function markMessageAsSelf(id) {
      if (!Number.isFinite(Number(id))) return;
      selfMessageIds.add(Number(id));
      saveSelfMessageIds();
    }

    function isSelfMessage(id) {
      return selfMessageIds.has(Number(id));
    }

    function isChatNearTop() {
      return chat.scrollTop <= SCROLL_EDGE_THRESHOLD;
    }

    function isChatNearBottom() {
      return chat.scrollHeight - chat.clientHeight - chat.scrollTop <= SCROLL_EDGE_THRESHOLD;
    }

    function shouldDeferMessageRender() {
      return !isChatNearBottom();
    }

    function updateRefreshButtonState() {
      refreshBtn.textContent = pendingMessages ? '刷新（有更新）' : '刷新';
    }

    function updateScrollButtonState() {
      const shouldShow = !loginMask.classList.contains('hidden');
      scrollFabGroup.classList.toggle('hidden', shouldShow);
      scrollTopBtn.disabled = isChatNearTop();
      scrollBottomBtn.disabled = isChatNearBottom();
    }

    function applyUiState({ chat_height_px, input_height_px }) {
      suppressUiResizeSave = true;
      chat.style.height = chat_height_px ? `${chat_height_px}px` : DEFAULT_CHAT_HEIGHT;
      textInput.style.height = input_height_px ? `${input_height_px}px` : DEFAULT_INPUT_HEIGHT;
      updateScrollButtonState();
      setTimeout(() => {
        suppressUiResizeSave = false;
      }, 0);
    }

    async function fetchUiState() {
      return api('/api/ui-state');
    }

    async function saveUiState(partial) {
      if (!token) return;
      await api('/api/ui-state', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(partial),
      });
    }

    function scheduleUiStateSave() {
      if (suppressUiResizeSave || !token) return;
      if (uiStateSaveTimer) clearTimeout(uiStateSaveTimer);
      uiStateSaveTimer = setTimeout(() => {
        saveUiState({
          chat_height_px: Math.round(chat.getBoundingClientRect().height),
          input_height_px: Math.round(textInput.getBoundingClientRect().height),
        }).catch(() => {});
      }, 400);
    }

    async function restoreDefaultUiState() {
      await api('/api/ui-state/reset', { method: 'POST' });
      applyUiState({ chat_height_px: null, input_height_px: null });
    }

    async function fetchVideoProgress(fileId) {
      if (mediaProgressCache.has(fileId)) {
        return mediaProgressCache.get(fileId);
      }
      const result = await api(`/api/video-progress/${encodeURIComponent(fileId)}`);
      const value = Number(result.position_seconds || 0);
      mediaProgressCache.set(fileId, value);
      return value;
    }

    async function saveVideoProgress(fileId, positionSeconds) {
      if (!token || !fileId) return;
      const safePosition = Math.max(0, Number(positionSeconds || 0));
      mediaProgressCache.set(fileId, safePosition);
      await api(`/api/video-progress/${encodeURIComponent(fileId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ position_seconds: safePosition }),
      });
    }

    function getMediaCacheKey(item) {
      return item?.file_id || item?.file_url || item?.download_url || item?.file_name || '';
    }

    function getMediaCompatibility(item) {
      const key = getMediaCacheKey(item);
      return key ? mediaCompatibilityCache.get(key) || null : null;
    }

    function setMediaCompatibility(item, payload) {
      const key = getMediaCacheKey(item);
      if (!key) return;
      mediaCompatibilityCache.set(key, payload);
    }

    function getFileExtension(name) {
      const raw = String(name || '');
      const pos = raw.lastIndexOf('.');
      return pos >= 0 ? raw.slice(pos + 1).toLowerCase() : '';
    }

    function buildUnsupportedMessage(kind, item) {
      const ext = getFileExtension(item?.file_name);
      if (kind === 'video') {
        return `当前浏览器无法纯前端解码这个${ext ? ` ${ext.toUpperCase()}` : ''}视频，继续播放只会出现有声音没画面。`;
      }
      return `当前浏览器无法纯前端预览这个${ext ? ` ${ext.toUpperCase()}` : ''}图片格式。`;
    }

    function createMediaPlaceholder(item, message, compact = false) {
      const box = document.createElement('div');
      box.className = `media-placeholder${compact ? ' compact thumb' : ''}`;

      const title = document.createElement('strong');
      title.textContent = item?.file_name || (compact ? '媒体预览不可用' : '媒体无法预览');
      box.appendChild(title);

      const desc = document.createElement('small');
      desc.textContent = message;
      box.appendChild(desc);

      if (item?.download_url) {
        const link = document.createElement('a');
        link.href = item.download_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '下载原文件';
        box.appendChild(link);
      }

      return box;
    }

    function showUnsupportedMedia(item, kind) {
      mediaStage.innerHTML = '';
      mediaStage.appendChild(createMediaPlaceholder(item, buildUnsupportedMessage(kind, item), false));
    }

    function replaceThumbWithPlaceholder(node, item, kind) {
      const placeholder = createMediaPlaceholder(item, buildUnsupportedMessage(kind, item), true);
      placeholder.title = '点击查看详情';
      placeholder.onclick = () => openMediaByMessageId(item.id).catch(() => {});
      node.replaceWith(placeholder);
    }

    function attachImageCompatibility(img, item, compact = false) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'image' && cached.supported === false) {
        if (compact) replaceThumbWithPlaceholder(img, item, 'image');
        else showUnsupportedMedia(item, 'image');
        return;
      }

      img.addEventListener('load', () => {
        setMediaCompatibility(item, { kind: 'image', supported: true });
      }, { once: true });

      img.addEventListener('error', () => {
        setMediaCompatibility(item, { kind: 'image', supported: false });
        if (compact) replaceThumbWithPlaceholder(img, item, 'image');
        else showUnsupportedMedia(item, 'image');
      }, { once: true });
    }

    function attachVideoCompatibility(video, item, compact = false) {
      const cached = getMediaCompatibility(item);
      if (cached?.kind === 'video' && cached.supported === false) {
        if (compact) replaceThumbWithPlaceholder(video, item, 'video');
        else showUnsupportedMedia(item, 'video');
        return;
      }

      let resolved = false;
      const markSupported = () => {
        if (resolved) return true;
        if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return false;
        resolved = true;
        setMediaCompatibility(item, { kind: 'video', supported: true });
        return true;
      };

      const markUnsupported = () => {
        if (resolved) return;
        resolved = true;
        setMediaCompatibility(item, { kind: 'video', supported: false });
        video.pause();
        if (compact) replaceThumbWithPlaceholder(video, item, 'video');
        else showUnsupportedMedia(item, 'video');
      };

      video.addEventListener('loadedmetadata', () => {
        if (markSupported()) {
          if (compact) {
            const previewTime = Math.min(0.08, Math.max(0.001, (video.duration || 0) / 4));
            if (previewTime > 0) {
              try {
                video.currentTime = previewTime;
              } catch (_) {}
            }
          }
          return;
        }
        markUnsupported();
      }, { once: true });

      if (compact) {
        video.addEventListener('seeked', () => {
          video.pause();
        });
      } else {
        video.addEventListener('timeupdate', () => {
          if ((video.currentTime || 0) > 0.35 && !markSupported()) {
            markUnsupported();
          }
        });
      }

      video.addEventListener('error', () => {
        markUnsupported();
      }, { once: true });
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2;
    }

    function animateChatScroll(target, duration = SMOOTH_SCROLL_DURATION) {
      if (scrollAnimationFrame) cancelAnimationFrame(scrollAnimationFrame);
      const start = chat.scrollTop;
      const maxTarget = Math.max(0, chat.scrollHeight - chat.clientHeight);
      const finalTarget = Math.max(0, Math.min(target, maxTarget));
      const delta = finalTarget - start;
      if (Math.abs(delta) < 1) {
        chat.scrollTop = finalTarget;
        updateScrollButtonState();
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        const startedAt = performance.now();
        const step = (now) => {
          const progress = Math.min(1, (now - startedAt) / duration);
          chat.scrollTop = start + delta * easeInOutCubic(progress);
          updateScrollButtonState();
          if (progress < 1) {
            scrollAnimationFrame = requestAnimationFrame(step);
          } else {
            scrollAnimationFrame = 0;
            resolve();
          }
        };
        scrollAnimationFrame = requestAnimationFrame(step);
      });
    }

    function getVisibleMessages() {
      if (currentFilter === 'file') return allMessages.filter((m) => m.kind === 'file');
      if (currentFilter === 'text') return allMessages.filter((m) => m.kind === 'text');
      return allMessages;
    }

    async function api(path, options = {}) {
      const cfg = { ...options };
      cfg.headers = { ...(options.headers || {}) };
      if (token) cfg.headers.Authorization = `Bearer ${token}`;

      const res = await fetch(path, cfg);
      if (res.status === 401) {
        token = '';
        loginMask.classList.remove('hidden');
        throw new Error('未授权');
      }
      if (!res.ok) {
        let msg = `请求失败: ${res.status}`;
        try {
          const j = await res.json();
          if (j.error) msg = j.error;
        } catch (_) {}
        throw new Error(msg);
      }
      return res.json();
    }

    function renderMessage(msg) {
      const row = document.createElement('div');
      row.className = 'item';
      if (isSelfMessage(msg.id)) {
        row.classList.add('self');
      }
      row.dataset.messageId = String(msg.id);
      if (msg.id === getCurrentMediaMessageId()) {
        row.classList.add('is-media-active');
      }

      if (manageMode) {
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = selectedIds.has(msg.id);
        check.onchange = () => {
          if (check.checked) selectedIds.add(msg.id);
          else selectedIds.delete(msg.id);
        };
        row.appendChild(check);
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${getBubbleVariant(msg)}`;

      if (msg.kind === 'text') {
        const textValue = msg.text || '';
        const head = document.createElement('div');
        head.className = 'bubble-head';

        const spacer = document.createElement('div');
        spacer.className = 'bubble-title';
        spacer.textContent = '文本';
        spacer.style.visibility = 'hidden';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'bubble-copy-btn';
        copyBtn.textContent = '复制';
        copyBtn.onclick = async () => {
          try {
            await copyRawText(textValue);
            copyBtn.textContent = '已复制';
            setTimeout(() => {
              copyBtn.textContent = '复制';
            }, 1200);
          } catch (err) {
            alert(err.message || '复制失败');
          }
        };

        head.appendChild(spacer);
        head.appendChild(copyBtn);
        bubble.appendChild(head);

        const textBody = document.createElement('div');
        textBody.textContent = textValue;
        bubble.appendChild(textBody);
      } else {
        const head = document.createElement('div');
        head.className = 'bubble-head';
        const title = document.createElement('div');
        title.className = 'bubble-title';
        title.textContent = msg.file_name || '未命名文件';
        head.appendChild(title);
        bubble.appendChild(head);

        const links = document.createElement('div');
        links.className = 'meta';
        const direct = document.createElement('a');
        direct.href = msg.download_url;
        direct.target = '_blank';
        direct.rel = 'noopener noreferrer';
        direct.textContent = '直链下载';
        links.appendChild(direct);
        const size = document.createElement('span');
        size.textContent = ` · ${formatBytes(msg.file_size || 0)}`;
        links.appendChild(size);
        bubble.appendChild(links);

        if ((msg.mime_type || '').startsWith('image/')) {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = msg.file_url;
          img.alt = msg.file_name || 'image';
          img.style.cursor = 'pointer';
          img.title = '点击预览（支持上一条/下一条）';
          attachImageCompatibility(img, msg, true);
          img.onclick = () => openMediaByMessageId(msg.id).catch(() => {});
          bubble.appendChild(img);
        } else if ((msg.mime_type || '').startsWith('video/')) {
          const video = document.createElement('video');
          video.className = 'thumb';
          video.preload = 'auto';
          video.muted = true;
          video.playsInline = true;
          video.poster = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
          video.src = `${msg.file_url}#t=0.08`;
          video.style.cursor = 'pointer';
          video.title = '点击放大播放（支持上一条/下一条）';
          attachVideoCompatibility(video, msg, true);
          video.onclick = (e) => {
            e.preventDefault();
            video.pause();
            openMediaByMessageId(msg.id).catch(() => {});
          };
          bubble.appendChild(video);
        }
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = new Date(msg.created_at).toLocaleString();
      bubble.appendChild(meta);

      row.appendChild(bubble);
      return row;
    }

    function copyRawText(value) {
      if (navigator.clipboard?.writeText) {
        return navigator.clipboard.writeText(value);
      }

      const temp = document.createElement('textarea');
      temp.value = value;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(temp);
      if (!ok) {
        throw new Error('复制失败');
      }
      return Promise.resolve();
    }

    function renderMessages({ followBottom = false, preserveScroll = true } = {}) {
      const visible = getVisibleMessages();
      const previousScrollTop = chat.scrollTop;
      const existingRows = new Map(
        Array.from(chat.querySelectorAll('.item[data-message-id]')).map((row) => [Number(row.dataset.messageId), row])
      );

      for (const msg of visible) {
        const freshRow = renderMessage(msg);
        const currentRow = existingRows.get(msg.id);
        if (!currentRow) {
          chat.appendChild(freshRow);
          continue;
        }

        if (currentRow.outerHTML !== freshRow.outerHTML) {
          currentRow.replaceWith(freshRow);
        }
      }

      const visibleIds = visible.map((m) => m.id);
      for (const [id, row] of existingRows.entries()) {
        if (!visibleIds.includes(id)) {
          row.remove();
        }
      }

      const orderedRows = visible.map((m) => chat.querySelector(`.item[data-message-id="${m.id}"]`)).filter(Boolean);
      orderedRows.forEach((row) => {
        chat.appendChild(row);
      });

      if (manageMode) {
        orderedRows.forEach((row) => {
          const checkbox = row.querySelector('input[type="checkbox"]');
          if (checkbox) {
            checkbox.checked = selectedIds.has(Number(row.dataset.messageId));
          }
        });
      }

      syncMediaHistoryContext(false);

      if (followBottom) {
        chat.scrollTop = chat.scrollHeight;
      } else if (preserveScroll) {
        chat.scrollTop = Math.min(previousScrollTop, Math.max(0, chat.scrollHeight - chat.clientHeight));
      }

      updateScrollButtonState();
    }

    function buildMediaList() {
      mediaList = allMessages.filter((m) => {
        if (m.kind !== 'file') return false;
        const mt = m.mime_type || '';
        return mt.startsWith('image/') || mt.startsWith('video/');
      });
    }

    function getCurrentMediaMessageId() {
      if (mediaIndex < 0 || mediaIndex >= mediaList.length) return null;
      return mediaList[mediaIndex]?.id ?? null;
    }

    function syncMediaHistoryContext(shouldScroll = false) {
      const currentMessageId = getCurrentMediaMessageId();
      const rows = chat.querySelectorAll('.item[data-message-id]');
      rows.forEach((row) => {
        row.classList.toggle('is-media-active', Number(row.dataset.messageId) === currentMessageId);
      });

      if (!shouldScroll || currentMessageId == null) return;
      const activeRow = chat.querySelector(`.item[data-message-id="${currentMessageId}"]`);
      if (activeRow) {
        activeRow.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    async function showMediaAt(index) {
      if (!mediaList.length) return;
      if (index < 0 || index >= mediaList.length) return;

      await persistActiveVideoProgress();

      mediaIndex = index;
      const item = mediaList[mediaIndex];
      const mt = item.mime_type || '';
      mediaStage.innerHTML = '';

      if (mt.startsWith('image/')) {
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'image' && cached.supported === false) {
          showUnsupportedMedia(item, 'image');
        } else {
          const img = document.createElement('img');
          img.src = item.file_url;
          img.alt = item.file_name || 'image';
          attachImageCompatibility(img, item, false);
          mediaStage.appendChild(img);
        }
      } else {
        const cached = getMediaCompatibility(item);
        if (cached?.kind === 'video' && cached.supported === false) {
          showUnsupportedMedia(item, 'video');
        } else {
          const video = document.createElement('video');
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.addEventListener('play', () => pauseOtherVideos(video));
          if (item.file_id) {
            const savedPosition = await fetchVideoProgress(item.file_id);
            video.addEventListener('loadedmetadata', () => {
              if ((video.videoWidth || 0) > 0 && (video.videoHeight || 0) > 0 && savedPosition > 0 && savedPosition < video.duration) {
                video.currentTime = savedPosition;
              }
            }, { once: true });
            video.addEventListener('timeupdate', () => {
              if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return;
              if (videoProgressSaveTimer) clearTimeout(videoProgressSaveTimer);
              videoProgressSaveTimer = setTimeout(() => {
                saveVideoProgress(item.file_id, video.currentTime).catch(() => {});
              }, 500);
            });
            video.addEventListener('pause', () => {
              if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return;
              saveVideoProgress(item.file_id, video.currentTime).catch(() => {});
            });
          }
          attachVideoCompatibility(video, item, false);
          video.src = item.file_url;
          mediaStage.appendChild(video);
        }
      }

      mediaViewerTitle.textContent = `${item.file_name || '媒体文件'}（${mediaIndex + 1}/${mediaList.length}）`;
      mediaPrevBtn.disabled = mediaIndex <= 0;
      mediaNextBtn.disabled = mediaIndex >= mediaList.length - 1;
      mediaViewer.classList.remove('hidden');
      syncMediaHistoryContext(true);
      requestAnimationFrame(() => mediaDialog.focus());
    }

    async function openMediaByMessageId(messageId) {
      buildMediaList();
      const index = mediaList.findIndex((m) => m.id === messageId);
      if (index < 0) return;
      await showMediaAt(index);
    }

    async function closeMediaViewer() {
      await persistActiveVideoProgress();
      mediaViewer.classList.add('hidden');
      mediaStage.innerHTML = '';
      mediaIndex = -1;
      syncMediaHistoryContext(false);
    }

    async function switchMedia(delta) {
      if (mediaIndex < 0) return;
      const next = mediaIndex + delta;
      if (next < 0 || next >= mediaList.length) return;
      await showMediaAt(next);
    }

    function updateManageUi() {
      normalActions.classList.toggle('hidden', manageMode);
      manageActions.classList.toggle('hidden', !manageMode);
      if (!manageMode) {
        selectedIds.clear();
        resetDeleteButton();
        resetRestartButton();
        resetLogoutButton();
      }
      renderMessages({ preserveScroll: true });
    }

    function applyMessages(messages, { followBottom = false, preserveScroll = true } = {}) {
      allMessages = messages;
      buildMediaList();
      lastAppliedSnapshot = snapshotMessages(messages);
      pendingMessages = null;
      pendingSnapshot = '';
      updateRefreshButtonState();
      renderMessages({ followBottom, preserveScroll });
    }

    function flushPendingMessages({ followBottom = false } = {}) {
      if (!pendingMessages) return false;
      const queued = pendingMessages;
      applyMessages(queued, { followBottom, preserveScroll: !followBottom });
      return true;
    }

    async function loadMessages({ source = 'poll', followBottom = false, preserveScroll = true } = {}) {
      const incoming = await api('/api/messages');
      const incomingSnapshot = snapshotMessages(incoming);
      if (incomingSnapshot === pendingSnapshot || incomingSnapshot === lastAppliedSnapshot) {
        return;
      }

      if (source === 'poll' && shouldDeferMessageRender()) {
        pendingMessages = incoming;
        pendingSnapshot = incomingSnapshot;
        updateRefreshButtonState();
        return;
      }

      applyMessages(incoming, { followBottom, preserveScroll });
    }

      try {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });
        token = data.token;
        try {
          if (rememberPassword.checked) {
            localStorage.setItem(REMEMBER_PASSWORD_KEY, passwordInput.value);

            localStorage.removeItem(REMEMBER_PASSWORD_KEY);
          }
        } catch (_) {}
        passwordInput.value = '';
        loadSelfMessageIds();
        loginMask.classList.add('hidden');
        const uiState = await fetchUiState();
        applyUiState(uiState);
        await loadMessages({ source: 'login', followBottom: true, preserveScroll: false });
        updateScrollButtonState();
      } catch (err) {
        loginError.textContent = err.message;
      }
    }

    function resetLogoutButton() {
      logoutArmed = false;
      logoutBtn.textContent = '退出登录';
      if (logoutArmTimer) {
        clearTimeout(logoutArmTimer);
        logoutArmTimer = null;
      }
    }

    async function handleLogoutClick() {
      if (!logoutArmed) {
        logoutArmed = true;
        logoutBtn.textContent = '二次确认退出（5秒）';

    async function sendText() {
      const text = textInput.value;
      if (!text) return;
      const created = await api('/api/messages/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      markMessageAsSelf(created.id);
      textInput.value = '';
      await loadMessages({ source: 'send-text', followBottom: true, preserveScroll: false });
      await animateChatScroll(chat.scrollHeight - chat.clientHeight, 320);

    function openUploadTasksPanel() {
      uploadTaskOverlay.classList.remove('hidden');
      renderUploadTasks();
    }

    function hideUploadTasksPanel() {
      uploadTaskOverlay.classList.add('hidden');
    }

    function makeFileKey(file) {
      return `${file.name}::${file.size}::${file.lastModified}::${file.type}`;
    }

    function normalizeUploadFile(file) {
      if (file.name?.trim()) return file;
      const ext = (file.type || '').split('/')[1] || 'bin';
      return new File([file], `upload-${Date.now()}.${ext}`, {
        type: file.type || 'application/octet-stream'
      });
    }

    function createTask(file) {
      const id = uploadTaskSeq++;
      const now = Date.now();
      return {
        id,
        file,
        fileKey: makeFileKey(file),
        name: file.name,
        totalBytes: file.size,
        uploadedBytes: 0,
        uploadId: '',
        status: 'queued',
        startedAt: now,
        completedAt: null,
        lastSampleAt: now,
        lastSampleBytes: 0,
        speedBps: 0,
        etaSec: null,
        error: '',
        retries: 0,
        controllers: new Set(),
        chunks: [],
      };
    }

    function elapsedSec(task) {
      const end = task.completedAt || Date.now();
      return Math.max(0, (end - task.startedAt) / 1000);
    }

    function updateTaskSpeed(task, uploadedDelta = 0) {
      const now = Date.now();
      task.samples = (task.samples || []).filter((sample) => now - sample.at <= 4000);
      if (uploadedDelta > 0) {
        task.samples.push({ at: now, bytes: uploadedDelta });
      }
      const windowMs = task.samples.length ? Math.max(400, now - task.samples[0].at) : Math.max(400, now - task.startedAt);
      const windowBytes = task.samples.reduce((sum, sample) => sum + sample.bytes, 0);
      task.speedBps = windowBytes > 0 ? windowBytes / (windowMs / 1000) : 0;
      const remain = task.totalBytes - task.uploadedBytes;
      task.etaSec = task.speedBps > 1 ? remain / task.speedBps : null;
      task.lastSampleAt = now;
      task.lastSampleBytes = task.uploadedBytes;
    }

    async function sha256Hex(blob) {
      const buffer = await blob.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function pauseOtherVideos(currentVideo) {
      document.querySelectorAll('video').forEach((video) => {
        if (video !== currentVideo) {
          video.pause();
        }
      });
    }

    async function persistActiveVideoProgress() {
      const item = mediaList[mediaIndex];
      const activeVideo = mediaStage.querySelector('video');
      if (!item || !activeVideo || !(item.mime_type || '').startsWith('video/')) return;
      await saveVideoProgress(item.file_id, activeVideo.currentTime || 0);
    }

    function buildChunkPlan(task, chunkSize, completedParts) {
      const doneMap = new Map();
      for (const part of completedParts || []) {
        doneMap.set(Number(part.start_byte), {
          start: Number(part.start_byte),
          end: Number(part.end_byte),
          checksum: part.checksum,
          done: true,
        });
      }

      const plan = [];
      for (let start = 0; start < task.totalBytes; start += chunkSize) {
        const end = Math.min(task.totalBytes, start + chunkSize);
        const existing = doneMap.get(start);
        plan.push({
          start,
          end,
          checksum: existing?.checksum || '',
          done: Boolean(existing && existing.end === end),
          inflight: false,
        });
      }
      return plan;
    }

    function renderUploadTasks() {
      if (!uploadTasks.size) {
        uploadTaskList.innerHTML = '<div class="footer-note">暂无上传任务</div>';
        return;
      }

      const list = Array.from(uploadTasks.values()).sort((a, b) => b.id - a.id);
      uploadTaskList.innerHTML = '';
      for (const t of list) {
        const card = document.createElement('div');
        card.className = 'task-card';
        const progress = t.totalBytes > 0 ? Math.min(100, (t.uploadedBytes / t.totalBytes) * 100) : 0;
        const elapsed = elapsedSec(t);
        const remain = t.etaSec;
        const totalEstimate = Number.isFinite(remain) ? elapsed + remain : null;

        card.innerHTML = `
          <div class="task-title">
            <div class="task-name" title="${t.name}">${t.name}</div>
            <div class="task-status">${taskStatusText(t.status)}</div>
          </div>
          <div class="progress"><div class="bar" style="width:${progress.toFixed(2)}%"></div></div>
          <div class="task-grid">
            <div>进度：${progress.toFixed(1)}%</div>
            <div>已上传：${formatBytes(t.uploadedBytes)}</div>
            <div>总大小：${formatBytes(t.totalBytes)}</div>
            <div>目前耗时：${formatDuration(elapsed)}</div>
            <div>预计剩余：${remain == null ? '--' : formatDuration(remain)}</div>
            <div>预计总耗时：${totalEstimate == null ? '--' : formatDuration(totalEstimate)}</div>
            <div>当前速度：${formatSpeed(t.speedBps)}</div>
          </div>
        `;

        if (t.error) {
          const err = document.createElement('div');
          err.className = 'footer-note';
          err.style.color = '#c43434';
          err.textContent = `错误：${t.error}`;
          card.appendChild(err);
        }

        if (t.status === 'uploading' || t.status === 'retrying' || t.status === 'queued') {
          const cancel = document.createElement('button');
          cancel.className = 'danger';
          cancel.textContent = '取消上传';
          cancel.onclick = () => cancelTask(t.id);
          cancel.style.marginTop = '8px';
          card.appendChild(cancel);
        }

        uploadTaskList.appendChild(card);
      }
    }

    async function cancelTask(taskId) {
      const task = uploadTasks.get(taskId);
      if (!task) return;
      task.status = 'cancelled';
      task.controllers.forEach((controller) => {
        controller.abort();
      });
      task.controllers.clear();
      if (task.uploadId) {
        try {
          await api('/api/uploads/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ upload_id: task.uploadId })
          });
        } catch (_) {}
      }
      renderUploadTasks();
    }

    async function processUploadTask(task) {
      const CHUNK_FALLBACK = 4 * 1024 * 1024;
      let chunkSize = CHUNK_FALLBACK;
      let parallelLimit = 4;

      try {
        const init = await api('/api/uploads/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_key: task.fileKey,
            file_name: task.file.name,
            file_size: task.file.size,
            mime_type: task.file.type || null,
          })
        });

        task.uploadId = init.upload_id;
        chunkSize = Number(init.chunk_size || CHUNK_FALLBACK);
        parallelLimit = Number(init.parallel_limit || 4);
        task.chunks = buildChunkPlan(task, chunkSize, init.completed_parts || []);
        task.uploadedBytes = task.chunks
          .filter((chunk) => chunk.done)
          .reduce((sum, chunk) => sum + (chunk.end - chunk.start), 0);
        task.status = 'uploading';
        updateTaskSpeed(task, 0);
        renderUploadTasks();

        const uploadChunk = async (chunk) => {
          while (!chunk.done) {
            if (task.status === 'cancelled') return;
            const blob = task.file.slice(chunk.start, chunk.end);
            const controller = new AbortController();
            task.controllers.add(controller);

            try {
              chunk.checksum = chunk.checksum || await sha256Hex(blob);
              const chunkResp = await api('/api/uploads/chunk', {
                method: 'POST',
                headers: {
                  'X-Upload-Id': task.uploadId,
                  'X-Start-Byte': String(chunk.start),
                  'X-Chunk-Sha256': chunk.checksum,
                },
                body: blob,
                signal: controller.signal,
              });

              chunk.done = true;
              chunk.inflight = false;
              task.controllers.delete(controller);
              task.uploadedBytes = Number(chunkResp.received_bytes || task.uploadedBytes);
              task.retries = 0;
              task.status = 'uploading';
              task.error = '';
              updateTaskSpeed(task, chunk.end - chunk.start);
              renderUploadTasks();
            } catch (err) {
              task.controllers.delete(controller);
              chunk.inflight = false;
              if (task.status === 'cancelled') return;
              task.retries += 1;
              if (task.retries > 5) throw err;

              task.status = 'retrying';
              task.error = `网络波动，重试第 ${task.retries} 次`;
              renderUploadTasks();
              await new Promise((r) => setTimeout(r, Math.min(1600, 250 * task.retries)));

              const resumed = await api('/api/uploads/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  file_key: task.fileKey,
                  file_name: task.file.name,
                  file_size: task.file.size,
                  mime_type: task.file.type || null,
                })
              });
              task.uploadId = resumed.upload_id;
              task.chunks = buildChunkPlan(task, chunkSize, resumed.completed_parts || []).map((nextChunk) => {
                const current = task.chunks.find((item) => item.start === nextChunk.start);
                return current?.done ? { ...current, done: true } : nextChunk;
              });
              task.uploadedBytes = Number(resumed.received_bytes || task.uploadedBytes);
            }
          }
        };

        const workers = Array.from({ length: Math.max(1, parallelLimit) }, async () => {
          while (true) {
            if (task.status === 'cancelled') return;
            const nextChunk = task.chunks.find((chunk) => !chunk.done && !chunk.inflight);
            if (!nextChunk) return;
            nextChunk.inflight = true;
            await uploadChunk(nextChunk);
          }
        });

        await Promise.all(workers);
        if (task.status === 'cancelled') return;

        const completed = await api('/api/uploads/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ upload_id: task.uploadId })
        });
        markMessageAsSelf(completed.id);

        task.status = 'done';
        task.completedAt = Date.now();
        task.error = '';
        task.controllers.clear();
        updateTaskSpeed(task, 0);
        renderUploadTasks();
        await loadMessages({ source: 'upload-complete', followBottom: isChatNearBottom(), preserveScroll: !isChatNearBottom() });
      } catch (err) {
        if (task.status !== 'cancelled') {
          task.status = 'error';
          task.error = err?.message || String(err);
          task.completedAt = Date.now();
          renderUploadTasks();
        }
      }
    }

    async function enqueueFiles(rawFiles) {
      const files = Array.from(rawFiles || []).map(normalizeUploadFile);
      if (!files.length) return;

      openUploadTasksPanel();
      for (const file of files) {
        const task = createTask(file);
        uploadTasks.set(task.id, task);
        renderUploadTasks();
        processUploadTask(task);
      }
    }

    async function sendFiles() {
      const files = Array.from(fileInput.files || []);
      await enqueueFiles(files);
      fileInput.value = '';
    }

    function resetRestartButton() {
      restartArmed = false;
      restartBtn.textContent = '重启服务';
      if (restartArmTimer) {
        clearTimeout(restartArmTimer);
        restartArmTimer = null;
      }
    }

    async function handleRestartClick() {
      if (!restartArmed) {
        restartArmed = true;
        restartBtn.textContent = '二次确认重启（5秒）';
        restartArmTimer = setTimeout(resetRestartButton, 5000);
        return;
      }
      const result = await api('/api/admin/restart', { method: 'POST' });
      restartBtn.disabled = true;
      restartBtn.textContent = '正在重启...';
      alert(result.message || '重启请求已发送');
    }

    function resetDeleteButton() {
      deleteArmed = false;
      deleteBtn.textContent = '删除已勾选';
      if (deleteArmTimer) {
        clearTimeout(deleteArmTimer);
        deleteArmTimer = null;
      }
    }

    async function deleteSelected() {
      if (!selectedIds.size) {
        alert('请先勾选要删除的记录');
        return;
      }
      const deletingIds = new Set(selectedIds);
      allMessages
        .filter((msg) => deletingIds.has(msg.id) && msg.file_id)
        .forEach((msg) => {
          mediaProgressCache.delete(msg.file_id);
          mediaCompatibilityCache.delete(msg.file_id);
        });
      await api('/api/messages', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: Array.from(selectedIds) })
      });
      selectedIds.clear();
      resetDeleteButton();
      await loadMessages({ source: 'delete', followBottom: false, preserveScroll: true });
    }

    async function handleDeleteClick() {
      if (!deleteArmed) {
        deleteArmed = true;
        deleteBtn.textContent = '二次确认删除（5秒）';
        deleteArmTimer = setTimeout(resetDeleteButton, 5000);
        return;
      }
      await deleteSelected();
    }

    function selectAllVisible() {
      for (const m of getVisibleMessages()) selectedIds.add(m.id);
      renderMessages({ preserveScroll: true });
    }

    function invertVisible() {
      for (const m of getVisibleMessages()) {
        if (selectedIds.has(m.id)) selectedIds.delete(m.id);
        else selectedIds.add(m.id);
      }
      renderMessages({ preserveScroll: true });
    }

    loginBtn.onclick = login;
    logoutBtn.onclick = () => handleLogoutClick().catch((e) => {
      resetLogoutButton();
      alert(e.message);
    });
    refreshBtn.onclick = () => {
      if (flushPendingMessages({ followBottom: isChatNearBottom() })) return;
      loadMessages({ source: 'manual-refresh', followBottom: isChatNearBottom(), preserveScroll: !isChatNearBottom() }).catch((e) => alert(e.message));
    };
    sendTextBtn.onclick = () => sendText().catch((e) => alert(e.message));
    sendFileBtn.onclick = () => sendFiles().catch((e) => alert(e.message));

    plusMenuBtn.onclick = () => {
      plusMenu.classList.toggle('hidden');
    };
    pickImageBtn.onclick = () => imageUploadInput.click();
    pickVideoBtn.onclick = () => videoUploadInput.click();
    imageUploadInput.onchange = () => {
      enqueueFiles(imageUploadInput.files).catch((e) => alert(e.message));
      imageUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };
    videoUploadInput.onchange = () => {
      enqueueFiles(videoUploadInput.files).catch((e) => alert(e.message));
      videoUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };

    restartBtn.onclick = () => handleRestartClick().catch((e) => {
      resetRestartButton();
      alert(e.message);
    });

    manageBtn.onclick = () => {
      manageMode = !manageMode;
      updateManageUi();
    };
    exitManageBtn.onclick = () => {
      manageMode = false;
      updateManageUi();
    };

    deleteBtn.onclick = () => handleDeleteClick().catch((e) => alert(e.message));
    resetSizeBtn.onclick = () => restoreDefaultUiState().catch((e) => alert(e.message));
    selectAllBtn.onclick = selectAllVisible;
    invertSelectBtn.onclick = invertVisible;
    filterSelect.onchange = () => {
      currentFilter = filterSelect.value;
      renderMessages({ preserveScroll: true });
    };

    uploadTasksBtn.onclick = openUploadTasksPanel;
    hideTaskPanelBtn.onclick = hideUploadTasksPanel;
    clearFinishedBtn.onclick = () => {
      for (const [id, t] of uploadTasks.entries()) {
        if (t.status === 'done' || t.status === 'cancelled' || t.status === 'error') {
          uploadTasks.delete(id);
        }
      }
      renderUploadTasks();
    };

    textInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const start = textInput.selectionStart ?? textInput.value.length;
        const end = textInput.selectionEnd ?? textInput.value.length;
        textInput.value = `${textInput.value.slice(0, start)}\n${textInput.value.slice(end)}`;
        textInput.selectionStart = textInput.selectionEnd = start + 1;
        return;
      }
      if (!e.shiftKey) {
        e.preventDefault();
        sendText().catch((err) => alert(err.message));
      }
    });

    textInput.addEventListener('paste', (e) => {
      const items = Array.from(e.clipboardData?.items || []);
      const images = [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) images.push(file);
        }
      }
      if (images.length) {
        e.preventDefault();
        enqueueFiles(images).catch((err) => alert(err.message));
      }
    });

    chat.addEventListener('scroll', () => {
      updateScrollButtonState();
      if (pendingMessages && isChatNearBottom()) {
        flushPendingMessages({ followBottom: true });
      }
    });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    try {
      const cached = localStorage.getItem(REMEMBER_PASSWORD_KEY);
      if (cached) {
        passwordInput.value = cached;
        rememberPassword.checked = true;
        setTimeout(() => {
          login().catch(() => {});
        }, 0);
      }
    } catch (_) {}

    const resizeObserver = new ResizeObserver(() => {
      scheduleUiStateSave();
      updateScrollButtonState();
    });
    resizeObserver.observe(chat);
    resizeObserver.observe(textInput);

    mediaPrevBtn.onclick = () => switchMedia(-1).catch(() => {});
    mediaNextBtn.onclick = () => switchMedia(1).catch(() => {});
    mediaCloseBtn.onclick = () => closeMediaViewer().catch(() => {});

    document.addEventListener('click', (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusMenuBtn) {
        plusMenu.classList.add('hidden');
      }
      if (e.target === mediaViewer) {
        closeMediaViewer().catch(() => {});
      }
    });

    document.addEventListener('keydown', (e) => {
      if (mediaViewer.classList.contains('hidden')) return;
      if (e.target === textInput || e.target === passwordInput) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        switchMedia(-1).catch(() => {});
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        switchMedia(1).catch(() => {});
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeMediaViewer().catch(() => {});
      }
    });

    mediaDialog.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        e.stopPropagation();
        switchMedia(-1).catch(() => {});
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        e.stopPropagation();
        switchMedia(1).catch(() => {});
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeMediaViewer().catch(() => {});
      }
    });

    scrollTopBtn.onclick = () => {
      animateChatScroll(0).catch(() => {});
    };
    scrollBottomBtn.onclick = () => {
      animateChatScroll(chat.scrollHeight - chat.clientHeight).catch(() => {});
    };

    setInterval(() => {
      if (token && !pollingInFlight) {
        pollingInFlight = true;
        loadMessages({ source: 'poll', followBottom: false, preserveScroll: true }).catch(() => {}).finally(() => {
          pollingInFlight = false;
        });
      }
      if (uploadTasks.size) renderUploadTasks();
    }, 1200);

    updateRefreshButtonState();
    updateScrollButtonState();
  </script>
</body>
</html>
