    function inferMimeTypeFromName(fileName) {
      const ext = getFileExtension(fileName);
      const map = {
        mp3: 'audio/mpeg',
        wav: 'audio/wav',
        flac: 'audio/flac',
        aac: 'audio/aac',
        m4a: 'audio/mp4',
        opus: 'audio/ogg',
        ogg: 'audio/ogg',
      };
      return map[ext] || null;
    }

    function openUploadTasksPanel() {
      uploadTaskOverlay.classList.remove('hidden');
      renderUploadTasks();
    }

    function hideUploadTasksPanel() {
      uploadTaskOverlay.classList.add('hidden');
    }

    function hasActiveUploadTasks() {
      for (const task of uploadTasks.values()) {
        if (task.status === 'queued' || task.status === 'uploading' || task.status === 'retrying' || task.status === 'thumbnailing') {
          return true;
        }
      }
      return false;
    }

    function makeFileKey(file) {
      return `${file.name}::${file.size}::${file.lastModified}::${file.type}`;
    }

    function normalizeUploadFile(file) {
      if (file.name?.trim()) return file;
      const ext = (file.type || '').split('/')[1] || 'bin';
      return new File([file], `upload-${Date.now()}.${ext}`, {
        type: file.type || 'application/octet-stream'
      });
    }

    const THUMBNAIL_MAX_DIMENSION = 480;

    function fitThumbnailSize(width, height, maxDimension = THUMBNAIL_MAX_DIMENSION) {
      const safeWidth = Math.max(1, Math.round(width || 1));
      const safeHeight = Math.max(1, Math.round(height || 1));
      const scale = Math.min(1, maxDimension / Math.max(safeWidth, safeHeight));
      return {
        width: Math.max(1, Math.round(safeWidth * scale)),
        height: Math.max(1, Math.round(safeHeight * scale)),
      };
    }

    function canvasToPngDataUrl(canvas) {
      return canvas.toDataURL('image/png');
    }

    async function buildImageThumbnailDataUrl(file) {
      const objectUrl = URL.createObjectURL(file);
      try {
        if ('createImageBitmap' in window) {
          try {
            const bitmap = await createImageBitmap(file);
            const { width, height } = fitThumbnailSize(bitmap.width, bitmap.height);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) return null;
            ctx.drawImage(bitmap, 0, 0, width, height);
            bitmap.close();
            return canvasToPngDataUrl(canvas);
          } catch (_) {
            // 回退到 <img> 解码路径
          }
        }
        const img = new Image();
        img.decoding = 'async';
        img.src = objectUrl;
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('图片缩略图生成失败'));
        });
        const { width, height } = fitThumbnailSize(img.naturalWidth || img.width, img.naturalHeight || img.height);
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;
        ctx.drawImage(img, 0, 0, width, height);
        return canvasToPngDataUrl(canvas);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    async function buildVideoThumbnailDataUrl(file) {
      const objectUrl = URL.createObjectURL(file);
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.playsInline = true;
      video.src = objectUrl;
      try {
        await new Promise((resolve, reject) => {
          const onLoaded = () => resolve();
          const onError = () => reject(new Error('视频缩略图生成失败'));
          video.addEventListener('loadeddata', onLoaded, { once: true });
          video.addEventListener('error', onError, { once: true });
        });
        if ((video.videoWidth || 0) <= 0 || (video.videoHeight || 0) <= 0) return null;
        const previewTime = Math.min(0.2, Math.max(0.04, (video.duration || 0) / 6));
        if (Number.isFinite(previewTime) && previewTime > 0) {
          await new Promise((resolve) => {
            const onSeeked = () => resolve();
            video.addEventListener('seeked', onSeeked, { once: true });
            try {
              video.currentTime = previewTime;
            } catch (_) {
              resolve();
            }
          });
        }
        const { width, height } = fitThumbnailSize(video.videoWidth, video.videoHeight);
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;
        ctx.drawImage(video, 0, 0, width, height);
        return canvasToPngDataUrl(canvas);
      } finally {
        video.pause();
        video.removeAttribute('src');
        video.load();
        URL.revokeObjectURL(objectUrl);
      }
    }

    function shouldPrepareThumbnail(file) {
      if (!file || file.size <= 0) return false;
      const type = String(file.type || '').toLowerCase();
      return type.startsWith('image/') || type.startsWith('video/');
    }

    function createThumbnailPromise(file) {
      if (!shouldPrepareThumbnail(file)) return Promise.resolve(null);
      const type = String(file.type || '').toLowerCase();
      const task = type.startsWith('video/') ? buildVideoThumbnailDataUrl(file) : buildImageThumbnailDataUrl(file);
      return task.catch(() => null);
    }

    function createTask(file) {
      const id = uploadTaskSeq++;
      const now = Date.now();
      const needsThumbnail = shouldPrepareThumbnail(file);
      const task = {
        id,
        file,
        fileKey: makeFileKey(file),
        name: file.name,
        totalBytes: file.size,
        uploadedBytes: 0,
        uploadId: '',
        status: 'queued',
        startedAt: now,
        completedAt: null,
        lastSampleAt: now,
        lastSampleBytes: 0,
        speedBps: 0,
        etaSec: null,
        error: '',
        retries: 0,
        needsThumbnail,
        thumbnailReady: !needsThumbnail,
        thumbnailDataUrl: null,
        thumbnailPromise: Promise.resolve(null),
        controllers: new Set(),
        chunks: [],
      };
      task.thumbnailPromise = (needsThumbnail ? createThumbnailPromise(file) : Promise.resolve(null)).then((dataUrl) => {
        task.thumbnailDataUrl = dataUrl;
        task.thumbnailReady = true;
        if (task.status === 'thumbnailing') renderUploadTasks();
        return dataUrl;
      });
      return task;
    }

    function elapsedSec(task) {
      const end = task.completedAt || Date.now();
      return Math.max(0, (end - task.startedAt) / 1000);
    }

    function updateTaskSpeed(task, uploadedDelta = 0) {
      const now = Date.now();
      task.samples = (task.samples || []).filter((sample) => now - sample.at <= 4000);
      if (uploadedDelta > 0) {
        task.samples.push({ at: now, bytes: uploadedDelta });
      }
      const windowMs = task.samples.length ? Math.max(400, now - task.samples[0].at) : Math.max(400, now - task.startedAt);
      const windowBytes = task.samples.reduce((sum, sample) => sum + sample.bytes, 0);
      task.speedBps = windowBytes > 0 ? windowBytes / (windowMs / 1000) : 0;
      const remain = task.totalBytes - task.uploadedBytes;
      task.etaSec = task.speedBps > 1 ? remain / task.speedBps : null;
      task.lastSampleAt = now;
      task.lastSampleBytes = task.uploadedBytes;
    }

    async function sha256Hex(blob) {
      const buffer = await blob.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function pauseOtherVideos(currentVideo) {
      document.querySelectorAll('video').forEach((video) => {
        if (video !== currentVideo) {
          video.pause();
        }
      });
    }

    async function persistActiveVideoProgress() {
      const item = mediaList[mediaIndex];
      const activeVideo = mediaStage.querySelector('video');
      if (!item || !activeVideo || !(item.mime_type || '').startsWith('video/')) return;
      await saveMediaProgress(item.file_id, activeVideo.currentTime || 0);
    }

    function buildChunkPlan(task, chunkSize, completedParts) {
      const doneMap = new Map();
      for (const part of completedParts || []) {
        doneMap.set(Number(part.start_byte), {
          start: Number(part.start_byte),
          end: Number(part.end_byte),
          checksum: part.checksum,
          done: true,
        });
      }

      const plan = [];
      for (let start = 0; start < task.totalBytes; start += chunkSize) {
        const end = Math.min(task.totalBytes, start + chunkSize);
        const existing = doneMap.get(start);
        plan.push({
          start,
          end,
          checksum: existing?.checksum || '',
          done: Boolean(existing && existing.end === end),
          inflight: false,
        });
      }
      return plan;
    }

    function renderUploadTasks() {
      if (!uploadTasks.size) {
        uploadTaskList.innerHTML = '<div class="footer-note">暂无上传任务</div>';
        return;
      }

      const list = Array.from(uploadTasks.values()).sort((a, b) => b.id - a.id);
      uploadTaskList.innerHTML = '';
      for (const t of list) {
        const card = document.createElement('div');
        card.className = 'task-card';
        const progress = t.totalBytes > 0 ? Math.min(100, (t.uploadedBytes / t.totalBytes) * 100) : 0;
        const elapsed = elapsedSec(t);
        const remain = t.etaSec;
        const totalEstimate = Number.isFinite(remain) ? elapsed + remain : null;

        card.innerHTML = `
          <div class="task-title">
            <div class="task-name" title="${t.name}">${t.name}</div>
            <div class="task-status">${taskStatusText(t.status)}</div>
          </div>
          <div class="progress"><div class="bar" style="width:${progress.toFixed(2)}%"></div></div>
          <div class="task-grid">
            <div>进度：${progress.toFixed(1)}%</div>
            <div>已上传：${formatBytes(t.uploadedBytes)}</div>
            <div>总大小：${formatBytes(t.totalBytes)}</div>
            <div>目前耗时：${formatDuration(elapsed)}</div>
            <div>预计剩余：${remain == null ? '--' : formatDuration(remain)}</div>
            <div>预计总耗时：${totalEstimate == null ? '--' : formatDuration(totalEstimate)}</div>
            <div>当前速度：${formatSpeed(t.speedBps)}</div>
          </div>
        `;

        if (t.error) {
          const err = document.createElement('div');
          err.className = 'footer-note';
          err.style.color = '#c43434';
          err.textContent = `错误：${t.error}`;
          card.appendChild(err);
        }

        if (t.status === 'uploading' || t.status === 'retrying' || t.status === 'queued') {
          const cancel = document.createElement('button');
          cancel.className = 'danger';
          cancel.textContent = '取消上传';
          cancel.onclick = () => cancelTask(t.id);
          cancel.style.marginTop = '8px';
          card.appendChild(cancel);
        }

        uploadTaskList.appendChild(card);
      }
    }

    async function cancelTask(taskId) {
      const task = uploadTasks.get(taskId);
      if (!task) return;
      task.status = 'cancelled';
      task.controllers.forEach((controller) => {
        controller.abort();
      });
      task.controllers.clear();
      if (task.uploadId) {
        try {
          await api('/api/uploads/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ upload_id: task.uploadId })
          });
        } catch (_) {}
      }
      renderUploadTasks();
    }

    async function processUploadTask(task) {
      const CHUNK_FALLBACK = 4 * 1024 * 1024;
      let chunkSize = CHUNK_FALLBACK;
      let parallelLimit = 4;

      try {
        const init = await api('/api/uploads/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_key: task.fileKey,
            file_name: task.file.name,
            file_size: task.file.size,
            mime_type: task.file.type || inferMimeTypeFromName(task.file.name),
          })
        });

        task.uploadId = init.upload_id;
        chunkSize = Number(init.chunk_size || CHUNK_FALLBACK);
        parallelLimit = Number(init.parallel_limit || 4);
        task.chunks = buildChunkPlan(task, chunkSize, init.completed_parts || []);
        task.uploadedBytes = task.chunks
          .filter((chunk) => chunk.done)
          .reduce((sum, chunk) => sum + (chunk.end - chunk.start), 0);
        task.status = 'uploading';
        updateTaskSpeed(task, 0);
        renderUploadTasks();

        const uploadChunk = async (chunk) => {
          while (!chunk.done) {
            if (task.status === 'cancelled') return;
            const blob = task.file.slice(chunk.start, chunk.end);
            const controller = new AbortController();
            task.controllers.add(controller);

            try {
              chunk.checksum = chunk.checksum || await sha256Hex(blob);
              const chunkResp = await api('/api/uploads/chunk', {
                method: 'POST',
                headers: {
                  'X-Upload-Id': task.uploadId,
                  'X-Start-Byte': String(chunk.start),
                  'X-Chunk-Sha256': chunk.checksum,
                },
                body: blob,
                signal: controller.signal,
              });

              chunk.done = true;
              chunk.inflight = false;
              task.controllers.delete(controller);
              task.uploadedBytes = Number(chunkResp.received_bytes || task.uploadedBytes);
              task.retries = 0;
              task.status = 'uploading';
              task.error = '';
              updateTaskSpeed(task, chunk.end - chunk.start);
              renderUploadTasks();
            } catch (err) {
              task.controllers.delete(controller);
              chunk.inflight = false;
              if (task.status === 'cancelled') return;
              task.retries += 1;
              if (task.retries > 5) throw err;

              task.status = 'retrying';
              task.error = `网络波动，重试第 ${task.retries} 次`;
              renderUploadTasks();
              await new Promise((r) => setTimeout(r, Math.min(1600, 250 * task.retries)));

              const resumed = await api('/api/uploads/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  file_key: task.fileKey,
                  file_name: task.file.name,
                  file_size: task.file.size,
                  mime_type: task.file.type || inferMimeTypeFromName(task.file.name),
                })
              });
              task.uploadId = resumed.upload_id;
              task.chunks = buildChunkPlan(task, chunkSize, resumed.completed_parts || []).map((nextChunk) => {
                const current = task.chunks.find((item) => item.start === nextChunk.start);
                return current?.done ? { ...current, done: true } : nextChunk;
              });
              task.uploadedBytes = Number(resumed.received_bytes || task.uploadedBytes);
            }
          }
        };

        const workers = Array.from({ length: Math.max(1, parallelLimit) }, async () => {
          while (true) {
            if (task.status === 'cancelled') return;
            const nextChunk = task.chunks.find((chunk) => !chunk.done && !chunk.inflight);
            if (!nextChunk) return;
            nextChunk.inflight = true;
            await uploadChunk(nextChunk);
          }
        });

        await Promise.all(workers);
        if (task.status === 'cancelled') return;

        if (task.needsThumbnail && !task.thumbnailReady) {
          task.status = 'thumbnailing';
          renderUploadTasks();
        }
        task.thumbnailDataUrl = await task.thumbnailPromise;

        const completed = await api('/api/uploads/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ upload_id: task.uploadId, thumbnail_data_url: task.thumbnailDataUrl })
        });
        markMessageAsSelf(completed.id);

        task.status = 'done';
        task.completedAt = Date.now();
        task.error = '';
        task.controllers.clear();
        updateTaskSpeed(task, 0);
        renderUploadTasks();
        if (!hasActiveUploadTasks()) {
          hideUploadTasksPanel();
        }
        await loadMessages({ source: 'upload-complete', followBottom: false, preserveScroll: true });
        await animateChatScroll(chat.scrollHeight - chat.clientHeight);
      } catch (err) {
        if (task.status !== 'cancelled') {
          task.status = 'error';
          task.error = err?.message || String(err);
          task.completedAt = Date.now();
          renderUploadTasks();
          if (!hasActiveUploadTasks()) {
            hideUploadTasksPanel();
          }
        }
      }
    }

    async function enqueueFiles(rawFiles) {
      const files = Array.from(rawFiles || []).map(normalizeUploadFile);
      if (!files.length) return;

      openUploadTasksPanel();
      for (const file of files) {
        const task = createTask(file);
        uploadTasks.set(task.id, task);
        renderUploadTasks();
        processUploadTask(task);
      }
    }

    async function handleRestartClick() {
      const confirmed = await openConfirmDialog({
        title: '确认重启服务',
        message: '服务重启后，当前会话可能会短暂中断。',
      });
      if (!confirmed) return;
      const result = await api('/api/admin/restart', { method: 'POST' });
      restartBtn.disabled = true;
      restartBtn.textContent = '正在重启...';
      alert(result.message || '重启请求已发送');
    }

    async function deleteSelected() {
      if (!selectedIds.size) {
        alert('请先勾选要删除的记录');
        return;
      }
      const deletingIds = new Set(selectedIds);
      allMessages
        .filter((msg) => deletingIds.has(msg.id) && msg.file_id)
        .forEach((msg) => {
          mediaProgressCache.delete(msg.file_id);
          mediaCompatibilityCache.delete(msg.file_id);
          audioVisualCache.delete(msg.file_id);
        });
      await api('/api/messages', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: Array.from(selectedIds) })
      });
      selectedIds.clear();
      await loadMessages({ source: 'delete', followBottom: false, preserveScroll: true });
    }

    async function handleDeleteClick() {
      if (!selectedIds.size) {
        alert('请先勾选要删除的记录');
        return;
      }
      const confirmed = await openConfirmDialog({
        title: '确认删除所选',
        message: `即将删除 ${selectedIds.size} 条已选记录，此操作不可撤销。`,
      });
      if (!confirmed) return;
      await deleteSelected();
    }

    function selectAllVisible() {
      for (const m of getVisibleMessages()) selectedIds.add(m.id);
      renderMessages({ preserveScroll: true });
    }

    function invertVisible() {
      for (const m of getVisibleMessages()) {
        if (selectedIds.has(m.id)) selectedIds.delete(m.id);
        else selectedIds.add(m.id);
      }
      renderMessages({ preserveScroll: true });
    }

    loginBtn.onclick = login;
    logoutBtn.onclick = () => handleLogoutClick().catch((e) => alert(e.message));
    sendTextBtn.onclick = () => sendText().catch((e) => alert(e.message));
    let openEditorPointerHandledAt = 0;
    openEditorBtn.onclick = () => {
      if (Date.now() - openEditorPointerHandledAt < 400) return;
      triggerOpenDraftEditor().catch((e) => alert(e.message));
    };
    openEditorBtn.addEventListener('pointerup', (event) => {
      if (event.pointerType !== 'touch') return;
      openEditorPointerHandledAt = Date.now();
      event.preventDefault();
      triggerOpenDraftEditor().catch((e) => alert(e.message));
    });

    plusMenuBtn.onclick = () => {
      toggleFilterMenu(false);
      plusMenu.classList.toggle('hidden');
    };
    pickImageBtn.onclick = () => imageUploadInput.click();
    pickVideoBtn.onclick = () => videoUploadInput.click();
    pickAudioBtn.onclick = () => audioUploadInput.click();
    pickFileBtn.onclick = () => fileUploadInput.click();
    imageUploadInput.onchange = () => {
      enqueueFiles(imageUploadInput.files).catch((e) => alert(e.message));
      imageUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };
    videoUploadInput.onchange = () => {
      enqueueFiles(videoUploadInput.files).catch((e) => alert(e.message));
      videoUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };
    audioUploadInput.onchange = () => {
      enqueueFiles(audioUploadInput.files).catch((e) => alert(e.message));
      audioUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };
    fileUploadInput.onchange = () => {
      enqueueFiles(fileUploadInput.files).catch((e) => alert(e.message));
      fileUploadInput.value = '';
      plusMenu.classList.add('hidden');
    };

    restartBtn.onclick = () => handleRestartClick().catch((e) => alert(e.message));

    manageBtn.onclick = () => {
      manageMode = !manageMode;
      updateManageUi();
    };
    exitManageBtn.onclick = () => {
      manageMode = false;
      updateManageUi();
    };

    deleteBtn.onclick = () => handleDeleteClick().catch((e) => alert(e.message));
    resetSizeBtn.onclick = async () => {
      try {
        const confirmed = await openConfirmDialog({
          title: '确认恢复窗口高度',
          message: '这会把聊天区和输入区高度恢复为默认值。',
        });
        if (!confirmed) return;
        await restoreDefaultUiState();
      } catch (e) {
        alert(e.message);
      }
    };
    selectAllBtn.onclick = selectAllVisible;
    invertSelectBtn.onclick = invertVisible;
    searchBtn.onclick = () => {
      toggleFilterMenu(false);
      openSearchDialog();
    };
    filterMenuBtn.onclick = () => {
      plusMenu.classList.add('hidden');
      toggleFilterMenu();
    };
    clearSearchBtn.onclick = () => {
      searchInput.value = '';
      applySearchQuery('');
      closeSearchDialog();
    };
    closeSearchBtn.onclick = closeSearchDialog;
    confirmCancelBtn.onclick = () => closeConfirmDialog(false);
    confirmActionBtn.onclick = () => closeConfirmDialog(true);
    largePasteCancelBtn.onclick = () => {
      activeLargePasteSession?.onCancel?.();
    };
    confirmSearchBtn.onclick = () => {
      applySearchQuery(searchInput.value);
      closeSearchDialog();
    };
    filterButtons.forEach((button) => {
      button.onclick = () => {
        currentFilter = button.dataset.filter || 'all';
        updateFilterButtonStates();
        toggleFilterMenu(false);
        renderMessages({ preserveScroll: true });
      };
    });

    textInput.addEventListener('input', syncInputVirtualization);
    textInput.addEventListener('pointerdown', () => {
      textInputStage.classList.add('mirror-disabled');
      showInputScrollIndicator();
    });
    textInput.addEventListener('mousedown', () => {
      textInputStage.classList.add('mirror-disabled');
      showInputScrollIndicator();
    });
    textInput.addEventListener('scroll', () => {
      syncInputVirtualization();
      syncInputScrollIndicator(true);
    });
    textInput.addEventListener('click', () => {
      syncInputVirtualization();
      syncInputScrollIndicator(true);
    });
    textInput.addEventListener('keyup', () => {
      syncInputVirtualization();
      syncInputScrollIndicator(false);
    });
    textInput.addEventListener('focus', () => {
      syncInputVirtualization();
      syncInputScrollIndicator(true);
    });
    textInput.addEventListener('blur', () => {
      syncInputVirtualization();
      syncInputScrollIndicator(false);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        applySearchQuery(searchInput.value);
        closeSearchDialog();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeSearchDialog();
      }
    });

    uploadTasksBtn.onclick = openUploadTasksPanel;
    hideTaskPanelBtn.onclick = hideUploadTasksPanel;
    clearFinishedBtn.onclick = () => {
      for (const [id, t] of uploadTasks.entries()) {
        if (t.status === 'done' || t.status === 'cancelled' || t.status === 'error') {
          uploadTasks.delete(id);
        }
      }
      renderUploadTasks();
    };

    textInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const start = textInput.selectionStart ?? textInput.value.length;
        const end = textInput.selectionEnd ?? textInput.value.length;
        textInput.value = `${textInput.value.slice(0, start)}\n${textInput.value.slice(end)}`;
        textInput.selectionStart = textInput.selectionEnd = start + 1;
        syncInputVirtualization();
        return;
      }
      if (!e.shiftKey) {
        e.preventDefault();
        sendText().catch((err) => alert(err.message));
      }
    });

    textInput.addEventListener('paste', (e) => {
      textInputStage.classList.add('mirror-disabled');
      const files = extractClipboardFiles(e.clipboardData?.items);
      if (files.length) {
        e.preventDefault();
        enqueueFiles(files).catch((err) => alert(err.message));
        return;
      }
      if (handleLargeTextPaste(e, textInput, {
        onChunk: () => requestAnimationFrame(syncInputVirtualization),
      })) {
        requestAnimationFrame(syncInputVirtualization);
        return;
      }
      requestAnimationFrame(syncInputVirtualization);
    });

    textInputStage.addEventListener('dragenter', (e) => {
      if (!transferHasFiles(e.dataTransfer)) return;
      e.preventDefault();
      inputDragDepth += 1;
      setInputDragActive(true);
    });
    textInputStage.addEventListener('dragover', (e) => {
      if (!transferHasFiles(e.dataTransfer)) return;
      e.preventDefault();
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
      if (!textInputStage.classList.contains('drag-upload-active')) {
        setInputDragActive(true);
      }
    });
    textInputStage.addEventListener('dragleave', (e) => {
      if (!transferHasFiles(e.dataTransfer)) return;
      e.preventDefault();
      inputDragDepth = Math.max(0, inputDragDepth - 1);
      if (!textInputStage.contains(e.relatedTarget) && inputDragDepth === 0) {
        setInputDragActive(false);
      }
    });
    textInputStage.addEventListener('drop', (e) => {
      if (!transferHasFiles(e.dataTransfer)) return;
      e.preventDefault();
      inputDragDepth = 0;
      setInputDragActive(false);
      enqueueFiles(e.dataTransfer?.files || []).catch((err) => alert(err.message));
    });

    chat.addEventListener('scroll', () => {
      scheduleChatScrollSettle();
      const chatState = ensureChatVirtualState();
      if (chatState.shouldVirtualize || getVisibleMessages().length >= CHAT_VIRTUALIZE_THRESHOLD) {
        scheduleChatViewportRender();
      }
      updateScrollButtonState();
      syncChatScrollIndicator(true);
      if (pendingMessages && isChatNearBottom()) {
        flushPendingMessages({ followBottom: true });
      }
    });
    chat.addEventListener('pointerdown', () => showChatScrollIndicator(), { passive: true });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    fetchPublicConfig().catch(() => {});
    bindChatScrollIndicatorDrag();
    bindInputScrollIndicatorDrag();
    bindResizeGrip(chatResizeGrip, chat, {
      minHeight: 220,
      maxHeight: window.innerHeight * 0.86,
      onUpdate: () => {
        syncChatScrollIndicator(true);
        scheduleChatViewportRender();
      },
    });
    bindResizeGrip(inputResizeGrip, textInput, {
      minHeight: 110,
      maxHeight: Math.max(180, window.innerHeight * 0.55),
      onUpdate: () => {
        syncInputVirtualization();
        syncInputScrollIndicator(true);
      },
    });

    try {
      const cached = localStorage.getItem(REMEMBER_PASSWORD_KEY);
      if (cached) {
        passwordInput.value = cached;
        rememberPassword.checked = true;
        setTimeout(() => {
          login().catch(() => {});
        }, 0);
      }
    } catch (_) {}

    const resizeObserver = new ResizeObserver(() => {
      scheduleUiStateSave();
      updateScrollButtonState();
      syncChatScrollIndicator(false);
      scheduleChatViewportRender();
      syncInputVirtualization();
      syncInputScrollIndicator(false);
      updateResetSizeButtonState();
    });
    resizeObserver.observe(chat);
    resizeObserver.observe(textInput);

    mediaPrevBtn.onclick = () => switchMedia(-1).catch(() => {});
    mediaNextBtn.onclick = () => switchMedia(1).catch(() => {});
    mediaCopyBtn.onclick = async () => {
      if (currentViewerMode === 'editor') {
        try {
          await copyRawText(activeEditorState?.textarea?.value || '');
          showToast('复制成功');
        } catch (err) {
          showToast(err.message || '复制失败', 'error');
        }
        return;
      }
      const item = mediaList[mediaIndex];
      if (!item || !(item.kind === 'text' || isTextLikeFileMessage(item))) return;
      try {
        const payload = await getViewerTextPayload(item);
        await copyRawText(payload.content || '');
        showToast('复制成功');
      } catch (err) {
        showToast(err.message || '复制失败', 'error');
      }
    };
    mediaCloseBtn.onclick = () => closeMediaViewer().catch(() => {});

    document.addEventListener('click', (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusMenuBtn) {
        plusMenu.classList.add('hidden');
      }
      if (!filterMenu.contains(e.target) && e.target !== filterMenuBtn) {
        toggleFilterMenu(false);
      }
      if (e.target === searchOverlay) {
        closeSearchDialog();
      }
      if (e.target === confirmOverlay) {
        closeConfirmDialog(false);
      }
      if (e.target === uploadTaskOverlay) {
        hideUploadTasksPanel();
      }
      if (e.target === mediaViewer) {
        closeMediaViewer().catch(() => {});
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!confirmOverlay.classList.contains('hidden') && e.key === 'Escape') {
        e.preventDefault();
        closeConfirmDialog(false);
        return;
      }
      if (mediaViewer.classList.contains('hidden')) return;
      if (e.target === textInput || e.target === passwordInput || e.target === activeEditorState?.textarea) return;
      if (currentViewerMode === 'editor') {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeMediaViewer().catch(() => {});
        }
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        switchMedia(-1).catch(() => {});
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        switchMedia(1).catch(() => {});
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeMediaViewer().catch(() => {});
      }
    });

    mediaDialog.addEventListener('keydown', (e) => {
      if (currentViewerMode === 'editor') {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          closeMediaViewer().catch(() => {});
        }
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        e.stopPropagation();
        switchMedia(-1).catch(() => {});
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        e.stopPropagation();
        switchMedia(1).catch(() => {});
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeMediaViewer().catch(() => {});
      }
    });

    scrollTopBtn.onclick = () => {
      animateChatScroll(0).catch(() => {});
    };
    scrollBottomBtn.onclick = () => {
      animateChatScroll(chat.scrollHeight - chat.clientHeight).catch(() => {});
    };

    setInterval(() => {
      if (token && !pollingInFlight) {
        pollingInFlight = true;
        loadMessages({ source: 'poll', followBottom: false, preserveScroll: true }).catch(() => {}).finally(() => {
          pollingInFlight = false;
        });
      }
      if (uploadTasks.size) renderUploadTasks();
    }, 1200);

    updateRefreshButtonState();
    updateScrollButtonState();
    updateFilterButtonStates();
    syncInputVirtualization();
  </script>
</body>
</html>
