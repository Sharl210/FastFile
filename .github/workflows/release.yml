name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: fastfile
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin: fastfile
            linker: aarch64-linux-gnu-gcc
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: fastfile
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: fastfile.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (default)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Pack (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -e
          APP="fastfile-${{ matrix.target }}"
          mkdir -p dist/$APP
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/$APP/
          cp README.md dist/$APP/
          cp fastfile.env dist/$APP/
          tar -czf dist/${APP}.tar.gz -C dist $APP

      - name: Pack (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $app = "fastfile-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$app" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$app/"
          Copy-Item "README.md" "dist/$app/"
          Copy-Item "fastfile.env" "dist/$app/"
          Compress-Archive -Path "dist/$app/*" -DestinationPath "dist/$app.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          generate_release_notes: true
